name: Deploy & Scrape

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Every hour

permissions:
  contents: read
  id-token: write

jobs:
  setup-kv:
    name: Setup KV Namespaces
    runs-on: ubuntu-latest
    outputs:
      cache_ns_id: ${{ steps.create_cache.outputs.namespace_id }}
      scrape_ns_id: ${{ steps.create_scrape.outputs.namespace_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Debug secrets
        run: |
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Account ID starts with: ${CLOUDFLARE_ACCOUNT_ID:0:8}..."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test wrangler auth
        run: wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create CACHE namespace
        id: create_cache
        run: |
          OUTPUT=$(wrangler kv namespace create "CACHE" 2>&1)
          echo "$OUTPUT"
          NS_ID=$(echo "$OUTPUT" | grep -oE '[a-f0-9]{32}' | head -1)
          echo "Created namespace ID: $NS_ID"
          echo "namespace_id=$NS_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create SCRAPE_DATA namespace
        id: create_scrape
        run: |
          OUTPUT=$(wrangler kv namespace create "SCRAPE_DATA" 2>&1)
          echo "$OUTPUT"
          NS_ID=$(echo "$OUTPUT" | grep -oE '[a-f0-9]{32}' | head -1)
          echo "Created namespace ID: $NS_ID"
          echo "namespace_id=$NS_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: setup-kv
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Update wrangler.toml with KV IDs
        run: |
          sed -i "s/your-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  run-scraper:
    name: Run Scraper (GitHub Actions)
    runs-on: ubuntu-latest
    needs: setup-kv
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CACHE_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.cache_ns_id }}
          SCRAPE_DATA_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.scrape_ns_id }}
        run: python scraper_kv.py

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build static folder (inject API URL)
        env:
          API_URL: https://porn-archive-api.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev
        run: |
          ls -la
          mkdir -p static
          cp index.html static/index.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy static --project-name=porn-archive --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}