name: Deploy Worker + Frontend

# Schedules live in scrape-live.yml and scrape-full.yml (separate concurrency groups, so they never block each other
# or a deploy).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  setup-kv:
    name: Setup KV Namespaces
    runs-on: ubuntu-latest
    outputs:
      cache_ns_id: ${{ steps.ns.outputs.cache_ns_id }}
      scrape_ns_id: ${{ steps.ns.outputs.scrape_ns_id }}
      d1_id: ${{ steps.d1.outputs.d1_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Find or create KV namespaces
        id: ns
        run: bash .github/scripts/kv_ids.sh
      - name: Find or create the D1 database (accounts + synced favorites)
        id: d1
        run: bash .github/scripts/d1_id.sh

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: setup-kv
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Inject KV namespace IDs into wrangler.toml
        run: |
          sed -i "s/your-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          grep -n 'id *=' wrangler.toml

      - name: D1 database (login + sync)
        env:
          D1_ID: ${{ needs.setup-kv.outputs.d1_id }}
        run: |
          if [ -n "${D1_ID:-}" ]; then
            sed -i "s/your-d1-database-id/${D1_ID}/" wrangler.toml
            wrangler d1 execute porn-archive-db --remote --file=migrations/0001_auth.sql \
              || echo "::warning::D1 migration 0001 failed - check the API token has D1: Edit"
            # 0002 migrates an OLD users table (email + login_codes) to the new schema (username + password_hash + is_admin).
            # CREATE TABLE IF NOT EXISTS in 0001 does not modify an existing table, so this is needed when the schema changed.
            wrangler d1 execute porn-archive-db --remote --file=migrations/0002_alter_users.sql \
              || echo "::warning::D1 migration 0002 failed"
            # 0003 clears the rate-limit counters (a schema bug can exhaust them legitimately).
            wrangler d1 execute porn-archive-db --remote --file=migrations/0003_clear_rate.sql \
              || echo "::warning::D1 migration 0003 failed"
            # 0004 = admin audit log (admin panel)
            wrangler d1 execute porn-archive-db --remote --file=migrations/0004_admin.sql \
              || echo "::warning::D1 migration 0004 failed"
          else
            # no database: remove the binding so the deploy still succeeds (login stays off)
            sed -i '/^\[\[d1_databases\]\]/,/^database_id/d' wrangler.toml
          fi

      - name: Install dependencies
        run: if [ -f package.json ]; then npm install; fi

      - name: Deploy Worker
        id: deploy
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}          # optional: live Flask backend (see LIVE_MODE.md)
          MODE: ${{ vars.WORKER_MODE }}                    # optional repo variable: "live" (default) or "kv"
          EXTRA_HOSTS: ${{ vars.ALLOWED_HOSTS }}           # optional repo variable: extra scrapable hosts, comma separated
          CB_WM: ${{ vars.CHATURBATE_WM }}                 # optional repo variable: Chaturbate affiliate slug for the fallback endpoint
          CAMS: ${{ vars.CAM_PROVIDERS }}                  # optional repo variable: e.g. "chaturbate,cam4" to limit the direct cam platforms
        run: |
          EXTRA="--var GITHUB_REPO:${{ github.repository }} --var GITHUB_REF:${{ github.ref_name }}"
          if [ -n "${BACKEND_URL:-}" ]; then EXTRA="$EXTRA --var BACKEND_URL:${BACKEND_URL}"; fi
          if [ -n "${MODE:-}" ]; then EXTRA="$EXTRA --var MODE:${MODE}"; fi
          if [ -n "${EXTRA_HOSTS:-}" ]; then EXTRA="$EXTRA --var ALLOWED_HOSTS:${EXTRA_HOSTS}"; fi
          if [ -n "${CB_WM:-}" ]; then EXTRA="$EXTRA --var CHATURBATE_WM:${CB_WM}"; fi
          if [ -n "${CAMS:-}" ]; then EXTRA="$EXTRA --var CAM_PROVIDERS:${CAMS}"; fi
          ARGS=()
          wrangler deploy $EXTRA "${ARGS[@]}" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            SUB=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | jq -r '.result.subdomain // empty')
            [ -n "$SUB" ] && URL="https://porn-archive-api.${SUB}.workers.dev"
          fi
          [ -n "$URL" ] || { echo "Could not determine Worker URL"; exit 1; }
          echo "Worker URL: $URL"
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"

      # Optional watchdog: lets the Worker's cron start the scraper workflow when data is stale.
      # Create a fine-grained token (this repo, Actions: Read and write) and save it as the secret GH_DISPATCH_TOKEN.
      - name: Give the Worker its watchdog token (optional)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "${GH_DISPATCH_TOKEN:-}" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | wrangler secret put GITHUB_TOKEN
          else
            echo "GH_DISPATCH_TOKEN not set - watchdog disabled (cams still self-refresh inside Cloudflare)"
          fi

      # Login secrets (GitHub repo secrets -> Worker secrets). Needed: AUTH_SECRET (signs session tokens).
      - name: Give the Worker its login secret (optional)
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          if [ -n "${AUTH_SECRET:-}" ]; then printf '%s' "$AUTH_SECRET" | wrangler secret put AUTH_SECRET; else echo "AUTH_SECRET not set - login stays off"; fi

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/healthz"; then echo; exit 0; fi
            sleep 4
          done
          echo "healthz did not answer" >&2; exit 1

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build static folder (inject API URL)
        env:
          API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          test -n "$API_URL" || { echo "API_URL empty"; exit 1; }
          mkdir -p static
          cp index.html static/index.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html
          grep -c "$API_URL" static/index.html
          # admin panel page (same API address injected; never framed, never cached, never indexed)
          cp admin.html static/admin.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/admin.html
          grep -c "$API_URL" static/admin.html
          printf '/admin.html\n  X-Frame-Options: DENY\n  Cache-Control: no-store\n  X-Robots-Tag: noindex\n  Referrer-Policy: no-referrer\n' > static/_headers

      - name: Ensure Pages project exists
        run: wrangler pages project create porn-archive --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy static --project-name=porn-archive --branch=main

  first-scrape:
    name: Fill the cache (manual deploys only)
    # NOT on every push: each full scrape can use up to ~190 of the free plan's 1,000 KV writes/day, and a few pushes in one
    # day exhausted it (HTTP 429 on every write). The schedule fills the cache; run "Deploy" by hand to force a scrape.
    if: github.event_name == 'workflow_dispatch'
    needs: deploy-worker
    uses: ./.github/workflows/scrape-full.yml
    secrets: inherit
