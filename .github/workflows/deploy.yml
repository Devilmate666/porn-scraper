name: Deploy & Scrape

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KV free tier = 1,000 writes/day. Every 6h is ~4 runs/day. Use '0 * * * *' only on a paid plan.
    - cron: '0 */6 * * *'   # full scrape (feeds, listings, search, metadata)
    - cron: '30 * * * *'    # live cams / TV channels only (3 KV writes)

permissions:
  contents: read

concurrency:
  group: deploy-and-scrape
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  setup-kv:
    name: Setup KV Namespaces
    runs-on: ubuntu-latest
    outputs:
      cache_ns_id: ${{ steps.ns.outputs.cache_ns_id }}
      scrape_ns_id: ${{ steps.ns.outputs.scrape_ns_id }}
    steps:
      - name: Find or create KV namespaces (Cloudflare API)
        id: ns
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          LIST=$(curl -sS -H "$AUTH" "$API?per_page=100")
          echo "$LIST" | jq -e '.success == true' >/dev/null || { echo "KV list failed: $LIST"; exit 1; }

          ensure_ns() {
            local name="$1" id
            # accept old names too, so existing namespaces (and their data) are reused
            id=$(echo "$LIST" | jq -r --arg a "$name" --arg b "porn-archive-api-$name" --arg c "porn-archive-$name" \
              '[.result[] | select(.title==$a or .title==$b or .title==$c)][0].id // empty')
            if [ -z "$id" ]; then
              echo "Creating namespace porn-archive-$name" >&2
              id=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"title\":\"porn-archive-$name\"}" "$API" | jq -r '.result.id // empty')
            fi
            [ -n "$id" ] || { echo "Could not find/create namespace $name" >&2; exit 1; }
            echo "$id"
          }

          CACHE_ID=$(ensure_ns CACHE)
          SCRAPE_ID=$(ensure_ns SCRAPE_DATA)
          echo "CACHE=$CACHE_ID SCRAPE_DATA=$SCRAPE_ID"
          echo "cache_ns_id=$CACHE_ID" >> "$GITHUB_OUTPUT"
          echo "scrape_ns_id=$SCRAPE_ID" >> "$GITHUB_OUTPUT"

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: setup-kv
    if: github.event_name != 'schedule'
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Inject KV namespace IDs into wrangler.toml
        run: |
          sed -i "s/your-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          grep -n 'id *=' wrangler.toml

      - name: Install dependencies
        run: if [ -f package.json ]; then npm install; fi

      - name: Deploy Worker
        id: deploy
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}   # optional: live Flask backend
        run: |
          EXTRA=""
          if [ -n "${BACKEND_URL:-}" ]; then EXTRA="--var BACKEND_URL:${BACKEND_URL}"; fi
          wrangler deploy $EXTRA 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            SUB=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | jq -r '.result.subdomain // empty')
            [ -n "$SUB" ] && URL="https://porn-archive-api.${SUB}.workers.dev"
          fi
          [ -n "$URL" ] || { echo "Could not determine Worker URL"; exit 1; }
          echo "Worker URL: $URL"
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"

  run-scraper:
    name: Run Scraper
    runs-on: ubuntu-latest
    needs: setup-kv
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests httpx beautifulsoup4 lxml

      - name: Run scraper
        env:
          CACHE_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.cache_ns_id }}
          SCRAPE_DATA_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.scrape_ns_id }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 * * * *" ]; then
            python scraper_kv.py --only live
          else
            python scraper_kv.py
          fi

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build static folder (inject API URL)
        env:
          API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          test -n "$API_URL" || { echo "API_URL empty"; exit 1; }
          mkdir -p static
          cp index.html static/index.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html
          grep -c "$API_URL" static/index.html

      - name: Ensure Pages project exists
        run: wrangler pages project create porn-archive --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy static --project-name=porn-archive --branch=main
