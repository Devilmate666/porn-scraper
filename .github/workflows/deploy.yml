name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt || pip install --no-cache-dir Flask Flask-CORS httpx beautifulsoup4 lxml

      - name: Build static assets
        run: |
          python - <<EOF
          import os
          os.makedirs('static', exist_ok=True)
          with open('static/index.html', 'w', encoding='utf-8') as f:
              f.write(open('index.html', encoding='utf-8').read())
          print("✅ index.html copied to static/")
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: porn-scraper
          directory: .
          branch: ${{ github.ref_name }}
          wranglerConfigPath: wrangler.toml
          onDestroy: 'delete'
