name: Deploy & Scrape

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Every hour

permissions:
  contents: read
  id-token: write

env:
  CLOUDFLARE_ACCOUNT_ID: 7e5a85454cd58ec9c3f4dab65a7eca9e

jobs:
  setup-kv:
    name: Setup KV Namespaces
    runs-on: ubuntu-latest
    outputs:
      cache_ns_id: ${{ steps.get_namespaces.outputs.cache_ns_id }}
      scrape_ns_id: ${{ steps.get_namespaces.outputs.scrape_ns_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Get KV namespace IDs
        id: get_namespaces
        run: |
          OUTPUT=$(wrangler kv namespace list --json 2>/dev/null)
          echo "$OUTPUT"
          CACHE_ID=$(echo "$OUTPUT" | jq -r '.[] | select(.title=="CACHE" or .title=="porn-archive-api-CACHE") | .id')
          SCRAPE_ID=$(echo "$OUTPUT" | jq -r '.[] | select(.title=="SCRAPE_DATA" or .title=="porn-archive-api-SCRAPE_DATA") | .id')
          
          if [ -z "$CACHE_ID" ] || [ "$CACHE_ID" = "null" ]; then
            echo "Creating CACHE namespace..."
            OUTPUT=$(wrangler kv namespace create "CACHE" 2>&1)
            echo "$OUTPUT"
            CACHE_ID=$(echo "$OUTPUT" | grep -oE '[a-f0-9]{32}' | head -1)
          fi
          
          if [ -z "$SCRAPE_ID" ] || [ "$SCRAPE_ID" = "null" ]; then
            echo "Creating SCRAPE_DATA namespace..."
            OUTPUT=$(wrangler kv namespace create "SCRAPE_DATA" 2>&1)
            echo "$OUTPUT"
            SCRAPE_ID=$(echo "$OUTPUT" | grep -oE '[a-f0-9]{32}' | head -1)
          fi
          
          echo "Using CACHE: $CACHE_ID"
          echo "Using SCRAPE_DATA: $SCRAPE_ID"
          echo "cache_ns_id=$CACHE_ID" >> $GITHUB_OUTPUT
          echo "scrape_ns_id=$SCRAPE_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: setup-kv
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Update wrangler.toml with KV IDs
        run: |
          sed -i "s/your-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker
        id: deploy
        run: |
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "Could not find Worker URL in deploy output"; exit 1; fi
          echo "Worker URL: $URL"
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  run-scraper:
    name: Run Scraper (GitHub Actions)
    runs-on: ubuntu-latest
    needs: setup-kv
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CACHE_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.cache_ns_id }}
          SCRAPE_DATA_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.scrape_ns_id }}
        run: python scraper_kv.py

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Build static folder (inject API URL)
        env:
          API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          test -n "$API_URL" || { echo 'API_URL empty'; exit 1; }
          mkdir -p static
          cp index.html static/index.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html

      - name: Ensure Pages project exists
        run: wrangler pages project create porn-archive --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy static --project-name=porn-archive --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Show Pages URL
        run: |
          echo "Frontend URL: https://porn-archive.pages.dev"