name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend -> Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build static folder (inject API URL)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          mkdir -p static
          cp index.html static/index.html
          if [ -n "$API_URL" ]; then
            sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name=porn-archive --branch=main
