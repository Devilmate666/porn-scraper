name: Deploy & Scrape

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Every hour

permissions:
  contents: read
  id-token: write

jobs:
  setup-kv:
    name: Setup KV Namespaces
    runs-on: ubuntu-latest
    outputs:
      cache_ns_id: ${{ steps.create_cache.outputs.namespace_id }}
      scrape_ns_id: ${{ steps.create_scrape.outputs.namespace_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create CACHE namespace
        id: create_cache
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv:namespace create "CACHE" --preview false

      - name: Create SCRAPE_DATA namespace
        id: create_scrape
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv:namespace create "SCRAPE_DATA" --preview false

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: setup-kv
    steps:
      - uses: actions/checkout@v4

      - name: Update wrangler.toml with KV IDs
        run: |
          sed -i "s/your-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-kv-namespace-id/${{ needs.setup-kv.outputs.cache_ns_id }}/" wrangler.toml
          sed -i "s/your-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml
          sed -i "s/your-preview-scrape-data-kv-id/${{ needs.setup-kv.outputs.scrape_ns_id }}/" wrangler.toml

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ./

  run-scraper:
    name: Run Scraper (GitHub Actions)
    runs-on: ubuntu-latest
    needs: setup-kv
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run scraper
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CACHE_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.cache_ns_id }}
          SCRAPE_DATA_KV_NAMESPACE_ID: ${{ needs.setup-kv.outputs.scrape_ns_id }}
        run: python scraper_kv.py

  frontend:
    name: Frontend -> Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - name: Build static folder (inject API URL)
        env:
          API_URL: https://porn-archive-api.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev
        run: |
          mkdir -p static
          cp index.html static/index.html
          sed -i "s|__API_BASE__|${API_URL%/}|g" static/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name=porn-archive --branch=main