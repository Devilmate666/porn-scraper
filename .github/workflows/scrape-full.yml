name: Scrape full (feeds, listings, search, metadata)

on:
  schedule:
    - cron: '17 */12 * * *'       # KV free tier = 1,000 writes/day shared by everything: 2 full runs/day. Off-peak minute on purpose.
  workflow_dispatch:
  workflow_call:                   # deploy.yml runs this once after every deploy

permissions:
  contents: read

concurrency:
  group: scrape-full
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  scrape:
    name: Full scrape
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: KV namespaces
        id: ns
        run: bash .github/scripts/kv_ids.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests httpx beautifulsoup4 lxml

      - name: Cache the headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install the headless browser (lemoncams.com is JavaScript-only)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          CACHE_KV_NAMESPACE_ID: ${{ steps.ns.outputs.cache_ns_id }}
          SCRAPE_DATA_KV_NAMESPACE_ID: ${{ steps.ns.outputs.scrape_ns_id }}
          CAMS_CRAWL_SECONDS: '300'
          CAMS_CRAWL_PAGES: '80'
          SCRAPE_BUDGET_SECONDS: '2000'     # stop starting new work at ~33 min so the run ends cleanly before the 40 min limit
          MAX_KV_WRITES: '180'              # per-run budget of CHANGED pages (unchanged ones are skipped for free; live data + the index are exempt). 2 runs x 180 = 360 of the free tier's 1,000 writes/day
        run: python scraper_kv.py
