/* ==============================================================
   SEARCH — live search is the only search.

   How it works
   • One box. Every feed (Home, a website, a category, a studio / network) keeps its OWN text and searches
     only its own videos. Switching feeds swaps the text; coming back restores it.
   • Typing finds the FIRST PAGE of matches (6), then shows exactly those 6. Until then only shimmer cards are
     shown (never half-filled results).
   • Scrolling to the bottom reveals the NEXT 6 matches, and so on. Matches that are already loaded are revealed
     first; more pages are fetched only when the loaded ones cannot fill the next 6.
   • It checks one new page at a time and reuses pages already loaded, avoiding background and over-fetching.
   • After the first page, more is revealed / loaded ONLY when you scroll to the end. Nothing is fetched in the background.
   • Enter does nothing. Esc clears the box. 🔀 Shuffle shuffles the open feed.
============================================================== */
const SEARCH = {
  pageSize:    6,           // matches revealed per step: the first page, then +6 on every scroll step
  firstPage:   6,           // matches needed before results are shown
  depthSingle: [1],         // inspect one new page before deciding whether another is needed
  depthMix:    [1],         // inspect one new page per source before deciding whether another is needed
  scrollDepth: 1,           // do not scrape past the next six matching results
  revealMaxSteps:  6,       // page-batches one scroll step may load to find the next 6 matches
  revealMaxWaitMs: 8000,    // ...or stop after this long if at least one new match is already there
  debounceMs:  120,
};
const feedQueries = new Map();      // feed key (= activeTab) -> text typed in that feed
const revealStates = new Map();     // feed key -> { sig, limit }: how many matches are revealed right now
const revealBusy = new Set();       // feeds with a scroll step in progress
let searchToken = 0;                // newest search wins
let currentRun = null;
let liveTimer = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- small helpers ---------- */
const isMixKey = key => (key || '').startsWith(MIX_PREFIX);
const feedEl = key => results.querySelector(`.feed[data-site="${CSS.escape(key)}"]`);
const gridOf = key => { const f = feedEl(key); return f && f.querySelector('.videos'); };
const queryWords = q => normalizeSearchText(q).split(' ').filter(Boolean);
const cardSearchCache = new WeakMap();
function cardMatchesSearch(card, words) {
  const text = cardSearchText(card);
  let cached = cardSearchCache.get(card);
  if (!cached || cached.text !== text) {
    cached = { text, tokens: normalizeSearchText(text).split(' ').filter(Boolean) };
    cardSearchCache.set(card, cached);
  }
  return words.every(word => cached.tokens.some(token => token.startsWith(word)));
}

function feedLabel(key) {
  if (!key) return 'this feed';
  if (key === WEBSEARCH_TAB) return 'Search results';
  if (key === mixKey(ALL_FEED.id)) return 'Home';
  if (isMixKey(key)) return getFeed(key.slice(MIX_PREFIX.length)).name;
  return nameFor(key) || 'this feed';
}
function feedPlaceholder(key) {
  if (!key) return 'Search this feed…';
  if (key === WEBSEARCH_TAB) return 'Refine these results…';
  return key === mixKey(ALL_FEED.id) ? 'Search all home videos…' : `Search ${feedLabel(key)}…`;
}
function feedHasMore(key) {
  if (isMixKey(key)) {
    const ss = mixStateFor(key);
    return !!ss && mixScope(ss).some(g => { const st = ss.pages.get(g.site); return !!(st && !st.exhausted && st.next_page); });
  }
  const st = siteState.get(key);
  return !!(st && !st.exhausted && st.next_page);
}
function isFeedLoading(key) {
  return isMixKey(key) ? !!(mixStateFor(key) || {}).loading : !!ensureState(key).loading;
}
/** Loaded cards (that pass the website/General/BDSM chip) whose title has every typed word. */
function countMatches(feed, words) {
  let n = 0;
  feed.querySelectorAll('.card').forEach(card => {
    if (card.classList.contains('filtered-out')) return;
    if (cardMatchesSearch(card, words)) n++;
  });
  return n;
}
const cardCount = key => { const f = feedEl(key); return f ? f.querySelectorAll('.card').length : 0; };

/** How many matches of a feed are revealed. A new text (or a new Home filter chip) starts again at one page (6);
 *  coming back to the same search keeps what was already revealed. */
const revealSig = key => `${feedQueries.get(key) || ''}|${isMixKey(key) ? ((mixStateFor(key) || {}).filter || '') : ''}`;
function revealState(key) {
  const sig = revealSig(key);
  let st = revealStates.get(key);
  if (!st || st.sig !== sig) { st = { sig, limit: SEARCH.pageSize }; revealStates.set(key, st); }
  return st;
}

/* ---------- page loading (several pages per request) ---------- */

/** Fetch up to `depth` consecutive pages of one feed in ONE request (the backend scrapes them in parallel).
 *  Returns [{data, url, num}] in page order; pages that don't follow from the previous one are dropped. */
async function fetchPagesBatch(nextUrl, pageNum, depth) {
  const reqs = [{ url: nextUrl, page_num: pageNum }];
  for (let i = 1; i < depth; i++) {
    const g = guessNextUrl(reqs[i - 1].url, pageNum + i);
    if (!g || g === reqs[i - 1].url) break;
    reqs.push({ url: g, page_num: pageNum + i });
  }
  const norm = u => (u || '').replace(/\/+$/, '').replace(/^https?:\/\/(www\.)?/, '');
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls: reqs }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = (await res.json()).results || [];
      const out = [];
      for (let i = 0; i < reqs.length && i < raw.length; i++) {
        const data = raw[i] || null;
        if (i > 0) {
          const prev = out[i - 1] && out[i - 1].data;
          if (!prev || prev.error || !(prev.items || []).length) break;                      // previous page was empty: stop
          if (prev.next_page && norm(prev.next_page) !== norm(reqs[i].url)) break;         // the guess is wrong for this site
        }
        out.push({ data, url: reqs[i].url, num: reqs[i].page_num });
      }
      if (!out.length) throw new Error('empty batch');
      return out;
    } catch (e) {
      lastErr = e;
      await sleep(300 * (attempt + 1));
    }
  }
  throw lastErr || new Error('unknown');
}

/** Load `depth` pages of an ordinary feed (website / category / studio). The data always goes into the feed's
 *  store (even if you already left it, so nothing is fetched twice); cards are drawn only if it is on screen. */
async function loadSitePagesBatch(key, depth, opts = {}) {
  const st = ensureState(key);
  if (st.loading || st.exhausted) return;
  if (!st.next_page) { st.exhausted = true; return; }
  const store = siteData.get(key);
  if (!store) return;
  const grid0 = activeTab === key ? gridOf(key) : null;
  const slot0 = grid0 && grid0.querySelector('.loading-row-slot');
  let loader = null;
  if (grid0 && slot0 && !opts.search) {
    loader = document.createElement('div');
    loader.className = 'loading-row';
    loader.innerHTML = '<div class="mini-spinner"></div><div>Loading more previews…</div>';
    grid0.insertBefore(loader, slot0);
  }
  st.loading = true;
  try {
    const entries = await fetchPagesBatch(st.next_page, (st.page_num || 1) + 1, depth);
    const host = hostOf(key);
    const seen = new Set(store.items.map(it => (it.link || '').split('?')[0]).filter(Boolean));
    const added = [];
    for (const e of entries) {
      const fresh = [];
      ((e.data && e.data.items) || []).forEach(it => {
        const k = (it.link || '').split('?')[0];
        if (!k || seen.has(k)) return;
        seen.add(k);
        fresh.push({ ...it, _host: host });
      });
      st.page_num = e.num;
      if (!fresh.length) { st.exhausted = true; st.next_page = ''; break; }       // same page again / no more videos
      added.push(...fresh);
      st.next_page = (e.data && e.data.next_page) || guessNextUrl(e.url, e.num + 1) || '';
      if (!st.next_page) { st.exhausted = true; break; }
    }
    st.retryCount = 0;
    if (added.length) {
      store.items.push(...added);
      const grid = activeTab === key ? gridOf(key) : null;
      if (grid) {
        const ref = (loader && loader.parentNode === grid) ? loader : grid.querySelector('.loading-row-slot');
        const temp = document.createElement('div');
        temp.innerHTML = added.map(it => cardHtml(it, Math.floor(Math.random() * 1e6))).join('');
        const nodes = [...temp.children];
        nodes.forEach(n => grid.insertBefore(n, ref));
      }
    }
  } catch (err) {
    st.retryCount++;
    if (st.retryCount >= MAX_RETRY) st.exhausted = true;
  } finally {
    if (loader) loader.remove();
    st.loading = false;
  }
}

/** Home (every website mixed): one page-batch from each website that still has more. */
async function loadMoreMixed(tabKey, opts = {}) {
  const ss = mixStateFor(tabKey);
  if (!ss || activeTab !== tabKey || ss.loading) return;
  const grid = gridOf(tabKey);
  if (!grid) return;
  if (grid.classList.contains('live-pending') && !opts.search) return;     // the search is loading the first page itself
  const depth = opts.depth || (feedQueries.get(tabKey) ? 2 : 1);
  const hasMore = g => { const st = ss.pages.get(g.site); return st && !st.exhausted && st.next_page; };
  const active = mixScope(ss).filter(hasMore);
  if (!active.length) { showMixEnd(grid); return; }

  ss.loading = true;
  const slot = grid.querySelector('.loading-row-slot');
  let loader = null;
  if (!opts.search) {
    loader = document.createElement('div');
    loader.className = 'loading-row';
    loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more…</div>`;
    grid.insertBefore(loader, slot);
  }

  const settled = await Promise.allSettled(active.map(g => {
    const st = ss.pages.get(g.site);
    return fetchPagesBatch(st.next_page, (st.page_num || 1) + 1, depth);
  }));
  if (loader) loader.remove();
  ss.loading = false;
  if (mixStateFor(tabKey) !== ss) return;                                     // superseded by a reload

  const batch = [];
  let retryLater = false;
  settled.forEach((r, i) => {
    const g = active[i];
    const st = ss.pages.get(g.site);
    if (r.status === 'rejected') {
      st.retryCount++;
      if (st.retryCount >= MAX_RETRY) st.exhausted = true; else retryLater = true;
      return;
    }
    st.retryCount = 0;
    for (const e of r.value) {
      const data = e.data;
      const fresh = [];
      ((data && data.items) || []).forEach(it => {
        const key = (it.link || '').split('?')[0];
        if (!key || ss.seen.has(key)) return;
        ss.seen.add(key);
        fresh.push({ ...it, _host: hostOf(g.site), _label: g.label, _sourceId: g.sourceId, _feed: g.feedId });
      });
      if (!fresh.length) {
        st.emptyCount++;
        if (st.emptyCount >= MAX_EMPTY || !(data && data.next_page)) st.exhausted = true;
      } else {
        st.emptyCount = 0;
        g.items.push(...fresh);
        batch.push(...fresh);
      }
      st.page_num = e.num;
      st.next_page = (data && data.next_page) || guessNextUrl(e.url, e.num + 1) || '';
      if (!st.next_page) st.exhausted = true;
      if (!fresh.length) break;
    }
  });

  if (batch.length) {
    const mixed = shuffleArray(batch);
    ss.items.push(...mixed);
    const live = activeTab === tabKey ? gridOf(tabKey) : null;            // draw only if Home is still on screen
    if (live) {
      const ref = live.querySelector('.loading-row-slot');
      const temp = document.createElement('div');
      temp.innerHTML = mixed.map((it, i) => cardHtml(it, `m-${ss.items.length}-${i}`)).join('');
      while (temp.firstElementChild) live.insertBefore(temp.firstElementChild, ref);
      applyMixFilter(live, ss);
      updateMixHeader(feedEl(tabKey), ss);
      if (!opts.quiet) setStatus(`${getFeed(ss.feedId).name} — ${ss.items.length} previews`, false);
    }
  }
  if (activeTab !== tabKey) return;
  if (!mixScope(ss).some(hasMore)) { const g2 = gridOf(tabKey); if (g2) showMixEnd(g2); return; }
  if (retryLater && !batch.length) {
    setTimeout(() => { if (mixStateFor(tabKey) === ss && activeTab === tabKey) loadMoreMixed(tabKey); }, 1500);
  } else {
    scheduleMixRecheck(tabKey);
  }
}

/** One scroll step while a query is active: reveal the NEXT 6 matches.
 *  Matches that are already loaded are revealed first; pages are fetched only if they cannot fill the next 6. */
async function revealNext(key) {
  if (!key || revealBusy.has(key)) return;
  const words = queryWords(feedQueries.get(key));
  const grid = gridOf(key);
  if (!words.length || !grid || grid.classList.contains('live-pending') ) return;
  const st = revealState(key);
  const token = searchToken;
  const t0 = Date.now();
  const target = st.limit + SEARCH.pageSize;
  const matched = () => { const f = feedEl(key); return f ? countMatches(f, words) : 0; };
  revealBusy.add(key);
  let showingSkeletons = false;
  try {
    let steps = 0, stalled = 0;
    while (matched() < target && feedHasMore(key) && token === searchToken && activeTab === key) {
      if (matched() > st.limit && Date.now() - t0 > SEARCH.revealMaxWaitMs) break;     // something new is ready: show it
      if (isFeedLoading(key)) { if (Date.now() - t0 > 30000) break; await sleep(40); continue; }
      if (steps >= SEARCH.revealMaxSteps) break;
      steps++;
      const before = cardCount(key);
      setStatus(`Loading more matches in ${feedLabel(key)}…`, true);
      if (!showingSkeletons) { insertSearchSkeletons(grid, SEARCH.pageSize); showingSkeletons = true; }
      if (isMixKey(key)) await loadMoreMixed(key, { depth: SEARCH.depthMix[1], quiet: true, search: true });
      else await loadSitePagesBatch(key, SEARCH.scrollDepth, { quiet: true, search: true });
      if (cardCount(key) === before) { if (++stalled >= 3) break; } else stalled = 0;
    }
    if (token !== searchToken || activeTab !== key) return;            // typed again / left the feed
    // Keep results in full six-match chunks unless this feed has reached its end.
    if (matched() >= target) st.limit = target;
    else if (!feedHasMore(key)) st.limit = matched();
  } finally {
    if (showingSkeletons) grid.querySelector(':scope > .search-skeletons')?.remove();
    revealBusy.delete(key);
  }
  applyLiveFilter();
}

/* ---------- progress banner (cards stay hidden while the first page is searched) ---------- */
function setLivePending(grid, on) {
  grid.classList.toggle('live-pending', on);
  shuffleBtn.disabled = on;
  let b = grid.querySelector(':scope > .live-loading');
  if (!on) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('div');
    b.className = 'live-loading';
    b.innerHTML = searchSkeletonsHtml(SEARCH.firstPage);
    grid.insertBefore(b, grid.firstChild);
  }
}
/* ---------- the search itself ---------- */

/** Keep loading until the first six matches are ready or the feed is exhausted. */
async function collectFirstPage(run) {
  const { key, words } = run;
  const sched = isMixKey(key) ? SEARCH.depthMix : SEARCH.depthSingle;
  let step = 0, stalled = 0;
  while (!run.stop && run.token === searchToken && activeTab === key && feedHasMore(key)) {
    const feed = feedEl(key);
    if (!feed) return;
    const found = countMatches(feed, words);
    if (found >= SEARCH.firstPage) return;
    if (isFeedLoading(key)) { await sleep(40); continue; }        // a scroll / warm-up load is running: wait for it
    const depth = sched[Math.min(step, sched.length - 1)];
    step++;
    const before = cardCount(key);
    if (isMixKey(key)) await loadMoreMixed(key, { depth, quiet: true, search: true });
    else await loadSitePagesBatch(key, depth, { quiet: true });
    setStatus(`Searching ${feedLabel(key)}…`, true);
    if (cardCount(key) === before) { if (++stalled >= 3) return; } else stalled = 0;
  }
}

/** Run the open feed's own search. Safe to call any time: the newest call wins. */
async function runFeedSearch() {
  const key = activeTab;
  const q = (searchInput.value || '').trim();
  if (q) feedQueries.set(key, q); else feedQueries.delete(key);
  const run = currentRun = { key, token: ++searchToken, words: queryWords(q), start: Date.now(), stop: false };
  const feed = feedEl(key);
  const grid = gridOf(key);
  if (!feed || !grid) return;

  if (!run.words.length) {
    setLivePending(grid, false);
    applyLiveFilter();
    setStatus('Ready', false);
    return;
  }
  if (countMatches(feed, run.words) < SEARCH.firstPage && feedHasMore(key)) {
    setLivePending(grid, true);
    await collectFirstPage(run);
    run.stop = true;
    if (run.token !== searchToken || activeTab !== key) return;      // typed again / left the feed
    const g2 = gridOf(key);
    if (!g2) return;
    setLivePending(g2, false);
    // Any remaining matches are fetched only when the user scrolls to the end.
  } else {
    setLivePending(grid, false);
  }
  applyLiveFilter();
}

/** A feed was (re)drawn: put back ITS text in the box and re-apply it. */
function restoreFeedSearch(key) {
  clearTimeout(liveTimer);
  if (key === WEBSEARCH_TAB) {                      // search results: show the keyword, never re-filter the cards
    searchInput.value = webSearchQuery || '';
    searchInput.placeholder = feedPlaceholder(key);
    shuffleBtn.disabled = false;
    searchToken++;
    return;
  }
  const q = feedQueries.get(key) || '';
  searchInput.value = q;
  searchInput.placeholder = feedPlaceholder(key);
  shuffleBtn.disabled = false;
  searchToken++;                           // whatever was running for the previous feed must not touch this one
  if (q) runFeedSearch();
}

/** Show only the cards that match every typed word, and of those only the revealed ones (6, then +6 per scroll step). */
function applyLiveFilter() {
  if (liveMirrorInput()) return;
  const key = activeTab;
  const feed = results.querySelector('.feed');
  if (!feed || feed.getAttribute('data-site') === '__loading__') return;
  const grid = feed.querySelector('.videos') || feed;
  if (grid.classList.contains('live-pending')) return;
  const words = queryWords(feedQueries.get(key));
  const limit = words.length ? revealState(key).limit : Infinity;
  let total = 0, matched = 0, shown = 0;
  feed.querySelectorAll('.card').forEach(card => {
    if (card.classList.contains('filtered-out')) { card.classList.remove('live-hidden', 'live-capped'); return; }
    total++;
    const ok = cardMatchesSearch(card, words);
    let capped = false;
    if (ok) { matched++; if (matched > limit) capped = true; else shown++; }
    card.classList.toggle('live-hidden', !ok);
    card.classList.toggle('live-capped', capped);
  });
  const hiddenByCap = matched - shown;

  const ss = isMixKey(key) ? mixStateFor(key) : null;
  const badge = feed.querySelector('.count-badge');
  if (badge) {
    if (words.length) badge.textContent = `🔎 ${matched} match${matched !== 1 ? 'es' : ''} of ${total}` + (hiddenByCap ? ` · showing ${shown}` : '');
    else if (ss) updateMixHeader(feed, ss);
    else badge.textContent = `🎬 ${total} preview${total !== 1 ? 's' : ''}`;
  }

  // Search results expand only when the user scrolls to the end.
  grid.querySelectorAll(':scope > .live-empty, :scope > .live-more').forEach(e => e.remove());
  const q = feedQueries.get(key) || '';
  const more = !!(words.length && feedHasMore(key));
  const note = (cls, text) => {
    const em = document.createElement('div');
    em.className = cls;
    em.innerHTML = `<span>${text}</span>`;
    return em;
  };
  const slot = grid.querySelector('.loading-row-slot');
  if (words.length && total && !matched) {
    grid.insertBefore(note('live-empty live-more',
      more ? `No match yet for “${escapeHtml(q)}” in the ${total} videos checked in ${escapeHtml(feedLabel(key))} — loading more…`
           : `No match for “${escapeHtml(q)}” in the ${total} videos checked in ${escapeHtml(feedLabel(key))}.`), grid.firstChild);
  } else if (words.length && limit === SEARCH.firstPage && matched >= SEARCH.firstPage && more) {
    grid.insertBefore(note('live-more live-scroll-more',
      'Scroll for more.'), slot);
  } else if (words.length && matched && !more && !hiddenByCap) {
    grid.insertBefore(note('live-more live-end',
      `🏁 ${matched} match${matched !== 1 ? 'es' : ''} — end of results.`), slot);
  }
  if (words.length) setStatus(`${feedLabel(key)} — ${matched} match${matched !== 1 ? 'es' : ''} for “${q}”` + (hiddenByCap ? ` (showing ${shown})` : ''), false);
}

/** While a query is active, reveal the next 6 matches (loading new pages when needed) whenever the user scrolls near the bottom. */
let scrollTick = 0;
function isAtFeedBottom(threshold = 120) {
  const root = document.documentElement;
  return root.scrollHeight > window.innerHeight + 1
    && root.scrollHeight - (window.scrollY + window.innerHeight) <= threshold;
}
window.addEventListener('scroll', () => {
  if (scrollTick) return;
  scrollTick = requestAnimationFrame(() => {
    scrollTick = 0;
    const key = activeTab;
    if (!key) return;
    if (key === WEBSEARCH_TAB) {
      if (isAtFeedBottom(700)) loadMoreWebSearch();
      return;
    }
    if (feedQueries.get(key) && isAtFeedBottom(120)) revealNext(key);
  });
}, { passive: true });

/* ---------- the box, Shuffle, warm-up ---------- */

/** Categories / Tags / Sites / Pornstars have their own box: the main box drives it live. */
function liveMirrorInput() {
  if (activeTab === CATEGORIES_TAB) return document.getElementById('categorySearchInput');
  if (activeTab === PORN_TAGS_TAB) return document.getElementById('tagSearchInput');
  if (activeTab === PORN_SITES_TAB || activeTab === NETWORKS_TAB) return document.getElementById('studioSearchInput');
  if (kindOfCatalogTab(activeTab)) return document.getElementById('catalogSearchInput');
  return null;
}

function onLiveInput() {
  if (activeTab === LIVECAMS_TAB) { if (liveCamsData) applyCamFilter(); return; }
  if (activeTab === LIVECHANNELS_TAB) { if (chanState) { chanState.q = (searchInput.value || '').trim(); chanRedraw(); } return; }
  const mirror = liveMirrorInput();
  if (mirror) {
    mirror.value = searchInput.value;
    mirror.dispatchEvent(new Event('input'));
    return;
  }
  runFeedSearch();
}

/** 🔀 Shuffle the videos of the open feed. */
function shuffleCurrentFeed() {
  const key = activeTab;
  if (!feedEl(key) || shuffleBtn.disabled) return;
  if (key === WEBSEARCH_TAB) {                        // only the few cards on screen are rebuilt: no lag on phones
    const st = webSearchState;
    if (!st || st.loading || st.items.length < 2) return;
    st.items = shuffleArray(st.items);
    renderWebSearch(true);
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    return;
  }
  if (isMixKey(key)) {
    const ss = mixStateFor(key);
    if (!ss) return;
    ss.items = shuffleArray(ss.items);
    renderMixedFeed(key.slice(MIX_PREFIX.length), { chunk: true });
  } else {
    const store = siteData.get(key);
    if (!store) return;
    store.items = shuffleArray(store.items);
    renderFeed(key);
    scheduleRecheck(key);
  }
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });   // smooth-scrolling a huge page is what froze phones
}

shuffleBtn.addEventListener('click', shuffleCurrentFeed);
searchInput.addEventListener('input', () => {
  clearTimeout(liveTimer);
  const typed = (searchInput.value || '').trim();
  // Home / search results manage their own single history entry (runWebSearch); only section feeds get one here.
  if (typed && !feedSearchEntryActive && activeTab !== WEBSEARCH_TAB && !isMixKey(activeTab) && !sectionScope()) {
    pushNav(currentNavState());
    feedSearchEntryActive = true;
  }
  // Nothing happens while typing - and deleting the keyword keeps the current results until the next search is started
  // (Enter or a dropdown pick).
});
document.addEventListener('input', (e) => {
  const input = e.target;
  if (!input || !['categorySearchInput', 'tagSearchInput', 'studioSearchInput', 'catalogSearchInput'].includes(input.id)) return;
  if ((input.value || '').trim() && !feedSearchEntryActive) {
    pushNav(currentNavState());
    feedSearchEntryActive = true;
  }
});
/* Clearing any search box (backspace, the x button, Esc) puts the page back at the top. */
(function scrollToTopWhenSearchCleared() {
  const IDS = ['searchInput', 'categorySearchInput', 'tagSearchInput', 'studioSearchInput', 'catalogSearchInput'];
  const isSearch = (el) => el && IDS.includes(el.id);
  const hasText = (el) => (el.value || '').trim() !== '';
  // On Home, in a section and on search results an emptied box keeps the results (until the next search), so the page must stay put.
  const keepsResults = (el) => el.id === 'searchInput' && (activeTab === WEBSEARCH_TAB || isMixKey(activeTab) || !!sectionScope());
  const toTop = () => {
    const go = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    go();
    requestAnimationFrame(go);
    setTimeout(go, 150);    // after the debounced filter has re-laid out the list
    setTimeout(go, 400);
  };
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!isSearch(el)) return;
    const had = el._hadText === true;
    el._hadText = hasText(el);
    if (had && !el._hadText && !keepsResults(el)) toTop();
  }, true);
  document.addEventListener('keydown', (e) => {
    const el = e.target;
    if (e.key !== 'Escape' || !isSearch(el) || !hasText(el)) return;
    setTimeout(() => { el._hadText = hasText(el); if (!el._hadText && !keepsResults(el)) toTop(); }, 0);   // Esc clears the box in code
  }, true);
})();

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(liveTimer);
    onLiveInput();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    searchInput.value = '';
    clearTimeout(liveTimer);
    onLiveInput();
  }
});

/* ---------- search-box dropdown ----------
   Inside a section (a pornstar, studio, category, tag, website ...) it lists keywords found in THAT section's loaded videos,
   each with the number of loaded videos it leads to. On Home (all websites combined) it shows four groups:
   Videos (keywords of every loaded video), Pornstars, Networks, Live Channels. Everything offered has data behind it.
Nothing is filtered while typing: picking a row (or Enter) applies it. */
(function suggestDropdown() {
  const STOPW = new Set(['the', 'and', 'for', 'with', 'from', 'her', 'his', 'she', 'him', 'this', 'that', 'you', 'your', 'are', 'all', 'get', 'gets',
    'into', 'out', 'one', 'two', 'has', 'was', 'who', 'how', 'its', 'their', 'they', 'them', 'than', 'then', 'but', 'not', 'can', 'new', 'hd', 'xxx',
    'sex', 'movie', 'movies', 'online', 'com', 'www', 'http', 'https', 'when', 'what', 'over', 'her', 'she', 'while', 'after', 'gets', 'got', 'own']);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c]));
  const PHRASE_KEYS = ['models', 'pornstars', 'stars', 'performers', 'tags', 'categories', 'genres'];
  const SINGLE_KEYS = ['studio', 'series', 'channel'];

  const box = document.createElement('div');
  box.id = 'suggestBox';
  box.setAttribute('role', 'listbox');
  document.body.appendChild(box);

  let rows = [], active = -1, timer = 0, ctl = null, seq = 0, keepOpen = false, drawnFor = null;   // keepOpen: input blurred on purpose (keyboard hidden), list stays
  const serverCache = new Map();
  const isOpen = () => box.classList.contains('open');
  const isHome = () => isMixKey(activeTab) || activeTab === WEBSEARCH_TAB;     // Home and its search results: all websites combined
  const scopeNow = () => activeTab === WEBSEARCH_TAB ? webSearchScope : (isMixKey(activeTab) ? null : sectionScope());   // the section being searched, if any

  /* ----- the loaded videos of the open section ----- */
  function phrasesOf(it) {
    const out = [];
    for (const k of PHRASE_KEYS) {

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (json.error) throw new Error(json.error);
        ingestWebSearchJson(st, json);
      } catch (_) {
        st.errors++;
      } finally {
        clearTimeout(timer);
        st.completedSites++;
        st.pending.delete(p);
        if (webSearchState === st && activeTab === WEBSEARCH_TAB && token === webSearchToken) {
          if (st.loading) renderWebSearch();                 // progressive: cards appear as sites answer
          else {
            const badge = results.querySelector(`.feed[data-site="${WEBSEARCH_TAB}"] .count-badge`);
            if (badge) badge.textContent = `🔎 Showing ${Math.min(st.visibleLimit, st.items.length)} of ${st.items.length} matches`;
          }
        }
      }
    })();
    st.pending.add(p);
  }
}

/* Resolve once `target` matches exist (plus a short grace so a fast site does not outrank a better
   one) or every site has answered. */
async function waitForWebItems(st, token, target) {
  while (st.items.length < target && st.pending && st.pending.size && token === webSearchToken) {
    await Promise.race([...st.pending]);
  }
  if (st.pending && st.pending.size && token === webSearchToken) {
    await Promise.race([Promise.all([...st.pending]), new Promise(r => setTimeout(r, 350))]);
  }
}

async function searchNextWebSourceBatch(st, token) {
  dispatchWebSearchSites(st, token);
  await waitForWebItems(st, token, st.visibleLimit);
  return token === webSearchToken;
}

async function runWebSearch(query, opts = {}) {
  query = cleanQuery(query);
  if (!query) return;
  // scope: opts.scope (a section search) / the open results' own scope when refining them / none = Home (all websites)
  const scope = opts.scope !== undefined ? (opts.scope && opts.scope.url ? opts.scope : null) : (activeTab === WEBSEARCH_TAB ? webSearchScope : null);
  webSearchScope = scope;
  if (!opts.skipPush) {                                         // a search the user just started shows its results from the top (Back / links keep their scroll)
    const top = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    top();
    requestAnimationFrame(top);
    setTimeout(top, 150);
  }
  const replacingSearch = activeTab === WEBSEARCH_TAB;
  const updateSearchHistory = () => {
    if (opts.skipPush) return;
    const update = replacingSearch ? replaceNav : pushNav;      // first search adds ONE history entry, later ones replace it
    update({ view: 'websearch', query, scope });
  };
  const cacheKey = `${activeSourceId}:${scopeKeyOf(scope)}:${normalizeSearchText(query)}`;
  const cached = webSearchCache.get(cacheKey);
  if (cached && cached.loading && webSearchState === cached) {
    webSearchState = cached;
    webSearchQuery = query;
    activeTab = WEBSEARCH_TAB;
    renderWebSearch();
    updateSearchHistory();
    return;
  }
  const token = ++webSearchToken;
  if (webSearchState && webSearchState.loading) {
    webSearchState.loading = false;
    webSearchState.paused = true;
  }
  if (cached) {
    webSearchState = cached;
    webSearchQuery = query;
    activeTab = WEBSEARCH_TAB;
    if (!cached.exhausted && cached.items.length < cached.visibleLimit) {
      cached.loading = true;
      renderWebSearch();
      updateSearchHistory();
      await loadMoreWebSearch(true);
      return;
    }
    renderWebSearch();
    updateSearchHistory();
    setStatus(`“${query}” — ${cached.items.length} matches ${scope ? 'in ' + scope.name : 'on ' + SOURCES.length + ' websites'}`, false);
    return;
  }
  const sources = scope ? [{ id: '__scope__', name: scope.name, url: scope.url }] : [
    ...SOURCES.filter(src => src.id === activeSourceId),
    ...SOURCES.filter(src => src.id !== activeSourceId),
  ];
  const batchSize = 2;
  const state = webSearchState = {
    query, scope, seen: new Set(), items: [], nexts: [],
    sources, sourceCursor: 0, batchSize,
    loading: true, loadingTarget: WEB_PAGE, exhausted: false, paused: false, errors: 0, completedSites: 0, visibleLimit: WEB_PAGE, t0: Date.now(),
  };
  webSearchCache.set(cacheKey, state);
  if (webSearchCache.size > 12) webSearchCache.delete(webSearchCache.keys().next().value);
  webSearchQuery = query;
  activeTab = WEBSEARCH_TAB;
  setStatus(`Searching ${scope ? scope.name : sources.length + ' websites'} for “${query}”…`, true);
  renderWebSearch();
  setTimeout(() => { if (webSearchState === state && activeTab === WEBSEARCH_TAB && state.loading) renderWebSearch(); }, 1550);
  try {
    dispatchWebSearchSites(state, token);
    await waitForWebItems(state, token, state.visibleLimit);
    if (activeTab === WEBSEARCH_TAB && !opts.skipPush) updateSearchHistory();
    if (token !== webSearchToken) return;
    state.exhausted = !state.nexts.length && state.sourceCursor >= state.sources.length && !(state.pending && state.pending.size);
    if (state.items.length < state.visibleLimit && !state.exhausted && activeTab === WEBSEARCH_TAB) {
      await loadMoreWebSearch(true);
      if (token !== webSearchToken) return;
    }
    state.loading = false;
    state.exhausted = !state.nexts.length && state.sourceCursor >= state.sources.length && !(state.pending && state.pending.size);
    if (activeTab === WEBSEARCH_TAB) {
      renderWebSearch();
      setStatus(`“${query}” — ${state.items.length} matches ${scope ? 'in ' + scope.name : 'on ' + sources.length + ' websites'}`, false);
    }
    if (activeTab === WEBSEARCH_TAB && !state.items.length) {
      const feed = results.querySelector('.feed');
      if (feed) feed.querySelector('.videos').innerHTML =
        `<div style="grid-column:1/-1;padding:2rem;text-align:center;color:#7a8aaa;">
           No matches for “${escapeHtml(query)}” ${scope ? 'in ' + escapeHtml(scope.name) : 'on any website'}.${state.errors ? ' (some sites failed to answer)' : ''}
         </div>`;
    }
  } catch (err) {
    if (token !== webSearchToken || activeTab !== WEBSEARCH_TAB) return;
    state.loading = false;
    state.exhausted = true;
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus('Web search error', false);
  }
}

function renderWebSearch(force = false) {
  const st = webSearchState;
  activeTab = WEBSEARCH_TAB;
  const warming = st.loading && !st.locked && st.completedSites < st.sources.length && Date.now() - (st.t0 || 0) < 1500;   // first page waits (max 1.5 s) for every website
  const canShow = !warming && (st.loading || st.items.length >= st.visibleLimit || (!st.loading && (st.exhausted || st.paused)));
  const visibleItems = canShow ? st.items.slice(0, st.visibleLimit) : [];
  st.locked = visibleItems.length;
  const skeletonCount = st.loading ? Math.max(0, (st.loadingTarget || st.visibleLimit) - visibleItems.length) : 0;
  const canLoadMore = !st.exhausted && (st.nexts.length > 0 || st.sourceCursor < st.sources.length || !!(st.pending && st.pending.size));
  const moreNote = !st.loading && st.visibleLimit === WEB_PAGE && visibleItems.length >= WEB_PAGE && canLoadMore
    ? '<div class="live-more live-scroll-more"><span>Scroll for more.</span></div>' : '';
  const urlLine = st.scope ? (st.loading ? `searching inside ${escapeHtml(st.scope.name)}…` : `inside ${escapeHtml(st.scope.name)} · ranked, duplicates removed`)
    : st.loading ? `searching ${st.completedSites}/${st.sources.length} websites…` : 'every website · ranked, duplicates removed';
  const badge = `🔎 Showing ${visibleItems.length} of ${st.items.length} matches`;

  // Fast path: the same search is already on screen -> only add the new cards (no rebuild, no flicker, no scroll jump)
  const cur = results.querySelector(`.feed[data-site="${WEBSEARCH_TAB}"]`);
  const grid = cur && cur.querySelector('.videos');
  const slot = grid && grid.querySelector('.loading-row-slot');
  if (!force && cur && slot && cur.getAttribute('data-q') === st.query && (cur.getAttribute('data-scope') || '') === scopeKeyOf(st.scope)) {
    const have = [...grid.querySelectorAll(':scope > .card')];
    const n = have.length;
    if (n <= visibleItems.length && (!n || have[n - 1].getAttribute('data-detail') === visibleItems[n - 1].link)) {
      grid.querySelectorAll(':scope > .search-skeletons, :scope > .live-more').forEach(e => e.remove());
      if (visibleItems.length > n) slot.insertAdjacentHTML('beforebegin', visibleItems.slice(n).map((it, i) => cardHtml(it, `w-${n + i}`)).join(''));
      if (skeletonCount) slot.insertAdjacentHTML('beforebegin', searchSkeletonsHtml(skeletonCount));
      if (moreNote) slot.insertAdjacentHTML('beforebegin', moreNote);
      const u = cur.querySelector('.feed-url'); if (u) u.textContent = urlLine;
      const bd = cur.querySelector('.count-badge'); if (bd) bd.textContent = badge;
      return;
    }
  }

  hideSearchBar();
  setTimeout(updateNetworkBarActive, 0);
  const cards = visibleItems.map((it, i) => cardHtml(it, `w-${i}`)).join('');
  rescueSearchBar(); results.innerHTML = `
    <div class="feed" data-site="${WEBSEARCH_TAB}" data-q="${escapeHtml(st.query)}" data-scope="${escapeHtml(scopeKeyOf(st.scope))}">
      <div class="feed-header">
        <div>
          <div class="feed-name">${st.scope ? '🔎 ' + escapeHtml(st.scope.name) + ': ' : '🌐 Search: '}“${escapeHtml(st.query)}”</div>
          <div class="feed-url">${urlLine}</div>
        </div>
        <div class="badges"><span class="count-badge">${badge}</span></div>
      </div>
      <div class="videos">
        ${cards || ''}
        ${skeletonCount ? searchSkeletonsHtml(skeletonCount) : ''}
        ${moreNote}
        <div class="loading-row-slot"></div>
      </div>
      <div class="sentinel" data-site="${WEBSEARCH_TAB}"></div>
    </div>`;
  const feedEl0 = results.querySelector('.feed');
  if (feedEl0) placeSearchInFeed(feedEl0);
  observeSentinel(WEBSEARCH_TAB);
}

async function loadMoreWebSearch(initial = false) {
  const st = webSearchState;
  if (!st || (st.loading && !initial) || st.exhausted) return;
  const target = initial ? st.visibleLimit : st.visibleLimit + WEB_PAGE;
  st.loadingTarget = target;
  if (st.items.length >= target) {
    st.visibleLimit = target;
    if (webSearchState === st && activeTab === WEBSEARCH_TAB) renderWebSearch();
    return;
  }
  st.loading = true;
  if (!initial && activeTab === WEBSEARCH_TAB) renderWebSearch();
  const seenPages = new Set();
  try {
    while (st.items.length < target && !st.exhausted && webSearchState === st && activeTab === WEBSEARCH_TAB) {
      if (!st.nexts.length) {
        if (st.sourceCursor < st.sources.length) {
          if (!await searchNextWebSourceBatch(st, webSearchToken)) break;
          continue;
        }
        if (st.pending && st.pending.size) { await Promise.race([...st.pending]); continue; }
        st.exhausted = true;
        break;
      }
      if (st.scope && (st.scopePages || 0) >= 24) { st.nexts.length = 0; continue; }   // a section is paged at most 24 pages per search
      const jobs = st.nexts.splice(0, 4);
      if (st.scope) st.scopePages = (st.scopePages || 0) + jobs.length;
      const settled = await Promise.allSettled(jobs.map(j =>
        fetchWithTimeout('/api/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls: [{ url: j.url, page_num: j.num }] }),
        }, 20000).then(async r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })));
      for (let i = 0; i < settled.length; i++) {
        const r = settled[i], j = jobs[i];
        if (r.status !== 'fulfilled') { st.errors++; continue; }
        const data = ((r.value.results || [])[0]) || {};
        for (const it of data.items || []) {
          const k = (it.link || '').split('?')[0];
          if (!k || st.seen.has(k)) continue;
          if (st.scope && !scopedKeep(it, st.query)) continue;
          st.seen.add(k);
          const src = sourceForUrl(it.link || '') || null;
          const sf = src ? feedOfSource(src.id)
            : (hostOf(it.link || '').includes('bdsmhole') ? FEEDS[1] : FEEDS[0]);
          st.items.push({ ...it, _score: 1, _host: hostOf(data.page || it.link || ''),
            _label: src ? src.name : hostOf(data.page || '').replace(/^www\./, ''),
            _feed: sf.id, _sourceId: src ? src.id : '' });
        }
        const next = data.next_page;
        if ((data.items || []).length && next && next !== j.url && !seenPages.has(next)) {
          seenPages.add(next);
          st.nexts.push({ url: next, num: (data.page_num || j.num) + 1 });
        }
      }
      { const lk = Math.min(st.locked || 0, st.items.length);
        st.items = st.items.slice(0, lk).concat(rankTail(st.items.slice(lk))); }
    }
  } catch (err) {
    st.errors++;
    setStatus(`Search could not load more results: ${err.message}`, false);
  } finally {
    st.loading = false;
    st.exhausted = !st.nexts.length && st.sourceCursor >= st.sources.length && !(st.pending && st.pending.size);
    if (st.exhausted && st.items.length < target) st.visibleLimit = st.items.length;
    else if (!initial && st.items.length >= target) st.visibleLimit = target;
    if (webSearchState === st && activeTab === WEBSEARCH_TAB) {
      renderWebSearch();
      const currentFeed = results.querySelector(`.feed[data-site="${WEBSEARCH_TAB}"]`);
      const badge = currentFeed && currentFeed.querySelector('.count-badge');
      if (badge) badge.textContent = `🔎 Showing ${Math.min(st.visibleLimit, st.items.length)} of ${st.items.length} matches`;
      if (!st.exhausted) requestAnimationFrame(() => { if (webSearchState === st && activeTab === WEBSEARCH_TAB && isAtFeedBottom(700)) loadMoreWebSearch(); });
    }
  }
}

/* Typing in the box while the web-search feed is open starts a NEW web search. */
const _onLiveInputOrig = onLiveInput;
onLiveInput = function () {
  // On Home (and on its search results) a keyword searches the METADATA of every website at once - the same pages a tag /
  // category / star / studio click opens - and merges them into ONE feed. An empty box does nothing: results stay.
  // Inside a pornstar / studio / network / category / tag / website feed the same thing happens, scoped to that section.
  const sc = activeTab === WEBSEARCH_TAB ? webSearchScope : (isMixKey(activeTab) ? null : sectionScope());
  if (activeTab === WEBSEARCH_TAB || isMixKey(activeTab) || sc) {
    const q = cleanQuery(searchInput.value), nq = normalizeSearchText(q);
    if (q && searchInput.value !== q) searchInput.value = q;                  // the box shows exactly what is searched
    if (nq.length >= 2 && !(activeTab === WEBSEARCH_TAB && nq === normalizeSearchText(webSearchQuery))) runWebSearch(q, { scope: sc });
    return;
  }
  _onLiveInputOrig();
};

/* --------------------------------------------------------------
   KEYBOARD SHORTCUTS
   / or Ctrl/⌘+K  focus search      ?  this help
   ←→ / ↑↓ / j k  move between videos   Enter  open focused video
   Esc            close video panel / clear search
-------------------------------------------------------------- */
const SHORTCUTS = [
  ['/', 'Focus search'],
  ['Ctrl/⌘ + K', 'Focus search'],
  ['← → ↑ ↓ / j k', 'Move between videos'],
  ['Enter', 'Open focused video'],
  ['Esc', 'Close video / clear search'],
  ['?', 'Toggle this help'],
];
function toggleShortcutsHelp(force) {
  let ov = document.getElementById('kbdHelp');
  const show = force !== undefined ? force : !ov;
  if (!show) { if (ov) ov.remove(); return; }
  if (ov) return;
  ov = document.createElement('div');
  ov.id = 'kbdHelp';
  ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(4,8,16,.72);' +
    'display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);';
  ov.innerHTML = `<div style="background:#131a28;border:1px solid #2c3a55;border-radius:14px;padding:1.4rem 1.8rem;max-width:22rem;">
    <div style="font-weight:700;color:#e7eefb;margin-bottom:.8rem;">⌨️ Keyboard shortcuts</div>
    ${SHORTCUTS.map(([k, d]) => `<div style="display:flex;justify-content:space-between;gap:1.5rem;padding:.3rem 0;font-size:.85rem;">
      <span style="color:#9fb4d4;">${d}</span><kbd style="background:#0d1320;border:1px solid #33405c;border-radius:6px;padding:.1rem .5rem;color:#c9d6ee;font-family:ui-monospace,monospace;">${k}</kbd>
    </div>`).join('')}
    <div style="margin-top:.9rem;text-align:right;"><button type="button" class="action" id="kbdHelpClose">Close</button></div>
  </div>`;
  ov.addEventListener('click', (e) => { if (e.target === ov) toggleShortcutsHelp(false); });
  document.body.appendChild(ov);
  const c = document.getElementById('kbdHelpClose');
  if (c) c.addEventListener('click', () => toggleShortcutsHelp(false));
}

document.addEventListener('keydown', (e) => {
  const t = e.target;
  const typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if (e.key === 'Escape' && document.getElementById('kbdHelp')) { toggleShortcutsHelp(false); return; }
  if (typing) return;
  if (e.key === '?') { e.preventDefault(); toggleShortcutsHelp(); return; }
  if (e.key === '/' || ((e.ctrlKey || e.metaKey) && (e.key || '').toLowerCase() === 'k')) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
    return;
  }
  if (e.key === 'Escape') {
    if (mainPlayer && mainPlayer.classList.contains('active')) { e.preventDefault(); mainPlayerClose.click(); }
    return;
  }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'j', 'k'].includes(e.key)) {
    const cards = [...results.querySelectorAll('.card')].filter(c =>
      c.offsetParent !== null &&
      !c.classList.contains('filtered-out') && !c.classList.contains('live-hidden') &&
      !c.classList.contains('live-capped') && c.style.display !== 'none');
    if (!cards.length) return;
    e.preventDefault();
    const cur = cards.indexOf(document.activeElement);
    const fwd = (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j');
    const next = cur === -1 ? cards[0] : cards[(cur + (fwd ? 1 : -1) + cards.length) % cards.length];
    next.focus({ preventScroll: true });
    next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});

// Start immediately (no waiting for the load event): filter chips show up at once, feed loads behind them.
// A URL hash (#/categories, #/cat/<url>, #/search/<q>, #/video/<url> ...) deep-links straight into that view.
(function start() {
  // The first history entry of a visit is a guard UNDER Home: Back from a section's main page lands on it and opens the
  // "Where to?" sheet instead of leaving. A reload keeps the place it had in the visit.
  try {
    const prev = history.state;
    if (prev && typeof prev.idx === 'number') {
      navIdx = prev.idx;
      history.replaceState({ ...prev, sid: NAV_SID }, '', location.href);
    } else {
      history.replaceState({ appBase: true, sid: NAV_SID, idx: 0 }, '', location.href);
      history.pushState({ appHome: true, sid: NAV_SID, idx: 1 }, '', location.href);
      navIdx = 1;
    }
  } catch (_) {}
  renderSiteTabs();
  if (!results.querySelector('.feed[data-site="__loading__"] .feed-controls-sticky')) {
    rescueSearchBar();
    results.innerHTML = homeLoadingHtml();
    const loadingFeed = results.querySelector('.feed');
    if (loadingFeed) {
      placeFeedControlsInFeed(loadingFeed);
      placeSearchInFeed(loadingFeed);
    }
  }
  bindChips();
  const navigation = performance.getEntriesByType('navigation')[0];
  if (navigation && navigation.type === 'reload') {
    history.replaceState({ appHome: true, sid: NAV_SID, idx: navIdx }, '', `${location.pathname}${location.search}`);
    scrapeAll(true);
    return;
  }
  const initial = hashToState();
  if (initial && (location.hash || '').length > 1) {
    navSilent = true;
    _hashApplying = true;
    applyNavState(initial).finally(() => { navSilent = false; _hashApplying = false; try { replaceNav({}); } catch (_) {} });
  } else {
    scrapeAll();
  }
})();
</script>
