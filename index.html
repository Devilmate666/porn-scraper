/** Turn free text into a URL slug: "Hog Tied" → "hog-tied" */
function toSlug(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/['’]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}

/** Main search — always video search across all websites (no mode filters). */
let searchSeq = 0;        // newest search wins; older responses are dropped
let searchBusy = false;   // true while an Enter/button search holds the global `busy` lock (live typing searches never do)
function cancelSearch() { searchSeq++; if (searchBusy) { busy = false; searchBusy = false; searchBtn.disabled = false; } }

async function runSearch(opts = {}) {
  const query = (searchInput.value || '').trim();
  const activeNet = networkForUrl(activeTab);
  if (activeNet && !opts.global) {          // inside a network feed -> search that network only
    document.querySelectorAll('.net-empty').forEach(e => e.remove());
    await searchInsideNetwork(activeNet, query);
    return;
  }
  if (!query) { searchInput.focus(); return; }
  if (busy && !searchBusy) return;          // something else is loading; a running search may be replaced
  networkFilter = null;

  const seq = ++searchSeq;
  const startTab = activeTab;
  if (!opts.live) { busy = true; searchBusy = true; searchBtn.disabled = true; }
  else if (searchBusy) { busy = false; searchBusy = false; searchBtn.disabled = false; }   // replaces a running Enter search
  setStatus(`Searching for "${query}"…`, true);
  // live (typing) searches keep the already-filtered cards visible until the full results are ready
  if (!opts.live) {
    rescueSearchBar(); results.innerHTML = `<div class="loading-screen"><div class="spinner"></div>
    <div>Searching for "${escapeHtml(query)}"…</div></div>`;
  }

  try {
    // Search obeys the active filter: All = every site, General / BDSM = only that tab's sites.
    const scope = homeFilter;
    const siteUrls = SOURCES.filter(s => !scope || feedOfSource(s.id).id === scope).map(s => s.url);
    const res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sites: siteUrls, query }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    if (seq !== searchSeq) return;                                   // a newer search took over
    if (opts.live && (activeTab !== startTab || (searchInput.value || '').trim() !== query)) return;  // user moved on

    const raw = json.results || [];
    const groups = raw.map((r) => {
      const siteUrl = r.site || r.page;
      const src = sourceForUrl(siteUrl);
      const name = (src && src.name) || nameFor(siteUrl) || hostOf(siteUrl);
      const feed = feedOfSource(src && src.id);
      return {
        site: siteUrl,
        name,
        sourceId: (src && src.id) || '',
        feedId: feed.id,
        label: feed.name,
        search_url: r.search_url,
        source: r.source,
        error: r.error,
        next_page: r.next_page || null,
        page_num: r.page_num || 1,
        items: (r.items || []).map(it => ({
          ...it,
          _host: hostOf(siteUrl),
          _label: feed.name,
          _sourceId: feed.id,
          _feed: feed.id,
        })),
      };
    });

    // merge every site's hits into ONE list, drop duplicate links, shuffle
    const seen = new Set();
    const merged = [];
    groups.forEach(g => g.items.forEach(it => {
      const key = (it.link || '').split('?')[0];
      if (!key || seen.has(key)) return;
      seen.add(key);
      merged.push(it);
    }));

    const pages = new Map(groups.map(g => [g.site, {
      next_page: g.items.length ? g.next_page : null,
      page_num: g.page_num || 1,
      exhausted: !(g.items.length && g.next_page),
      emptyCount: 0, retryCount: 0,
    }]));
    searchState = { query, groups, items: shuffleArray(merged), mode: 'videos',
                    pages, seen, loading: false, filter: scope, scope, noun: 'result', live: !!opts.live };
    renderSearchResults();
    if (!opts.skipPush) pushNav({ view: 'search', sourceId: activeSourceId, query, mode: 'videos' });

    const total = searchState.items.length;
    setStatus(`Search — ${total} result${total !== 1 ? 's' : ''}`, false);
  } catch (err) {
    if (seq === searchSeq && !opts.live) {
      rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ Search error: ${escapeHtml(err.message)}</div>`;
    }
    if (seq === searchSeq) setStatus('Search error', false);
  } finally {
    if (seq === searchSeq && !opts.live) { busy = false; searchBusy = false; searchBtn.disabled = false; }
  }
}

/* --------------------------------------------------------------
   LIVE SEARCH (same behaviour as the Categories search box)
   - typing filters what is on screen instantly (debounced) - home, search results, categories,
     tags, networks, category feeds
   - Enter / Search button = full search on the websites
   - Esc = clear the box and restore the full list
-------------------------------------------------------------- */
let liveTab = null;      // the view the live text was typed in (a new view starts unfiltered)
let liveTimer = null;

/** Categories / Tags / Sites have their own box: the main box drives it live. */
function liveMirrorInput() {
  if (activeTab === CATEGORIES_TAB) return document.getElementById('categorySearchInput');
  if (activeTab === PORN_TAGS_TAB) return document.getElementById('tagSearchInput');
  if (activeTab === PORN_SITES_TAB) return document.getElementById('studioSearchInput');
  return null;
}

function currentLiveQuery() {
  if (liveTab !== activeTab) return '';
  const q = (searchInput.value || '').trim().toLowerCase();
  // the box still holds the query these search results were fetched for: show them all
  if (activeTab === SEARCH_TAB && searchState && q === (searchState.query || '').trim().toLowerCase()) return '';
  return q;
}

function applyLiveFilter() {
  if (liveMirrorInput()) return;
  if (networkForUrl(activeTab)) return;          // network feeds use applyNetworkFilter
  const feed = results.querySelector('.feed');
  if (!feed || feed.getAttribute('data-site') === '__loading__') return;
  const q = currentLiveQuery();
  const words = q.split(/\s+/).filter(Boolean);
  let total = 0, shown = 0;
  feed.querySelectorAll('.card').forEach(card => {
    if (card.classList.contains('filtered-out')) { card.classList.remove('live-hidden'); return; }
    total++;
    const t = (card.getAttribute('data-title') || '').toLowerCase();
    const ok = words.every(w => t.includes(w));
    card.classList.toggle('live-hidden', !ok);
    if (ok) shown++;
  });

  const ss = activeTab === SEARCH_TAB ? searchState
           : (activeTab || '').startsWith(MIX_PREFIX) ? mixStates.get(activeTab.slice(MIX_PREFIX.length)) : null;
  const badge = feed.querySelector('.count-badge');
  if (badge) {
    if (words.length) badge.textContent = `🔎 ${shown} match${shown !== 1 ? 'es' : ''} of ${total}`;
    else if (ss) updateMixHeader(feed, ss);
    else badge.textContent = `🎬 ${total} preview${total !== 1 ? 's' : ''}`;
  }

  const grid = feed.querySelector('.videos') || feed;
  let em = grid.querySelector('.live-empty');
  if (words.length && total && !shown) {
    if (!em) {
      em = document.createElement('div');
      em.className = 'live-empty';
      em.style.cssText = 'grid-column:1/-1;padding:2rem;text-align:center;color:#7a8aaa;';
      grid.insertBefore(em, grid.firstChild);
    }
    em.textContent = `No loaded videos match “${q}” — press Enter to search all sites.`;
  } else if (em) {
    em.remove();
  }
  if (words.length) setStatus(`${shown} match${shown !== 1 ? 'es' : ''} for “${q}” (Enter = search all sites)`, false);
  scheduleLiveRecheck();
}

/** If filtering left too little on screen, keep the infinite scroll going. */
function scheduleLiveRecheck() {
  if (activeTab === SEARCH_TAB || (activeTab || '').startsWith(MIX_PREFIX)) { scheduleMixRecheck(activeTab); return; }
}

let deepTimer = null;
const DEEP_HOLD_MS = 350;   // pause after the last keystroke, then load everything (same as pressing Enter)

/** Typing = instant filter of what is loaded (above) + after a short hold the full Enter-style load. */
function scheduleDeepSearch() {
  clearTimeout(deepTimer);
  const q = (searchInput.value || '').trim();
  const tab = activeTab;
  deepTimer = setTimeout(async function fire() {
    if ((searchInput.value || '').trim() !== q || activeTab !== tab) return;   // typed more / navigated
    if (busy && !searchBusy) { deepTimer = setTimeout(fire, 400); return; }   // wait for other loading
    if (liveMirrorInput()) {                                                    // Categories: website category search
      if (activeTab === CATEGORIES_TAB && q.length >= 2) {
        const b = document.getElementById('categorySearchBtn');
        if (b) b.click();
      }
      return;
    }
    if (q.length < 2) return;
    if (activeTab === SEARCH_TAB && searchState &&
        (searchState.query || '').trim().toLowerCase() === q.toLowerCase() && searchState.scope === homeFilter) return;
    await runSearch({ live: true, skipPush: true });   // network feeds: deep search inside the network
  }, DEEP_HOLD_MS);
}

function onLiveInput() {
  liveTab = activeTab;
  const qNow = (searchInput.value || '').trim();
  if (!qNow) {
    clearTimeout(deepTimer);
    cancelSearch();
    // box emptied after an auto-search: go back to the home feed (keeps the chosen filter)
    if (activeTab === SEARCH_TAB && searchState && searchState.live) {
      searchState = null;
      loadFeed(ALL_FEED.id, { skipPush: true });
      return;
    }
  } else {
    scheduleDeepSearch();
  }
  const mirror = liveMirrorInput();
  if (mirror) {
    mirror.value = searchInput.value;
    mirror.dispatchEvent(new Event('input'));
    return;
  }
  const net = networkForUrl(activeTab);
  if (net) {
    const q = (searchInput.value || '').trim();
    networkFilter = q ? { url: net.url, q } : null;
    document.querySelectorAll('.net-empty').forEach(e => e.remove());
    const shown = applyNetworkFilter(activeTab);
    if (q) setStatus(`${shown} match${shown !== 1 ? 'es' : ''} for “${q}”`, false);
    else setStatus('Ready', false);
    return;
  }
  applyLiveFilter();
}

searchInput.addEventListener('input', () => {

});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    clearTimeout(liveTimer);
    clearTimeout(deepTimer);
    runSearch();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    searchInput.value = '';
    clearTimeout(liveTimer);
    clearTimeout(deepTimer);

});

// Cards that arrive later (infinite scroll, re-render) must obey the live text too.
new MutationObserver((muts) => {
  const addedCard = muts.some(m => [...m.addedNodes].some(n =>
    n.nodeType === 1 && (n.classList.contains('card') || (n.querySelector && n.querySelector('.card')))));
  if (!addedCard) return;
  if (currentLiveQuery() || results.querySelector('.live-hidden')) requestAnimationFrame(applyLiveFilter);
}).observe(results, { childList: true, subtree: true });

    unloadAllCardMedia();
    resetMainPlayer();
    if (mainPlayer) mainPlayer.classList.remove('active');
    renderMixedFeed(ALL_FEED.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  await switchFeed(ALL_FEED.id);
}
if (homeBtn) homeBtn.addEventListener('click', goHome);

// Start immediately (no waiting for the load event): filter chips show up at once, feed loads behind them.
(function start() {
  renderSiteTabs();
  renderNetworkBar();
  rescueSearchBar(); results.innerHTML = homeLoadingHtml();
  bindChips();
  scrapeAll();
})();
</script>
