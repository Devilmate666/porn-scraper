    const slug = decodeURIComponent(new URL(item.link).pathname).toLowerCase().split(/[^a-z0-9\u00c0-\uffff]+/)

    parts.push(slug.join(' '));
  } catch { /* relative / odd link: skip the slug */ }
  return parts.filter(Boolean).join(' ').toLowerCase().replace(/\s+/g, ' ');
}

/* Steady bars: a vertical swipe/scroll that starts on a horizontally scrollable row (nav buttons,
   filter chips) must scroll the page only - never nudge the row sideways. */
(function initAxisLock() {
  const SEL = '.site-actions, .mix-filter-row, .cams-chips';
  let row = null, sx = 0, sy = 0, startLeft = 0, axis = '';
  document.addEventListener('touchstart', e => {
    row = e.target.closest ? e.target.closest(SEL) : null;
    if (!row || !e.touches[0]) { row = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; startLeft = row.scrollLeft; axis = '';
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!row || !e.touches[0]) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (!axis && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) axis = Math.abs(dy) > Math.abs(dx) ? 'y' : 'x';
    if (axis === 'y') row.scrollLeft = startLeft;
  }, { passive: true });
  const end = () => { row = null; axis = ''; };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
  document.addEventListener('wheel', e => {
    const r = e.target.closest ? e.target.closest(SEL) : null;
    if (!r || e.ctrlKey || e.shiftKey) return;
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      window.scrollBy({ top: e.deltaY, left: 0, behavior: 'instant' });
    }
  }, { passive: false });
})();

/* Measure the real heights of the pinned bars so nothing can show through the gaps between them. */
function syncStickyOffsets() {
  const root = document.documentElement;
  const hdr = document.querySelector('.app > header.section-nav-sticky');
  if (hdr) root.style.setProperty('--nav-h', hdr.getBoundingClientRect().height + 'px');
  const ctl = results.querySelector('.feed > .feed-controls-sticky') || document.querySelector('.feed-controls-sticky');
  if (ctl) root.style.setProperty('--controls-h', ctl.getBoundingClientRect().height + 'px');
}
(function initStickyOffsets() {
  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { try { syncStickyOffsets(); updateNetworkBarActive(); } catch (_) {} }); };
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(syncStickyOffsets) : null;
  const watch = () => {
    if (!ro) return;
    ro.disconnect();
    const hdr = document.querySelector('.app > header.section-nav-sticky');
    if (hdr) ro.observe(hdr);
    document.querySelectorAll('.feed-controls-sticky').forEach(el => ro.observe(el));
  };
  new MutationObserver(() => { watch(); schedule(); }).observe(results, { childList: true, subtree: true });
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  watch(); schedule();
})();

/* The button row (.site-actions) is re-parented on every render, which resets its
   horizontal scroll to 0. Remember the position and put it back after each move. */
let navActionsScrollLeft = 0;
(function trackNavScroll() {

  siteActions.addEventListener('scroll', () => {

    if (siteActions.isConnected && !siteActions.closest('#navActionStaging')) {

})();
function restoreNavScroll() {
  if (!siteActions) return;

  apply();

}

function updateNetworkBarActive() {

/** Fade the edges of the button row where more buttons are hidden. */
function updateNavFades() {
  if (!siteActions) return;
  const max = siteActions.scrollWidth - siteActions.clientWidth;
  siteActions.classList.toggle('fade-left', siteActions.scrollLeft > 4);
  siteActions.classList.toggle('fade-right', max > 4 && siteActions.scrollLeft < max - 4);
}
/** Scroll the button row so this button sits at its left edge: the buttons after it come into view. */
function alignNavButton(button) {
  if (!button || !siteActions || !siteActions.isConnected || siteActions.closest('#navActionStaging')) return;
  const bar = siteActions, br = bar.getBoundingClientRect(), r = button.getBoundingClientRect();
  if (!br.width || !r.width) return;
  const max = Math.max(0, bar.scrollWidth - bar.clientWidth);
  const target = Math.max(0, Math.min(Math.round(bar.scrollLeft + (r.left - br.left) - 12), max));
  if (Math.abs(target - bar.scrollLeft) > 1) {
    try { bar.scrollTo({ left: target, behavior: 'smooth' }); } catch (_) { bar.scrollLeft = target; }
  }
  updateNavFades();
}
if (siteActions) {
  siteActions.addEventListener('click', (e) => {          // pressing a button scrolls the row to it: the next buttons show up
    const b = e.target.closest && e.target.closest('button.action');
    if (b && siteActions.contains(b)) alignNavButton(b);
  }, true);
  siteActions.addEventListener('scroll', updateNavFades, { passive: true });
  window.addEventListener('resize', updateNavFades);
  window.addEventListener('load', updateNavFades);
}

  setStatus(`Loading ${feed.name}…`, true);
  if (!results.querySelector('.feed[data-site="__loading__"] .feed-controls-sticky')) {
    rescueSearchBar();
    results.innerHTML = homeLoadingHtml();
    const loadingFeed = results.querySelector('.feed');
    if (loadingFeed) {
      placeFeedControlsInFeed(loadingFeed);
      placeSearchInFeed(loadingFeed);
    }
  }
  bindChips();
  try {
    const srcs = feed.siteIds.map(getSource);
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: srcs.map(x => x.url) }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const raw = json.results || [];

    const seen = new Set();
    const pages = new Map();
    const groups = srcs.map((src, i) => {
      const data = raw[i] || {};
      const site = data.page || src.url;
      src.url = site;
      const sf = feedOfSource(src.id);    // General or BDSM -> drives the label + filter chip
      const items = [];
      (data.items || []).forEach(it => {
        const k = (it.link || '').split('?')[0];
        if (!k || seen.has(k)) return;
        seen.add(k);
        items.push({ ...it, _host: hostOf(site), _feed: sf.id, _label: src.name, _sourceId: src.id });
      });
      pages.set(site, {
        next_page: items.length ? (data.next_page || guessNextUrl(site, 2) || '') : '',
        page_num: data.page_num || 1,
        exhausted: !items.length || !data.next_page,
        emptyCount: 0, retryCount: 0,
      });
      return { site, name: src.name, sourceId: src.id, feedId: sf.id, label: src.name, error: data.error, items };
    });
    const merged = groups.flatMap(g => g.items);
    mixStates.set(feedId, {
      feedId, groups, pages, seen, loading: false, filter: homeFilter, noun: 'preview',
      items: shuffleArray(merged),
    });
    renderMixedFeed(feedId);
    if (!skipPush) replaceNav({ view: 'feed', feedId, feedUrl: key });
    setStatus(`${feed.name} — ${merged.length} previews`, false);
  } catch (err) {
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus(`${feed.name} load error`, false);
  } finally {
    busy = false;
  }
}

/** Fisher–Yates shuffle (returns a new array). */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const PM_GROUPS = {
  models:     ['⭐', 'Stars',            'tag-pornstar'],
  studios:    ['📺', 'Series / Studios', 'tag-series'],
  uploaders:  ['👤', 'Uploader',         'tag-uploader'],

};
const PM_KIND_OF_TYPE = { pornstar: 'models', series: 'studios', studio: 'studios', uploader: 'uploaders', genre: 'categories' };

/** Build a metadata object from a scraped card (same shape the backend sends). */
function playerMetaFromItem(item) {
  if (!item) return null;
  if (item._cam || item._chan) return item._meta || null;          // live cams: details are built from the scraped card
  const groups = {};
  for (const m of (item.meta_links || [])) {
    const kind = PM_KIND_OF_TYPE[m.type];
    if (!kind || !m.link || !m.label) continue;
    (groups[kind] = groups[kind] || []).push({ name: m.label, link: m.link });
  }
  return {
    duration: item.duration || null, date: item.added || null, views: item.views || null,
    rating: item.rating || null, description: null,
    groups: Object.keys(PM_GROUPS).filter(k => groups[k]).map(k => ({ kind: k, items: groups[k] })),
  };
}

/** Page metadata wins per field/group; the card's data fills any gap. */
function mergePlayerMeta(seed, page) {
  if (!seed) return page;
  if (!page) return seed;
  const out = { ...seed, ...Object.fromEntries(Object.entries(page).filter(([k, v]) => k !== 'groups' && v)) };
  const byKind = {};
  for (const g of (seed.groups || [])) byKind[g.kind] = g;
  for (const g of (page.groups || [])) if (g.items && g.items.length) byKind[g.kind] = g;
  out.groups = Object.keys(PM_GROUPS).filter(k => byKind[k]).map(k => byKind[k]);
  return out;
}

function renderPlayerMeta(m) {
  if (!mainPlayerMeta) return;
  if (!m) { mainPlayerMeta.hidden = true; return; }
  const stat = (icon, label, v) => v ? `<span title="${label}">${icon} ${escapeHtml(String(v))}</span>` : '';
  const stats = stat('⏱', 'Duration', m.duration) + stat('📅', 'Added', m.date) +
                stat('👁', 'Views', m.views) + stat('👍', 'Rating', m.rating) + stat('🎂', 'Age', m.age);
  const groups = (m.groups || []).filter(g => g.items && g.items.length).map(g => {
    const [icon, label, cls] = PM_GROUPS[g.kind] || ['🔗', g.label || g.kind, ''];
    const chips = g.items.map(it => it.link
      ? `<span class="tag-chip ${cls}" role="link" tabindex="0" data-meta-link="${escapeHtml(it.link)}"
           data-meta-name="${escapeHtml(it.name)}" title="Open ${escapeHtml(it.name)}">${escapeHtml(it.name)}</span>`
      : `<span class="tag-chip pm-plain ${cls}">${escapeHtml(it.name)}</span>`).join('');
    return `<div class="pm-group"><div class="pm-label">${icon} ${label}</div><div class="pm-chips">${chips}</div></div>`;
  }).join('');
  const desc = m.description
    ? `<div class="pm-desc">${escapeHtml(m.description)}</div><button type="button" class="pm-more" hidden>See more</button>` : '';
  if (!stats && !groups && !desc) { mainPlayerMeta.hidden = true; return; }
  const collapsed = mainPlayerMeta.classList.contains('collapsed');
  mainPlayerMeta.innerHTML = `<div class="pm-stats">${stats}${(groups || desc)
    ? `<button type="button" class="pm-toggle">${collapsed ? '▸ Details' : '▾ Details'}</button>` : ''}</div>${desc}${groups}`;
  mainPlayerMeta.hidden = false;
  updateDescMore();
}

/** Show "See more" only when the story is actually cut off (long text); a hidden panel falls back to text length. */
function updateDescMore() {
  const d = mainPlayerMeta && mainPlayerMeta.querySelector('.pm-desc');

  if (!d || !btn) return;
  const measure = () => {
    if (d.classList.contains('open')) { btn.hidden = false; return; }
    const cut = d.clientHeight > 0 ? d.scrollHeight > d.clientHeight + 2 : (d.textContent || '').length > 160;
    btn.hidden = !cut;
  };
  measure();
  requestAnimationFrame(measure);       // once the panel has been laid out
}

/** PornVideoBB lists the same words as Genres and Tags: show them once, as Genres (also fixes cached answers). */
function cleanPageMeta(detail, m) {
  try {
    if (!m || !Array.isArray(m.groups) || !/pornvideobb\./i.test(new URL(detail).hostname)) return m;
    const has = k => m.groups.some(g => g.kind === k && g.items && g.items.length);
    m.groups = has('categories')
      ? m.groups.filter(g => g.kind !== 'tags')
      : m.groups.map(g => g.kind === 'tags' ? { ...g, kind: 'categories' } : g);
  } catch (e) { /* leave as is */ }
  return m;
}

let sentinelObserver = null;
function observeSentinel(siteUrl) {
  if (!sentinelObserver) {
    sentinelObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const url = entry.target.getAttribute('data-site');
        if (url === WEBSEARCH_TAB) return;
        if (url && url === activeTab) loadNextPageForSite(url);
      });
    }, { rootMargin: '250px 0px', threshold: 0 });
  }
  document.querySelectorAll('.sentinel').forEach(s => sentinelObserver.observe(s));
}

const MAX_EMPTY = 3;
const MAX_RETRY = 4;

function ensureState(siteUrl) {
  if (!siteState.has(siteUrl)) {
    siteState.set(siteUrl, {
      next_page: null, page_num: 1, loading: false, exhausted: false,
      emptyCount: 0, retryCount: 0, error: false,
    });
  }
  return siteState.get(siteUrl);
}

async function loadNextPageForSite(siteUrl) {
  if (siteUrl !== activeTab) return;
  if (siteUrl === WEBSEARCH_TAB) return loadMoreWebSearch();
  if (feedQueries.get(siteUrl)) return;      // searching: the scroll handler / button in the search module loads more
  if (siteUrl.startsWith(MIX_PREFIX)) return loadMoreMixed(siteUrl);
  const st = ensureState(siteUrl);
  if (st.loading || st.exhausted) return;

  const feed = results.querySelector(`.feed[data-site="${CSS.escape(siteUrl)}"]`);
  if (!feed) return;
  const grid = feed.querySelector('.videos');
  const slot = grid.querySelector('.loading-row-slot');
  const nextUrl = st.next_page;
  if (!nextUrl) { st.exhausted = true; return; }

  st.loading = true;

  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more previews…</div>`;
  grid.insertBefore(loader, slot);

  const nextPageNum = (st.page_num || 1) + 1;

  try {
    const data = await fetchNextWithRetry(nextUrl, nextPageNum);
    if (!data || !data.items || !data.items.length) {
      st.emptyCount++;
      loader.innerHTML = `<div style="opacity:.6;">No more previews</div>`;
      setTimeout(() => loader.remove(), 1500);
      if (st.emptyCount >= MAX_EMPTY || !data?.next_page) st.exhausted = true;
      else { st.next_page = data.next_page || ''; st.page_num = nextPageNum; scheduleRecheck(siteUrl); }
      st.loading = false;
      return;
    }
    st.emptyCount = 0; st.retryCount = 0; st.error = false;

    const host = hostOf(siteUrl);
    const store = siteData.get(siteUrl);
    const existingLinks = new Set(
      (store?.items || []).map(it => (it.link || '').split('?')[0]).filter(Boolean)
    );
    const existingCards = new Set(
      [...grid.querySelectorAll('.card[data-detail]')].map(c => (c.getAttribute('data-detail') || '').split('?')[0]).filter(Boolean)
    );
    const freshItems = [];
    for (const it of data.items) {
      const linkKey = (it.link || '').split('?')[0];
      if (!linkKey || existingLinks.has(linkKey) || existingCards.has(linkKey)) continue;
      existingLinks.add(linkKey);
      existingCards.add(linkKey);
      freshItems.push({ ...it, _host: host });
    }

    // Some sites return the same page forever when our guessed pagination URL
    // is invalid. Treat a page with zero genuinely new links as exhaustion.
    if (!freshItems.length) {
      st.emptyCount++;
      if (st.emptyCount >= 1) st.exhausted = true;
      loader.innerHTML = `<div style="opacity:.6;">No new previews</div>`;
      setTimeout(() => loader.remove(), 900);
      st.page_num = nextPageNum;
      st.loading = false;
      return;
    }

    st.emptyCount = 0;
    const items = freshItems;
    if (store) store.items.push(...items);

    const si = Math.floor(Math.random() * 1e6);
    const temp = document.createElement('div');
    temp.innerHTML = items.map(it => cardHtml(it, si)).join('');
    while (temp.firstElementChild) grid.insertBefore(temp.firstElementChild, loader);

    const countBadge = feed.querySelector('.count-badge');
    const totalNow = grid.querySelectorAll('.card').length;
    if (countBadge) countBadge.textContent = `🎬 ${totalNow} preview${totalNow !== 1 ? 's' : ''}`;

    st.page_num = nextPageNum;
    st.next_page = data.next_page || guessNextUrl(nextUrl, nextPageNum + 1) || '';
    if (!st.next_page) st.exhausted = true;

    loader.remove();
    scheduleRecheck(siteUrl);
  } catch (err) {
    st.retryCount++;
    loader.innerHTML = `<div style="color:#f87171;">Retrying… (${st.retryCount}/${MAX_RETRY})</div>`;
    if (st.retryCount >= MAX_RETRY) {
      loader.innerHTML = `<div style="color:#f87171;">Failed to load more</div>`;
      setTimeout(() => loader.remove(), 2000);
      st.exhausted = true;
    } else {
      loader.remove();
      const backoff = Math.min(8000, 800 * Math.pow(2, st.retryCount - 1));
      setTimeout(() => { if (siteUrl === activeTab) scheduleRecheck(siteUrl); }, backoff);
    }
  } finally { st.loading = false; }
}

async function fetchNextWithRetry(nextUrl, pageNum) {
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls: [{ url: nextUrl, page_num: pageNum }] })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      return (json.results || [])[0] || null;
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr || new Error('unknown');
}

function guessNextUrl(baseUrl, pageNum) {
  try {
    const u = new URL(baseUrl);
    if (u.searchParams.has('page')) { u.searchParams.set('page', String(pageNum)); return u.toString(); }
    if (/\/page\/\d+\/?$/.test(u.pathname)) {
      u.pathname = u.pathname.replace(/\/page\/\d+\/?$/, `/page/${pageNum}/`);
      return u.toString();
    }
    if (/\/\d+\/?$/.test(u.pathname)) {
      u.pathname = u.pathname.replace(/\/\d+\/?$/, `/${pageNum}/`);
      return u.toString();
    }
    u.searchParams.set('page', String(pageNum));
    return u.toString();
  } catch { return null; }
}

function scheduleRecheck(siteUrl) {
  setTimeout(() => {
    if (siteUrl !== activeTab) return;
    if (feedQueries.get(siteUrl)) return;                 // searching: pages load on scroll only
    const s = results.querySelector(`.sentinel[data-site="${CSS.escape(siteUrl)}"]`);
    if (!s) return;
    const rect = s.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    // Only auto-load next page when the sentinel is near the viewport
    if (rect.top - vh < 280) loadNextPageForSite(siteUrl);
  }, 120);
}

function switchTab(tabKey) {
  if (tabKey === activeTab) return;
  renderFeed(tabKey);
  scheduleRecheck(tabKey);
}

    scheduleCategoryRecheck();
    // Restore scroll position
    requestAnimationFrame(() => {
      window.scrollTo({ top: categoriesState.scrollY || 0, behavior: 'instant' });

  if (busy) return;

    }));

    if (!merged.length && anyError) throw anyError;

    const data = {

/** One page of one source -> { sections, next }. Tiles (no mode) become video-less sections. */
async function fetchStudioPage(url, mode, group) {

/** Keep fetching next pages while a name search is active and we need more matches. */
async function searchStudioDeeper() {
  const q = (studioState.nameQuery || '').trim();
  if (!q || activeTab !== studioTab) return;
  if (studioState.searchLoading) return;
  const token = ++studioState.searchToken;
  const MAX_PAGES = 12;
  let guard = 0;
  studioState.searchLoading = true;
  const list = results.querySelector('.studio-list');
  let skeletons = null;
  if (studioTab === NETWORKS_TAB && list) {
    const slot = list.querySelector('.loading-row-slot');
    const holder = document.createElement('div');
    holder.innerHTML = searchSkeletonsHtml(6).replace('class="search-skeletons"', 'class="search-skeletons network-search-skeletons"');
    skeletons = holder.firstElementChild;
    list.insertBefore(skeletons, slot || null);
  }
  applyStudioFilter();
  try {
    while (
      activeTab === studioTab
      && token === studioState.searchToken
      && (studioState.nameQuery || '').trim() === q
      && !studioState.exhausted
      && !studioState.searchExhausted
      && guard++ < MAX_PAGES
    ) {
      const shown = applyStudioFilter();
      if (shown) break;
      if (studioState.loading) {
        await new Promise(r => setTimeout(r, 200));
        continue;
      }
      if (!studioState.next_page || studioState.searchPages >= MAX_PAGES) {
        studioState.searchExhausted = true;
        break;
      }
      const before = studioState.sections.length;
      await loadNextStudioPage();
      if (token !== studioState.searchToken) return;
      studioState.searchPages++;
      if (studioState.sections.length <= before) {
        if (!studioState.next_page) studioState.searchExhausted = true;
        else await new Promise(r => setTimeout(r, 200));
      }
    }
  } finally {
    if (skeletons) skeletons.remove();
    if (token === studioState.searchToken) {
      studioState.searchLoading = false;
      if (guard >= MAX_PAGES || !studioState.next_page || studioState.exhausted) studioState.searchExhausted = true;
      applyStudioFilter();
    }
  }
}

async function loadNextStudioPage() {
  if (activeTab !== studioTab) return;
  const st = studioState;
  const tabAtStart = studioTab;
  if (st.loading || st.exhausted || !st.next_page) {
    if (!st.next_page) st.exhausted = true;
    return;
  }

  st.loading = true;
  const feed = results.querySelector(`.feed[data-site="${studioTab}"]`);
  const list = feed && feed.querySelector('.studio-list');
  const slot = list && list.querySelector('.loading-row-slot');
  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more sites…</div>`;
  const isNet = tabAtStart === NETWORKS_TAB;
  const searchingNetwork = isNet && st.searchLoading && !!st.nameQuery;
  if (!searchingNetwork) {
    if (slot) list.insertBefore(loader, slot);
    else if (list) list.appendChild(loader);
  }
  try {
    const jobs = isNet
      ? Object.entries(st.nexts || {}).filter(([, u]) => u).map(([g, u]) => ({ group: g, url: u, mode: networkMode(g) }))
      : [{ group: '', url: st.next_page, mode: 'sites' }];
    const got = await Promise.all(jobs.map(async (j) => {
      try { return { j, r: await fetchStudioPage(j.url, j.mode, j.group) }; }
      catch (e) { return { j, err: e }; }
    }));
    if (tabAtStart !== studioTab) { loader.remove(); return; }   // user switched view meanwhile
    if (got.length && got.every(x => x.err)) throw got[0].err;

    const existing = new Set(st.sections.map(s => (s.link || '').split('?')[0]));
    const uniqueNew = [];
    for (const { j, r, err } of got) {
      let fresh = 0;
      if (!err) for (const s of r.sections) {
        const key = (s.link || '').split('?')[0];
        if (!key || existing.has(key)) continue;
        existing.add(key); uniqueNew.push(s); fresh++;
      }
      // a source that failed or adds nothing new is finished (also stops repeating guessed pages)
      if (isNet) st.nexts[j.group] = (!err && fresh && r.next) ? r.next : '';
      else st.next_page = (!err && r.next) || null;
    }
    if (isNet) st.next_page = Object.values(st.nexts).find(Boolean) || null;

    st.page_num = (st.page_num || 1) + 1;
    st.exhausted = !st.next_page || (!isNet && !uniqueNew.length);

    if (uniqueNew.length) {
      st.sections.push(...uniqueNew);
      st.retryCount = 0;
      lastStudioData = {
        ...(lastStudioData || {}),
        sections: st.sections.slice(),
        next_page: st.next_page,
        nexts: { ...(st.nexts || {}) },
        page_num: st.page_num,
        count: st.sections.length,
        kind: 'pornsites',
      };
      loader.remove();
      renderStudioSections({ sections: uniqueNew, next_page: st.next_page }, true);
      applyStudioFilter();
    } else {
      loader.remove();
      if (!isNet) st.exhausted = true; else if (!st.exhausted) scheduleStudioRecheck();
    }
  } catch (err) {
    st.retryCount = (st.retryCount || 0) + 1;
    loader.innerHTML = `<div style="color:#f87171;">Retrying… (${st.retryCount}/4)</div>`;
    if (st.retryCount >= 4) {
      loader.innerHTML = `<div style="color:#f87171;">Failed to load more sites</div>`;
      setTimeout(() => loader.remove(), 2000);
      st.exhausted = true;
    } else {
      loader.remove();
      const backoff = Math.min(8000, 800 * Math.pow(2, st.retryCount - 1));
      setTimeout(() => {
        if (activeTab === studioTab) scheduleStudioRecheck();
      }, backoff);
    }
  } finally {
    st.loading = false;
  }
}

function scheduleStudioRecheck() {
  setTimeout(() => {
    if (activeTab !== studioTab) return;
    if (studioState.loading || studioState.exhausted) return;
    if ((studioState.nameQuery || '').trim()) {
      const shown = [...results.querySelectorAll('.studio-section')]
        .filter(el => el.style.display !== 'none').length;
      if (!shown && !studioState.searchExhausted) searchStudioDeeper();
      return;
    }
    const s = results.querySelector(`.sentinel[data-site="${studioTab}"]`);
    if (!s) return;
    const rect = s.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (rect.top - vh < 280) loadNextStudioPage();
  }, 120);
}

/** Every video of a studio goes on ONE line (as in the original layout): equal-size cards that
 *  fill the row, so the last card ends right under the "See All" button. Only if a studio has so
 *  many videos that cards would drop below the minimum width does the row scroll sideways. */
const STUDIO_MIN_CARD = 200;
function fitStudioRows(root = document) {
  root.querySelectorAll('.studio-row').forEach(row => {
    const w = row.clientWidth;
    if (!w) return;
    const gap = 12;   // .75rem
    const count = row.querySelectorAll(':scope > .card').length || 1;
    const fit = Math.max(1, Math.floor((w + gap) / (STUDIO_MIN_CARD + gap)));
    row.style.setProperty('--n', Math.min(count, fit));
  });
}
window.addEventListener('resize', fitStudioRows);

function bindCombinedCategorySearch() {
  const input = document.getElementById('categorySearchInput');
  if (!input) return;

  // Live local filter — updates as you type; clearing restores full list
  const runLive = () => {
    const q = (input.value || '').trim();
    categoriesState.nameQuery = q;
    applyCategoryNameFilter();
    saveCategoryCache(COMBINED_CAT_CACHE_KEY);
    if (!q) {
      // Deleted search keyword → show all categories for current menu
      refreshCategoryGridFromState();
      applyCategoryNameFilter();
      scheduleCategoryRecheck();
      setStatus(`Categories — ${(categoriesState.categories || []).length}`, false);
    }
  };

  // Full website search (finds categories not loaded yet)
  const runWebsite = () => {
    const q = (input.value || '').trim();
    categoriesState.nameQuery = q;
    if (!q) {
      runLive();
      return;
    }
    searchCategoriesByName(q);
  };

  // Re-bind every render. Typing = instant local filter, then (after a pause) the websites are searched too.
  input.oninput = () => {
    clearTimeout(input._catTimer);
    clearTimeout(input._catDeep);
    input._catTimer = setTimeout(runLive, 120);
    input._catDeep = setTimeout(() => {
      if ((input.value || '').trim().length >= 2) runWebsite();
    }, 450);
  };
  input.onkeydown = (e) => {
    if (e.key === 'Enter') e.preventDefault();          // live search only

    // Esc clears search and restores all
    if (e.key === 'Escape') {
      e.preventDefault();
      input.value = '';
      clearTimeout(input._catTimer);
      runLive();
    }
  };

  // Sync input with state
  if (categoriesState.nameQuery && input.value !== categoriesState.nameQuery) {
    input.value = categoriesState.nameQuery;
  }
}

/**
 * Search for category *tiles* by name from the live websites
 * (not only categories already loaded in the grid).
 * Stays on the Categories view — does not open video results.
 */
async function searchCategoriesByName(query) {
  if (busy) return;
  const q = (query || '').trim();
  if (!q) return;
  const slug = toSlug(q);
  const filter = categoriesState.filterSource || 'all';

  const sources = COMBINED_CATEGORY_SOURCES.filter(
    s => filter === 'all' || feedOfSource(s.id).id === filter
  );
  if (!sources.length) return;

  busy = true;
  if (categoriesBtn) categoriesBtn.disabled = true;
  setStatus(`Searching categories for “${q}”…`, true);

  // Soft loading indicator without wiping the page
  const feed = results.querySelector(`.feed[data-site="${CATEGORIES_TAB}"]`);
  let banner = feed && feed.querySelector('.cat-search-loading');
  if (feed && !banner) {
    banner = document.createElement('div');
    banner.className = 'cat-search-loading';
    banner.style.cssText = 'padding:.75rem 1.4rem;color:#9aa9c1;font-size:.85rem;border-bottom:1px solid #1e2738;';
    banner.innerHTML = `<span class="mini-spinner" style="display:inline-block;vertical-align:middle;margin-right:.5rem;"></span> Searching websites for “${escapeHtml(q)}”…`;
    const grid = feed.querySelector('.videos');
    if (grid) feed.insertBefore(banner, grid);
  }

  const found = new Map();

  try {
    // 1) Matches already loaded
    for (const c of (categoriesState.categories || [])) {
      if (searchWordsMatch(c.name || '', queryWords(q))) {
        const key = (c.link || '').split('?')[0];
        if (key) found.set(key, c);
      }
    }

    // 2) Direct category URL from slug → category tile (if page has content)
    await Promise.all(sources.map(async (src) => {
      if (!slug) return;
      const url = src.feedUrl(slug);
      try {
        const res = await fetch('/api/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls: [url] }),
        });
        if (!res.ok) return;
        const json = await res.json();
        const data = (json.results || [])[0];
        if (!data || data.error || !(data.items || []).length) return;
        const key = (data.page || url).split('?')[0];
        if (found.has(key)) return;
        found.set(key, {
          name: q.replace(/\b\w/g, ch => ch.toUpperCase()),
          link: key,
          thumbnail: (data.items[0] && data.items[0].thumbnail) || null,
          sourceId: src.id,
        });
      } catch { /* ignore */ }
    }));

    // 3) Walk category indexes on each site until matches found or pages run out
    const maxPages = 15;
    await Promise.all(sources.map(async (src) => {
      let pageUrl = src.indexUrl;
      for (let i = 0; i < maxPages && pageUrl; i++) {
        try {
          const res = await fetch('/api/scrape-categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: pageUrl }),
          });
          if (!res.ok) break;
          const json = await res.json();
          if (json.error) break;

          for (const c of (json.categories || [])) {
            const key = (c.link || '').split('?')[0];
            if (!key) continue;
            // Always grow the master list so scroll has more to show later
            if (!(categoriesState.categories || []).some(x => (x.link || '').split('?')[0] === key)) {
              categoriesState.categories.push({ ...c, sourceId: src.id });
            }
            if (searchWordsMatch(c.name || '', queryWords(q)) && !found.has(key)) {
              found.set(key, { ...c, sourceId: src.id });
            }
          }

          // Track pagination for this source
          if (!categoriesState.nextBySource) categoriesState.nextBySource = {};
          categoriesState.nextBySource[src.id] = json.next_page || '';
          pageUrl = json.next_page || null;
        } catch {
          break;
        }
      }
    }));

    // Merge finds into master list
    for (const cat of found.values()) {
      const key = (cat.link || '').split('?')[0];
      if (!(categoriesState.categories || []).some(x => (x.link || '').split('?')[0] === key)) {
        categoriesState.categories.push(cat);
      }
    }

    categoriesState.next_page =
      Object.values(categoriesState.nextBySource || {}).find(Boolean) || categoriesState.next_page || '';
    categoriesState.exhausted = !categoriesState.next_page;
    categoriesState.nameQuery = q;
    categoriesState.kind = 'categories';

    // Re-render category grid, then filter to search matches. Only if Categories is still the view on screen:
    // if the user went elsewhere meanwhile, the results are kept in categoriesState and must not hijack the screen
    // (or hide the search bar of the feed they opened).
    categoriesState.nameQuery = q;
    if (activeTab === CATEGORIES_TAB) {
      const data = {
        categories: (categoriesState.categories || []).slice(),
        count: (categoriesState.categories || []).length,
        next_page: categoriesState.next_page,
        nextBySource: { ...(categoriesState.nextBySource || {}) },
        page_num: categoriesState.page_num || 1,
        kind: 'categories',
      };
      renderCategories(data, false, { kind: 'categories' });
      categoriesState.nameQuery = q;
      const input = document.getElementById('categorySearchInput');
      if (input) input.value = q;
      applyCategorySourceFilter(filter);
      applyCategoryNameFilter();

      setStatus(
        found.size
          ? `Categories — ${found.size} match${found.size !== 1 ? 'es' : ''} for “${q}”`
          : `No categories matching “${q}”`,
        false
      );
    }
  } catch (err) {
    setStatus(`Category search error: ${err.message}`, false);
  } finally {
    if (banner) banner.remove();
    busy = false;
    if (categoriesBtn) categoriesBtn.disabled = false;
  }
}

/** Load (or show) the homepage feed for a source id. */
async function loadSourceFeed(sourceId, { force = false, skipPush = false } = {}) {
  const src = getSource(sourceId);
  if (!src) return;
  const label = feedOfSource(sourceId).name;

  // Already have data — just render
  if (!force && siteData.has(src.url)) {
    activeTab = src.url;
    renderFeed(src.url);
    if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: src.url });
    const n = siteData.get(src.url)?.items?.length || 0;
    setStatus(`${label} — ${n} preview${n !== 1 ? 's' : ''}`, false);
    scheduleRecheck(src.url);
    return;
  }

  // Also check resolved page keys for this source
  const existingKey = [...siteData.keys()].find(k => {
    const s = sites.find(x => x.url === k);
    return s && s.sourceId === sourceId;
  });
  if (!force && existingKey && siteData.has(existingKey)) {
    // Prefer homepage URL entry
    const homeEntry = [...siteData.keys()].find(k => hostOf(k) === hostOf(src.url));
    const key = homeEntry || existingKey;
    // Only use if it's the homepage-ish, not a deep category
    if (homeEntry) {
      activeTab = homeEntry;
      renderFeed(homeEntry);
      if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: homeEntry });
      scheduleRecheck(homeEntry);
      return;
    }
  }

  if (busy) return;
  busy = true;
  setStatus(`Loading ${label}…`, true);
  showSectionLoading(`${label} previews`);

  try {
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: [src.url] })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const data = (json.results || [])[0];
    if (!data) throw new Error('No data returned');

    const key = data.page || src.url;
    if (!sites.find(s => s.url === key || s.url === src.url)) {
      sites.unshift({ name: src.name, url: key, sourceId: src.id });
    } else {
      sites = sites.map(s =>
        (s.sourceId === src.id || s.url === src.url)
          ? { name: src.name, url: key, sourceId: src.id }
          : s
      );
    }
    // Keep SOURCES url aligned if server redirected
    src.url = key;

    siteData.set(key, {
      page: key,
      page_title: data.page_title,
      error: data.error,
      items: (data.items || []).map(it => ({ ...it, _host: hostOf(key) })),
    });
    siteState.set(key, {
      next_page: data.next_page || guessNextUrl(key, 2) || '',
      page_num: data.page_num || 1,
      loading: false,
      exhausted: !data.next_page,
      emptyCount: 0, retryCount: 0, error: !!data.error,
    });

    activeTab = key;
    renderFeed(key);
    if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: key });
    const total = data.items?.length || 0;
    setStatus(`${label} — ${total} preview${total !== 1 ? 's' : ''}`, false);
  } catch (err) {
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus(`${label} load error`, false);
  } finally {
    busy = false;
  }
}

/** Turn free text into a URL slug: "Hog Tied" → "hog-tied" */
function toSlug(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/['’]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}

      added++;
    }
    // stop when a page adds nothing new (end of the list or a repeating guessed page)
    st.next[i] = (added && data.next_page && st.pages[i] < 40) ? data.next_page : '';
  } catch (err) {
    st.next[i] = '';
    st.errors.push(`${hostOf(url)}: ${err.message}`);
  }
  return added;
}

function catalogCardHtml(c, kind) {
  const name = escapeHtml(c.name || 'Untitled');
  const ph = c.thumbnail ? escapeHtml(c.thumbnail)
    : 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const feed = feedOfSource(c.sourceId);
  return `<a class="card category-card${kind === 'pornstars' ? ' portrait' : ''}" href="#" data-link="${escapeHtml(c.link)}"
             data-name="${escapeHtml(c.name || '')}" data-source-id="${escapeHtml(c.sourceId)}"
             data-group="${escapeHtml(c.group || '')}" title="${name}">
    <div class="thumb"${c.thumbnail ? ` style="--bg:url(&quot;${ph}&quot;)"` : ''}>
      <img src="${ph}" loading="lazy" alt="${name}" referrerpolicy="no-referrer" onerror="this.style.opacity=0">
      <span class="site-label s-${escapeHtml(feed.id)}">${escapeHtml(feed.name)}</span>
    </div>
    <div class="info"><div class="title">${name}</div>${c.video_count ? `<div class="meta">${Number(c.video_count).toLocaleString()} videos</div>` : ''}</div>

function catalogChipsHtml(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  const groups = [...new Set(cfg.sources.map(s => s.group))];
  if (groups.length < 2) return '';
  const chip = (id, label) => {
    const state = st.filter === id ? 'active' : (st.filter === 'all' ? '' : 'dim');
    return `<span data-cat-group="${id}" class="chip-btn ${id === 'all' ? '' : 'chip-' + id} ${state}">${label}</span>`;
  };
  return `<div class="badges catalog-chips" style="padding:.6rem 1.4rem;gap:.5rem;display:flex;flex-wrap:wrap">
    ${chip('all', 'All')}${groups.map(g => chip(g, g === 'bdsm' ? 'BDSM' : 'General')).join('')}</div>`;
}

function renderCatalog(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  hideSearchBar();
  activeTab = cfg.tab;
  setTimeout(updateNetworkBarActive, 0);
  const groups = [...new Set(cfg.sources.map(s => s.group))];
  const subtitle = groups.length > 1 ? 'General Porn + BDSM' : 'General Porn';
  rescueSearchBar(); results.innerHTML = `
    <div class="feed" data-site="${cfg.tab}">
      <div class="feed-header section-intro">
        <div>
          <div class="feed-name">${cfg.icon} ${escapeHtml(cfg.title)}</div>
          <div class="feed-url">${subtitle}</div>
        </div>
        <div class="badges"><span class="count-badge">🗂️ ${st.items.length}</span></div>
      </div>
      ${catalogChipsHtml(kind)}
      <div class="cat-search-bar">
        <input id="catalogSearchInput" type="search" placeholder="Search ${cfg.noun}s by name…" autocomplete="off" />
      </div>
      <div class="videos">
        <div class="loading-row-slot"></div>
      </div>
      <div class="sentinel" data-site="${cfg.tab}"></div>
    </div>`;
  refreshCatalogGrid(kind);
  bindCatalogControls(kind);
}

function refreshCatalogGrid(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  const feed = results.querySelector(`.feed[data-site="${cfg.tab}"]`);
  const grid = feed && feed.querySelector('.videos');
  if (!grid) return;
  const slot = grid.querySelector('.loading-row-slot');
  grid.querySelectorAll('.category-card, .cat-filter-empty').forEach(el => el.remove());
  const sorted = st.items.slice().sort((a, b) =>
    (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true }));
  const temp = document.createElement('div');
  temp.innerHTML = sorted.map(c => catalogCardHtml(c, kind)).join('');
  while (temp.firstElementChild) grid.insertBefore(temp.firstElementChild, slot);
  bindCategoryCards();
  applyCatalogFilter(kind);
  observeCatalogSentinel(kind);
}

function applyCatalogFilter(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  const feed = results.querySelector(`.feed[data-site="${cfg.tab}"]`);
  if (!feed) return 0;
  let visible = 0;
  feed.querySelectorAll('.category-card').forEach(card => {
    const ok = (st.filter === 'all' || card.getAttribute('data-group') === st.filter)
      && catMatch(card.getAttribute('data-name'), st.q);
    card.style.display = ok ? '' : 'none';
    if (ok) visible++;
  });
  const grid = feed.querySelector('.videos');
  let empty = feed.querySelector('.cat-filter-empty');
  if (!visible && !st.loading) {
    if (!empty) {
      empty = document.createElement('div');
      empty.className = 'cat-filter-empty';
      empty.style.cssText = 'grid-column:1/-1;padding:2rem;text-align:center;color:#7a8aaa;';
      grid.insertBefore(empty, grid.querySelector('.loading-row-slot'));
    }
    empty.textContent = st.q ? `No ${cfg.noun}s matching “${st.q}”${st.done ? '.' : ' yet — still looking through every page…'}`
      : (st.errors[0] ? `No ${cfg.noun}s found (${st.errors[0]}).` : `No ${cfg.noun}s found.`);
  } else if (empty) { empty.remove(); }
  const badge = feed.querySelector('.count-badge');
  if (badge) {
    const suffix = (st.filter !== 'all' ? ' · ' + (st.filter === 'bdsm' ? 'BDSM' : 'General') : '') + (st.q ? ` · “${st.q}”` : '');
    badge.textContent = `🗂️ ${visible}${suffix}`;
  }
  setStatus(st.q ? `${cfg.title} — ${visible} match${visible !== 1 ? 'es' : ''} for “${st.q}”` : `${cfg.title} — ${visible}`, false);
  return visible;
}

function bindCatalogControls(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  const bar = results.querySelector('.catalog-chips');
  if (bar) bar.querySelectorAll('[data-cat-group]').forEach(ch => {
    ch.onclick = () => {
      st.filter = ch.getAttribute('data-cat-group') || 'all';
      bar.outerHTML = catalogChipsHtml(kind);
      bindCatalogControls(kind);
      applyCatalogFilter(kind);
    };
  });
  const input = document.getElementById('catalogSearchInput');
  if (!input || input._bound) return;
  input._bound = true;
  input.value = st.q || '';
  const live = () => { st.q = (input.value || '').trim(); if (!st.q) st.searchToken++; applyCatalogFilter(kind); };
  input.addEventListener('input', () => {
    clearTimeout(input._t); clearTimeout(input._deep);
    input._t = setTimeout(live, 120);                                   // instant local filter
    input._deep = setTimeout(() => {                                    // then search every page of every source
      if ((input.value || '').trim().length >= 2) deepCatalogSearch(kind);
    }, 450);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') e.preventDefault();                          // live search only
    if (e.key === 'Escape') { e.preventDefault(); input.value = ''; clearTimeout(input._t); clearTimeout(input._deep); live(); }
  });
}

let catalogObserver = null;
function observeCatalogSentinel(kind) {
  if (!catalogObserver) {
    catalogObserver = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        const k = kindOfCatalogTab(en.target.getAttribute('data-site'));
        if (k && CATALOGS[k].tab === activeTab) loadMoreCatalog(k);
      });
    }, { rootMargin: '250px 0px', threshold: 0 });
  }
  const sent = results.querySelector(`.sentinel[data-site="${CATALOGS[kind].tab}"]`);
  if (sent) { catalogObserver.unobserve(sent); catalogObserver.observe(sent); }   // re-arm after each load
}

async function loadMoreCatalog(kind) {
  const st = catalogState[kind];
  if (!st || st.loading || st.done) return 0;
  const jobs = Object.entries(st.next).filter(([, u]) => u);
  if (!jobs.length) { st.done = true; return 0; }
  st.loading = true;
  let added = 0;
  try {
    const r = await Promise.all(jobs.map(([i, u]) => fetchCatalogPage(kind, Number(i), u)));
    added = r.reduce((a, b) => a + b, 0);
  } finally { st.loading = false; }
  if (!Object.values(st.next).some(Boolean)) st.done = true;
  if (activeTab === CATALOGS[kind].tab) refreshCatalogGrid(kind);
  return added;
}

/** Enter / Search: load every remaining page of every source, filtering as it goes. */
async function deepCatalogSearch(kind) {
  const cfg = CATALOGS[kind], st = catalogState[kind];
  const input = document.getElementById('catalogSearchInput');
  st.q = (input ? input.value : '').trim();
  const token = ++st.searchToken;
  applyCatalogFilter(kind);
  if (!st.q) return;
  while (!st.done && activeTab === cfg.tab && token === st.searchToken) {
    while (st.loading) await new Promise(r => setTimeout(r, 100));
    if (st.done) break;
    const shown = applyCatalogFilter(kind);
    setStatus(`Searching ${cfg.title} for “${st.q}” — ${shown} so far…`, true);
    await loadMoreCatalog(kind);
  }
  if (activeTab === cfg.tab && token === st.searchToken) applyCatalogFilter(kind);
}

async function openCatalog(kind, opts = {}) {
  const cfg = CATALOGS[kind];
  if (!cfg) return;
  const have = catalogState[kind];
  if (!opts.force && have && have.items.length) {
    renderCatalog(kind);
    if (!opts.skipPush) pushNav({ view: cfg.view });
    // Restore scroll position
    const y = have.scrollY || 0;
    const go = () => window.scrollTo({ top: y, left: 0, behavior: 'instant' });
    requestAnimationFrame(go);
    setTimeout(go, 150);
    return;
  }
  if (busy) return;
  busy = true;
  setStatus(`Loading ${cfg.title}…`, true);
  showSectionLoading(cfg.title);
  const st = catalogState[kind] = {
    items: [], seen: new Set(), next: {}, pages: {}, filter: (have && have.filter) || 'all',
    q: '', loading: false, done: false, errors: [], searchToken: 0,
  };
  try {
    await Promise.all(cfg.sources.map((src, i) => fetchCatalogPage(kind, i, src.indexUrl)));
    if (!Object.values(st.next).some(Boolean)) st.done = true;
    if (!st.items.length) throw new Error(st.errors[0] || `No ${cfg.noun}s found.`);
    renderCatalog(kind);
    if (!opts.skipPush) pushNav({ view: cfg.view });
  } catch (err) {
    catalogState[kind] = null;
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus(`${cfg.title} load error`, false);
  } finally {
    busy = false;
  }
}

/* --------------------------------------------------------------
   SEX CAMS: live-stream cards (Chaturbate, Stripchat, Cam4, CamSoda, + Lemoncams when available).
   A card opens in the main player panel (thumbnail + details); the play button opens the live stream
   on its own platform in a new tab.
-------------------------------------------------------------- */
const CAMS_BATCH = 24;                 // cards added to the page per step: only what is shown gets fetched
let liveCamsData = null;               // { items, count, providers, source, fetched_at }
let liveCamsShown = 0;
let camsFilter = { provider: '', q: '' };

/** Turn a scraped cam into a "video item" so the normal player panel (thumbnail + play + details) can show it. */
const CAM_PROXY_FIRST = new Set(['stripchat', 'cam4']);      // their image CDNs block hot-linking from other sites
const camProxied = (u) => `${API_BASE}/api/cam-thumb?u=${encodeURIComponent(u)}`;

/** Thumbnail candidates in the order they are tried: direct and server-proxied versions of every known URL. */
function camThumbCandidates(c) {
  const raw = (c.thumbnails && c.thumbnails.length ? c.thumbnails : [c.thumbnail]).filter(Boolean).slice(0, 4);
  const prox = raw.map(camProxied);
  return (CAM_PROXY_FIRST.has((c.provider || '').toLowerCase()) ? prox.concat(raw) : raw.concat(prox)).slice(0, 8);
}

function camToItem(c) {
  const chips = (arr) => (arr || []).filter(Boolean).map(name => ({ name }));
  const groups = [];
  const add = (kind, arr) => { const items = chips(arr); if (items.length) groups.push({ kind, items }); };
  add('platform', [c.provider_name || c.provider]);
  add('country', c.country ? [`${c.flag_emoji ? c.flag_emoji + ' ' : ''}${c.country}`] : []);
  add('languages', c.languages);
  add('categories', c.categories);
  add('tags', c.tags);
  const bits = [c.gender, c.hd ? 'HD' : '', c.is_new ? 'New' : ''].filter(Boolean).join(' · ');
  return {
    link: c.link, title: c.username + (c.age ? ` · ${c.age}` : ''), thumbnail: c.thumbnail,
    _cam: true, _camProvider: c.provider_name || c.provider || '',
    _thumbs: camThumbCandidates(c),
    _meta: {
      duration: '🔴 LIVE', date: null,
      views: typeof c.viewers === 'number' ? `${c.viewers.toLocaleString()} watching` : null,
      rating: null, age: c.age || null,
      description: [c.room_title, bits].filter(Boolean).join('\n') || null,
      groups,
    },
  };
}

function camCardHtml(c, idx) {
  if (c.link) cardItemByLink.set(c.link, camToItem(c));
  const name = escapeHtml(c.username || 'cam');
  const href = escapeHtml(c.link || '#');
  const thumbs = camThumbCandidates(c);
  const first = idx < 8;                                   // above the fold: fetch right away, at high priority
  const img = thumbs.length
    ? `<img class="cam-img" src="${escapeHtml(thumbs[0])}" data-thumbs="${escapeHtml(JSON.stringify(thumbs))}" data-ti="0" alt="${name}" ${first ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" referrerpolicy="no-referrer">`
    : '';
  const ph = `<span class="cam-ph" aria-hidden="true">${escapeHtml((c.username || '?').replace(/^[^A-Za-z0-9]+/, '').charAt(0) || '?')}</span>`;
  const viewers = typeof c.viewers === 'number' ? `<span class="cam-viewers" title="Viewers">👁 ${c.viewers.toLocaleString()}</span>` : '';
  const provider = c.provider_logo
    ? `<span class="cam-provider" title="${escapeHtml(c.provider_name || c.provider || '')}"><img src="${escapeHtml(c.provider_logo)}" alt="${escapeHtml(c.provider || '')}" loading="lazy" referrerpolicy="no-referrer"></span>`
    : ((c.provider_name || c.provider) ? `<span class="cam-provider">${escapeHtml(c.provider_name || c.provider)}</span>` : '');
  const cats = (c.categories && c.categories.length ? c.categories : c.tags || []).slice(0, 3).join(' · ');
  const sub = c.country
    ? `${c.flag_emoji ? `<span style="flex:0 0 auto">${c.flag_emoji}</span>` : (c.flag ? `<img src="${escapeHtml(c.flag)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '')}<span>${escapeHtml(c.country)}</span>`
    : (c.room_title ? `<span>${escapeHtml(c.room_title)}</span>` : '');
  const tagline = cats ? `<div class="cam-tagline">${escapeHtml(cats)}</div>` : '';
  return `<a class="cam-card" href="${href}" data-cam-link="${href}" data-title="${name}" title="${escapeHtml(c.room_title || c.username || '')}">
    <div class="cam-thumb${thumbs.length ? ' loading' : ' no-img'}">${ph}${img}<span class="cam-live">LIVE</span>${provider}${viewers}</div>
    <div class="cam-info"><div class="cam-name">${name}${c.age ? `<small>${c.age}</small>` : ''}</div>${sub ? `<div class="cam-sub">${sub}</div>` : ''}${tagline}</div>
  </a>`;
}

function visibleCams() {
  const words = queryWords(camsFilter.q);
  return liveCamsData.items.filter(c => {
    if (camsFilter.provider && (c.provider_name || c.provider) !== camsFilter.provider) return false;
    if (!words.length) return true;
    const hay = [c.username, c.provider_name, c.provider, c.country, c.gender, c.room_title,
                 ...(c.categories || []), ...(c.tags || []), ...(c.languages || [])].join(' ');
    return searchWordsMatch(hay, words);
  });
}

/* ---- thumbnails: fallback chain, fade-in, live refresh of what is on screen ---- */
const CAM_REFRESH_MS = 45000;
const camVisibleImgs = new Set();
let camImgObserver = null, camRefreshTimer = null;

function camThumbList(img) { try { return JSON.parse(img.dataset.thumbs || '[]'); } catch { return []; } }
const camCleanSrc = (u) => String(u || '').replace(/[?&]_t=\d+/, '');

function camThumbFail(img) {
  const list = camThumbList(img);
  const i = (+img.dataset.ti || 0) + 1;
  if (i < list.length) { img.dataset.ti = i; img.src = list[i]; return; }       // next candidate
  const box = img.closest('.cam-thumb');
  if (box) { box.classList.remove('loading'); box.classList.add('no-img'); }
  img.classList.remove('ready');
  img.style.display = 'none';
}

function camThumbOk(img) {
  if (img.naturalWidth < 24 || img.naturalHeight < 24) return camThumbFail(img);   // 1x1 / "no preview" stubs
  const box = img.closest('.cam-thumb');
  if (box) box.classList.remove('loading', 'no-img');
  img.classList.add('ready');
  const card = img.closest('a.cam-card');
  const it = card && cardItemByLink.get(card.getAttribute('data-cam-link'));
  if (it) it.thumbnail = camCleanSrc(img.currentSrc || img.src);                   // the player reuses the one that worked
}

/** Swap in a fresh snapshot only once it has fully loaded: no flicker, no broken image. */
function refreshCamThumb(img) {
  if (!img.isConnected || !img.classList.contains('ready')) return;
  const base = camCleanSrc(img.currentSrc || img.src);
  const pre = new Image();
  pre.referrerPolicy = 'no-referrer';
  pre.onload = () => { if (pre.naturalWidth >= 24 && img.isConnected) img.src = pre.src; };
  pre.src = base + (base.includes('?') ? '&' : '?') + '_t=' + Date.now();
}

function camThumbsInit(grid) {
  if (grid._camThumbs) return;
  grid._camThumbs = true;
  grid.addEventListener('error', (e) => { if (e.target.matches && e.target.matches('img.cam-img')) camThumbFail(e.target); }, true);
  grid.addEventListener('load', (e) => { if (e.target.matches && e.target.matches('img.cam-img')) camThumbOk(e.target); }, true);
  camVisibleImgs.clear();
  if (camImgObserver) camImgObserver.disconnect();
  camImgObserver = new IntersectionObserver((entries) => entries.forEach(en =>
    en.isIntersecting ? camVisibleImgs.add(en.target) : camVisibleImgs.delete(en.target)), { rootMargin: '100px 0px' });
  clearInterval(camRefreshTimer);
  camRefreshTimer = setInterval(() => {
    if (document.hidden || activeTab !== LIVECAMS_TAB) return;
    camVisibleImgs.forEach(refreshCamThumb);
  }, CAM_REFRESH_MS);
}

function camWatchImages(grid, from) {
  [...grid.querySelectorAll('img.cam-img')].slice(from).forEach(img => {
    if (camImgObserver) camImgObserver.observe(img);
    if (img.complete && img.naturalWidth) camThumbOk(img);                        // already cached
    else if (img.complete && img.getAttribute('src')) camThumbFail(img);
  });
}

/** Warm the cache with the first thumbnails of the NEXT batch while the user is still looking at this one. */
function camPrefetchNext(items) {
  const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 200));
  idle(() => items.slice(liveCamsShown, liveCamsShown + 12).forEach(c => {
    const u = camThumbCandidates(c)[0];
    if (u) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = u; }
  }));
}

/* ---- infinite scroll: a sentinel under the grid loads the next batch before the user reaches the end ---- */
let camsScrollObs = null;

function camsObserveSentinel(feed) {
  const sentinel = feed.querySelector('.cams-sentinel');
  if (!sentinel) { if (camsScrollObs) camsScrollObs.disconnect(); return; }
  if (!('IntersectionObserver' in window)) {
    sentinel.outerHTML = '<button type="button" class="action" id="camsMoreBtn">Show more</button>';
    const b = feed.querySelector('#camsMoreBtn');
    if (b) b.addEventListener('click', () => renderCamBatch(feed));
    return;
  }
  if (!camsScrollObs) {
    camsScrollObs = new IntersectionObserver((entries) => {
      if (!entries.some(e => e.isIntersecting) || activeTab !== LIVECAMS_TAB) return;
      const f = results.querySelector('.feed[data-site="' + LIVECAMS_TAB + '"]');
      if (f) renderCamBatch(f);
    }, { rootMargin: '1000px 0px', threshold: 0 });
  }
  camsScrollObs.disconnect();
  camsScrollObs.observe(sentinel);        // observing again re-reports: keeps loading while the sentinel is still near
}

function renderCamBatch(feed) {
  const items = visibleCams();
  const grid = feed.querySelector('.cams-grid');
  camThumbsInit(grid);
  const before = grid.querySelectorAll('img.cam-img').length;
  const end = Math.min(items.length, liveCamsShown + CAMS_BATCH);
  grid.insertAdjacentHTML('beforeend', items.slice(liveCamsShown, end).map(camCardHtml).join(''));
  liveCamsShown = end;
  camWatchImages(grid, before);
  const more = feed.querySelector('.cams-more');
  const left = items.length - liveCamsShown;
  if (left > 0) {
    more.innerHTML = `<div class="cams-loading"><div class="spinner"></div><span>${liveCamsShown} of ${items.length} · loading more as you scroll</span></div><div class="cams-sentinel"></div>`;
    camsObserveSentinel(feed);
    camPrefetchNext(items);
  } else {
    if (camsScrollObs) camsScrollObs.disconnect();
    more.innerHTML = items.length ? `<div>${items.length} live cams · that's all for now</div>` : '';
  }
}

/** Re-draw the grid from the first card (after a platform chip or the search box changed). */
function refreshCamGrid() {
  const feed = results.querySelector('.feed[data-site="' + LIVECAMS_TAB + '"]');
  if (!feed || !liveCamsData) return;
  const grid = feed.querySelector('.cams-grid');
  grid.innerHTML = '';
  liveCamsShown = 0;

  feed.querySelectorAll('.cam-chip').forEach(ch => ch.classList.toggle('active', (ch.getAttribute('data-prov') || '') === camsFilter.provider));
}

function applyCamFilter() {
  camsFilter.q = (searchInput.value || '').trim();
  refreshCamGrid();
}

function renderLiveCams() {

/* --------------------------------------------------------------
   LIVE CHANNELS: TV channel cards from xlivetv.com (thumbnail, description, categories).
   Pages are fetched one by one as the user scrolls (the next page is prefetched); a card opens in the
   player panel and the play button opens the channel on XLiveTV.
-------------------------------------------------------------- */
let chanState = null;      // { items, seen, nextPage, done, loading, category, categories, q, pending, error, force }

function chanNewState(category = '', force = false) {
  return { items: [], seen: new Set(), nextPage: 1, done: false, loading: false, category,
           categories: chanState ? chanState.categories : [], q: '', pending: {}, error: null, force };
}

function chanThumbCandidates(it) {
  const raw = (it.thumbnails && it.thumbnails.length ? it.thumbnails : [it.thumbnail]).filter(Boolean).slice(0, 4);
  return raw.concat(raw.map(camProxied)).slice(0, 8);
}

function chanToItem(it) {
  const groups = [{ kind: 'platform', items: [{ name: 'XLiveTV' }] }];
  if ((it.categories || []).length)
    groups.push({ kind: 'categories', items: it.categories.map(c => ({ name: c.name, link: 'chan-cat:' + c.slug })) });
  return {
    link: it.link, title: it.title, thumbnail: (it.thumbnails || [it.thumbnail])[0] || null,
    _chan: true, _camProvider: 'XLiveTV', _thumbs: chanThumbCandidates(it),
    _meta: { duration: '📺 LIVE TV', date: null, views: null, rating: null,
             description: it.description || null, groups },
  };
}

function chanCardHtml(it, idx) {
  cardItemByLink.set(it.link, chanToItem(it));
  const title = escapeHtml(it.title || 'Channel');
  const href = escapeHtml(it.link);
  const thumbs = chanThumbCandidates(it);
  const img = thumbs.length
    ? `<img class="cam-img" src="${escapeHtml(thumbs[0])}" data-thumbs="${escapeHtml(JSON.stringify(thumbs))}" data-ti="0" alt="${title}" ${idx < 8 ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" referrerpolicy="no-referrer">`
    : '';
  const ph = `<span class="cam-ph" aria-hidden="true">${escapeHtml((it.title || '?').charAt(0))}</span>`;
  const cats = (it.categories || []).slice(0, 3).map(c => c.name).join(' · ');
  const desc = it.description ? `<div class="cam-tagline">${escapeHtml(it.description)}</div>` : '';
  return `<a class="cam-card chan-card" href="${href}" data-cam-link="${href}" data-title="${title}" title="${title}">
    <div class="cam-thumb chan-thumb${thumbs.length ? ' loading' : ' no-img'}">${ph}${img}<span class="cam-live">LIVE TV</span></div>
    <div class="cam-info"><div class="cam-name">${title}</div>${cats ? `<div class="cam-sub"><span>${escapeHtml(cats)}</span></div>` : ''}${desc}</div>

function chanVisible() {
  const words = queryWords(chanState.q);
  if (!words.length) return chanState.items;
  return chanState.items.filter(it => {
    const hay = [it.title, it.description, ...(it.categories || []).map(c => c.name)].join(' ');
    return searchWordsMatch(hay, words);

function chanFetchPage(page, category) {
  const st = chanState, key = page + '|' + category;

  const force = !!(st.force && page === 1);
  if (force) st.force = false;

    body: JSON.stringify({ page, category: category || null, force }),
  }).then(async (res) => {
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.error) {
      const e = new Error(j.error || j.detail || `HTTP ${res.status}`);
      e.diagnostics = j.diagnostics;
      throw e;

    return j;

  st.pending[key] = p;
  p.catch(() => { delete st.pending[key]; });

}

function chanObserveSentinel(feed) {

    if (b) b.addEventListener('click', () => chanLoadMore());

  if (!chansScrollObs) {
    chansScrollObs = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting) && activeTab === LIVECHANNELS_TAB) chanLoadMore();
    }, { rootMargin: '900px 0px', threshold: 0 });

  chansScrollObs.disconnect();
  chansScrollObs.observe(sentinel);      // re-observing re-reports: keeps loading while the sentinel is still near

async function chanLoadMore() {
  const st = chanState;
  if (!st || st.loading || st.done || !chanFeed()) return;
  st.loading = true;
  try {
    const j = await chanFetchPage(st.nextPage, st.category);
    if (chanState !== st) return;                                   // category changed while loading
    if (j.categories && j.categories.length) { st.categories = j.categories; chanRenderChips(); }
    const fresh = (j.items || []).filter(it => it.link && !st.seen.has(it.link));
    fresh.forEach(it => st.seen.add(it.link));
    st.items.push(...fresh);
    st.nextPage = j.next_page || null;
    st.done = !j.next_page || !fresh.length;
    st.error = null;
    chanAppend(fresh);
    if (st.nextPage) chanFetchPage(st.nextPage, st.category).catch(() => {});   // prefetch one page ahead
  } catch (err) {
    if (chanState !== st) return;
    st.error = err;
    if (!st.items.length) showChannelsError(err);
  } finally {
    st.loading = false;
  }
  if (chanState === st) chanFooter();
}

  bar.querySelectorAll('.cam-chip').forEach(ch => ch.addEventListener('click', () => {

function preserveSectionScrollRange(y) {

/** Sections never come back "as they were": the page is cleared and the next section is built fresh, at the top. */
function discardCurrentSection() {
  if (!results.childNodes.length) return;
  rescueSearchBar();
  results.replaceChildren();
}

/** True while the section's own main page (not a nested page of it) is on screen. */
function onSectionRoot(section) {
  const tab = activeTab || '';
  switch (section) {
    case 'home': return tab.startsWith(MIX_PREFIX) || SOURCES.some(s => s.url === tab);
    case 'categories': return tab === CATEGORIES_TAB;
    case 'pornsites': return tab === PORN_SITES_TAB;
    case 'porntags': return tab === PORN_TAGS_TAB;
    case 'networks': return tab === NETWORKS_TAB;
    case 'pornstars': return tab === PORNSTARS_TAB;
    case 'livecams': return tab === LIVECAMS_TAB;
    case 'livechannels': return tab === LIVECHANNELS_TAB;

  return true;
}

function enterNavSection(section, action, force = false, pressedButton = null) {
  if (busy) return;
  const previousSection = navSection;
  const currentScrollY = window.scrollY;
  if (activeTab === CATEGORIES_TAB && categoriesState.categories.length) {
    categoriesState.scrollY = currentScrollY;
    saveCategoryCache(COMBINED_CAT_CACHE_KEY);
  }
  if ((activeTab === NETWORKS_TAB || activeTab === PORN_SITES_TAB) && studioState.rendered) {
    studioState.scrollY = currentScrollY;
  }
  saveCatalogScroll(currentScrollY);

  // Top-level sections share ONE history slot. The first section opened from Home gets a history entry; switching between
  // sections replaces that entry. Sections are never restored "as they were": each one is built fresh, at the top.
  // Back on a section's main page opens the "Where to?" sheet (popstate handler); nested pages inside a section
  // (a network's videos, search results...) use pushState and keep their normal Back steps.
  const sectionMenuNavigation = section !== previousSection;
  const collapseSectionHistory = sectionMenuNavigation && previousSection !== 'home';
  const firstSectionFromHome = sectionMenuNavigation && previousSection === 'home' && section !== 'home';

  if (section === previousSection && !force && onSectionRoot(section)) {   // its own main page is open: the button scrolls to the top
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    updateNetworkBarActive();
    return;
  }
  // (inside a nested page of this section - a network's videos, search results... - the button opens the section's main page)
  const targetScrollY = 0;
  discardCurrentSection();
  studioState.scrollY = 0;
  categoriesState.scrollY = 0;
  Object.values(catalogState).forEach(c => { if (c) c.scrollY = 0; });
  results.style.minHeight = '';
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
  navSection = section;
  updateNetworkBarActive();                              // the pressed section is highlighted at once
  feedSearchEntryActive = false;
  clearTimeout(liveTimer);

  const restoreScroll = () => {
    const restore = () => {
      window.scrollTo({ top: targetScrollY, left: 0, behavior: 'instant' });
      updateNetworkBarActive();
    };
    requestAnimationFrame(restore);
    setTimeout(restore, 120);
  };

  // When moving between top-level sections, suppress the action's pushState so
  // it cannot create another section-history entry. We then either push the first
  // section (Home -> Section) or replace the existing section slot.
  const suppressSectionPush = sectionMenuNavigation && !force;
  const oldNavSilent = navSilent;
  if (suppressSectionPush) navSilent = true;
  let result;
  try {
    result = action();
  } finally {
    if (suppressSectionPush) navSilent = oldNavSilent;
  }

  const finish = () => {
    if (suppressSectionPush) {
      if (collapseSectionHistory) replaceNav(currentNavState());
      else if (firstSectionFromHome) pushNav(currentNavState());
    }
    restoreScroll();
  };
  if (result && typeof result.then === 'function') result.then(finish, finish);
  else finish();
  return result;
}
