<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎬 Video Preview Scraper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0c10;
         color: #e2e8f0; padding: 1.5rem; min-height: 100vh; }
  .app { max-width: 1600px; margin: 0 auto; }

  header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
  .top-row { display: flex; justify-content: space-between; align-items: center;
             flex-wrap: wrap; gap: 1rem; }
  h1 { font-size: 1.7rem; background: linear-gradient(135deg, #c4b5fd, #7aa9ff);
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .feed > .search-bar {
    display: flex !important; gap: .5rem; align-items: center;
    padding: .75rem 1.4rem; border-bottom: 1px solid #252e3f; background: #0d121c;
  }
  .feed > .search-bar input { flex: 1; min-width: 180px; }
  .status { display: flex; align-items: center; gap: .5rem; background: #1a1f2b;
            padding: .4rem 1rem; border-radius: 30px; border: 1px solid #2b3344;
            font-size: .8rem; color: #b0c0dd; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  .dot.loading { background: #facc15; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .search-bar { display: flex; gap: .5rem; align-items: center; }
  .search-bar input {
    flex: 1; min-width: 240px;
    background: #0c0f15; border: 1px solid #232b3b; color: #e2e8f0;
    padding: .6rem 1rem; border-radius: 30px; font-size: .85rem;
    font-family: inherit; outline: none; transition: .15s;
  }
  .search-bar input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px #4f46e533; }
  .search-bar input::placeholder { color: #5b6a84; }
  .search-bar button { white-space: nowrap; }

  .tabs { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
          padding: .5rem; background: #0c0f15; border: 1px solid #212836;
          border-radius: 1.2rem; }
  .tab { display: inline-flex; align-items: center; gap: .5rem;
         background: #131822; border: 1px solid #232b3b; color: #a9b9d6;
         padding: .55rem 1.1rem; border-radius: 30px; font-size: .8rem;
         cursor: pointer; font-family: inherit; transition: .15s;
         white-space: nowrap; max-width: 300px; }
  .tab:hover { background: #1c2330; border-color: #3a465e; color: #d5e0f5; }
  .tab.active { background: linear-gradient(145deg, #4f46e5, #6366f1);
                border-color: #7c8af8; color: #fff;
                box-shadow: 0 4px 14px -4px #4f46e5aa; }
  .tab.search-tab.active { background: linear-gradient(145deg, #0ea5e9, #22d3ee);
                           border-color: #67e8f9; color: #04141b;
                           box-shadow: 0 4px 14px -4px #0ea5e9aa; }
  .tab .tab-dot { width: 6px; height: 6px; border-radius: 50%;
                  background: #4ade80; flex: 0 0 auto; }
  .tab.error .tab-dot { background: #f87171; }
  .tab.loading .tab-dot { background: #facc15; animation: pulse 1s infinite; }
  .tab .tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .tab-count { font-size: .65rem; opacity: .7;
                    font-family: ui-monospace, monospace; }

  .controls { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  button.action { background: #1e2432; border: 1px solid #2e3749; color: #d0daea;
           padding: .55rem 1.2rem; border-radius: 30px; font-size: .8rem;
           cursor: pointer; font-family: inherit; transition: .15s; }
  button.action:hover { background: #29303f; border-color: #46526b; }
  button.action.primary { background: linear-gradient(145deg, #4f46e5, #6366f1);
                   border-color: #7c8af8; color: #fff; }
  button.action:disabled { opacity: .5; cursor: not-allowed; }

  .feed { background: #131822; border: 1px solid #232b3b; border-radius: 1.4rem;
          overflow: hidden; }
  .feed-header { display: flex; justify-content: space-between; align-items: center;
                 gap: 1rem; padding: 1rem 1.4rem; background: #181e2a;
                 border-bottom: 1px solid #252e3f; flex-wrap: wrap; }
  .feed-name { font-weight: 600; font-size: 1rem; color: #e7eefb;
               display: flex; align-items: center; gap: .5rem; }
  .feed-url { font-size: .7rem; color: #7f91b2; font-family: ui-monospace, monospace;
              text-decoration: none; }
  .feed-url:hover { color: #a5b8dd; text-decoration: underline; }
  .badges { display: flex; gap: .5rem; flex-wrap: wrap; font-size: .7rem;
            align-items: center; }
  .badges span { background: #1c2330; padding: .25rem .7rem; border-radius: 20px;
                 border: 1px solid #2c3548; color: #92a6c9; }
  .badges span.source { background: #102e3a; border-color: #1f5a72; color: #7dd3fc; }
  .badges span.source.warn { background: #3a2710; border-color: #72551f; color: #fcd77d; }

  .videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem; padding: 1.2rem 1.4rem; }
  .card { background: #171d28; border: 1px solid #232b3b; border-radius: 1rem;
          overflow: hidden; transition: .15s; display: block; cursor: pointer;
          text-decoration: none; color: inherit; }
  .card:hover { transform: translateY(-3px); border-color: #4a5b7d;
                box-shadow: 0 12px 24px -10px #000000aa; }

  .card .thumb { aspect-ratio: 16/9; background: #0b0e14; overflow: hidden;
                 position: relative; }
  .card .thumb img,
  .card .thumb video { position: absolute; inset: 0; width: 100%; height: 100%;
                       object-fit: cover; display: block; background: #000; }
  .card .thumb img  { z-index: 1; }
  .card .thumb video { z-index: 2; opacity: 0; transition: opacity .18s ease;
                       pointer-events: none; }
  .card .thumb.video-ready:hover video { opacity: 1; }
  .card .thumb .play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #00000000; transition: .15s;
    font-size: 2.6rem; color: #ffffffdd; opacity: 0; pointer-events: none;
    z-index: 3; }
  .card:hover .thumb .play-overlay { opacity: 1; background: #00000055; }
  .card .thumb.video-ready:hover .play-overlay { opacity: 0; }

  .info { padding: .75rem .85rem .9rem; }
  .title { font-size: .85rem; font-weight: 600; line-height: 1.35; margin-bottom: .4rem;
           color: #e2eafc; display: -webkit-box; -webkit-line-clamp: 2;
           -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: .35rem .7rem; font-size: .65rem;
          color: #8a9cc0; align-items: center; }

  .empty { text-align: center; padding: 4rem 2rem; color: #7a8aaa;
           background: #131822; border-radius: 1.4rem; border: 1px dashed #283242; }
  .loading-screen { display: flex; flex-direction: column; align-items: center;
                    padding: 4rem 2rem; gap: 1rem; color: #899bb9; }
  .spinner { width: 44px; height: 44px; border: 4px solid #222b3c;
             border-top-color: #7c8af8; border-radius: 50%;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .sentinel { height: 1px; width: 100%; }
  .loading-row { grid-column: 1 / -1; display: flex; align-items: center;
                 justify-content: center; gap: .8rem; padding: 1.5rem;
                 color: #899bb9; font-size: .8rem; }
  .mini-spinner { width: 20px; height: 20px; border: 3px solid #222b3c;
                  border-top-color: #7c8af8; border-radius: 50%;
                  animation: spin .8s linear infinite; }

  /* ---- unified search feed: per-video site label ---- */
  .site-label { position: absolute; top: .5rem; left: .5rem; z-index: 5;
                padding: .2rem .6rem; border-radius: 20px; font-size: .65rem;
                font-weight: 700; letter-spacing: .02em; color: #fff;
                background: #4f46e5; box-shadow: 0 2px 8px #000000aa;
                pointer-events: none; backdrop-filter: blur(4px); }
  .site-label.s-general { background: #e11d48; }
  .site-label.s-bdsm    { background: #7c3aed; }
  .badges span.chip-general { border-color: #e11d48; color: #fda4af; }
  .badges span.chip-bdsm    { border-color: #7c3aed; color: #c4b5fd; }
  .badges span.chip-err { border-color: #72551f; color: #fcd77d; }

  .badges span.chip-btn { cursor: pointer; user-select: none; transition: .12s; }
  .badges span.chip-btn:hover { filter: brightness(1.25); }
  .badges span.chip-btn.active { background: #2b3556; color: #fff; border-color: #7c8af8;
                                 box-shadow: 0 0 0 2px #7c8af844; }
  .badges span.chip-btn.dim { opacity: .5; }
  .card.filtered-out { display: none; }
  .card.live-hidden { display: none; }

  /* Porn Sites: every card is the same size, and the cards of a row stretch (a little bigger than
     the minimum) so the row is filled edge to edge. --n = how many fit; set by fitStudioRows(). */
  .studio-row { --n: 4; --gap: .75rem;
                display: grid; grid-auto-flow: column; gap: var(--gap);
                grid-auto-columns: calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
                overflow-x: auto; align-items: stretch; scroll-snap-type: x proximity; }
  .studio-row .card { width: auto; min-width: 0; max-width: none;
                      display: flex; flex-direction: column; scroll-snap-align: start; }
  .studio-row .card .thumb { width: 100%; aspect-ratio: 16/9; flex: 0 0 auto; }
  .studio-row .card .info { flex: 1 1 auto; display: flex; flex-direction: column; }
  .studio-row .card .title { min-height: 2.7em; }          /* 1-line and 2-line titles take the same height */
  .studio-row .card .meta { margin-top: auto; }
  #homeBtn.active { background:#4f46e5; border-color:#7c8af8; color:#fff; }

  .search-group { margin-bottom: 1.5rem; }
  .search-group-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding: .9rem 1.4rem; background: #181e2a;
    border-bottom: 1px solid #252e3f; border-top: 1px solid #232b3b;
    flex-wrap: wrap; }
  .search-group-name { font-weight: 600; font-size: .95rem; color: #e7eefb; }
  .search-group-url { font-size: .7rem; color: #7f91b2;
                      font-family: ui-monospace, monospace; }
  .search-group:first-child .search-group-header { border-top: none; }
  .search-group .videos { padding: 1rem 1.4rem; }

  .footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #1e2532;
            text-align: center; font-size: .7rem; color: #5b6a84; }

  .main-player { background:#0c1017; border:1px solid #232b3b; border-radius:1.4rem; margin-bottom:1.5rem; overflow:hidden; display:none; }
  .main-player.active { display:block; }
  .main-player-head { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.9rem 1.2rem; background:#181e2a; border-bottom:1px solid #252e3f; }
  .main-player-title { font-weight:600; color:#e7eefb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .main-player-actions { display:flex; align-items:center; gap:.5rem; flex-shrink:0; }
  .main-player-close, .main-player-dl {
    border:1px solid #2e3749; background:#1e2432; color:#cbd5e1;
    border-radius:20px; padding:.35rem .8rem; cursor:pointer;
    font-family:inherit; font-size:.8rem; white-space:nowrap;
  }
  .main-player-dl:hover, .main-player-close:hover { background:#29303f; border-color:#46526b; }
  .main-player-dl:disabled { opacity:.45; cursor:not-allowed; }
  .main-player-dl.ready { border-color:#3d6b4f; color:#86efac; background:#14261c; }
  .main-player-body { aspect-ratio:16/9; background:#000; position:relative; }
  .main-player-body video { width:100%; height:100%; display:block; background:#000; }
  .main-player-status {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1rem;
    color:#9aa9c1; background:#000; z-index:4;
  }
  .main-player-status.hidden { display:none; }
  .main-player-status .player-spinner {
    width:48px; height:48px; border-radius:50%;
    border:3px solid #2a3344; border-top-color:#7c8af8;
    animation: spin .7s linear infinite;
  }
  .main-player-status .player-status-text {
    display:none; font-size:.85rem; color:#9aa9c1; text-align:center;
    max-width:80%; line-height:1.4;
  }
  .main-player-status.is-error .player-spinner { display:none; }
  .main-player-status.is-error .player-status-text {
    display:block; color:#f87171;
  }

  .card .thumb.loading-media .play-overlay {
    opacity: 1 !important; background: #00000066;
  }
  .card .thumb .play-overlay .hover-spinner {
    display:none; width:28px; height:28px; border-radius:50%;
    border:3px solid #ffffff55; border-top-color:#fff;
    animation: spin .7s linear infinite;
  }
  .card .thumb.loading-media .play-overlay .hover-spinner { display:block; }
  .card .thumb.loading-media .play-overlay .play-icon { display:none; }

  .cat-source-badge {
    position:absolute; top:8px; left:8px; z-index:2;
    background:#4f46e5cc; color:#fff; font-size:.65rem; font-weight:600;
    padding:.2rem .45rem; border-radius:6px; pointer-events:none;
  }
  .category-card .thumb { position:relative; }

  .cat-search-bar {
    display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
    padding:.75rem 1.4rem; border-bottom:1px solid #1e2738; background:#0d121c;
  }
  .cat-search-bar input {
    flex:1; min-width:180px; background:#121826; border:1px solid #2a3344;
    color:#e7eefb; border-radius:8px; padding:.55rem .85rem; font-size:.9rem;
  }
  .cat-search-bar input:focus { outline:none; border-color:#4f46e5; box-shadow:0 0 0 3px #4f46e533; }

  .cat-filter-bar {
    display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
    padding:.65rem 1.4rem; border-bottom:1px solid #1e2738; background:#0b1018;
  }
  .cat-filter-bar .cat-filter-label {
    font-size:.75rem; color:#7a8aaa; margin-right:.25rem;
  }
  .cat-filter-btn {
    background:#121826; border:1px solid #2a3344; color:#c5d0e6;
    border-radius:999px; padding:.4rem .9rem; font-size:.8rem; font-weight:600;
    cursor:pointer; transition: background .15s, border-color .15s, color .15s;
  }
  .cat-filter-btn:hover { border-color:#4f46e5; color:#e7eefb; }
  .cat-filter-btn.active {
    background:linear-gradient(145deg, #4f46e5, #7c3aed);
    border-color:transparent; color:#fff;
  }

  .search-mode-panel {
    max-width:560px; margin:3rem auto; padding:1.5rem;
    background:#121826; border:1px solid #1e2738; border-radius:16px;
    text-align:center;
  }
  .search-mode-panel h2 {
    margin:0 0 .35rem; font-size:1.15rem; color:#e7eefb; font-weight:600;
  }
  .search-mode-panel .search-mode-q {
    color:#7c8af8; font-weight:600; word-break:break-word;
  }
  .search-mode-panel p {
    margin:0 0 1.25rem; color:#7a8aaa; font-size:.85rem;
  }
  .search-mode-options {
    display:grid; gap:.75rem;
  }
  .search-mode-btn {
    display:flex; flex-direction:column; align-items:flex-start; gap:.25rem;
    width:100%; text-align:left; padding:1rem 1.15rem;
    background:#0d121c; border:1px solid #2a3344; border-radius:12px;
    color:#e7eefb; cursor:pointer; transition: border-color .15s, background .15s;
  }
  .search-mode-btn:hover {
    border-color:#4f46e5; background:#161d2c;
  }
  .search-mode-btn .mode-title {
    font-weight:600; font-size:.95rem;
  }
  .search-mode-btn .mode-desc {
    font-size:.78rem; color:#7a8aaa; line-height:1.35;
  }

  .card .meta .dl-btn {
    border:1px solid #2e3749; background:#1a2230; color:#9fb4d4;
    border-radius:14px; padding:.2rem .55rem; font-size:.65rem;
    cursor:pointer; font-family:inherit; line-height:1.2;
  }
  .card .meta .dl-btn:hover { background:#243044; border-color:#46526b; color:#e2eafc; }
  .card .meta .dl-btn.busy { opacity:.6; pointer-events:none; }

  .category-card .thumb { aspect-ratio: 4/3; }
  .category-card .info { text-align: center; }
  .category-card .title { -webkit-line-clamp: 1; margin-bottom: 0; }
  .back-btn { border:1px solid #2e3749; background:#1e2432; color:#cbd5e1;
              border-radius:20px; padding:.35rem .9rem; cursor:pointer;
              font-family:inherit; font-size:.75rem; white-space:nowrap; }
  .back-btn:hover { background:#29303f; border-color:#46526b; }

  .site-bar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .site-tab {
    display:inline-flex; align-items:center; gap:.45rem;
    background:#131822; border:1px solid #232b3b; color:#a9b9d6;
    padding:.55rem 1.15rem; border-radius:30px; font-size:.85rem;
    cursor:pointer; font-family:inherit; transition:.15s; white-space:nowrap;
  }
  .site-tab:hover { background:#1c2330; border-color:#3a465e; color:#d5e0f5; }
  .site-tab.active {
    background: linear-gradient(145deg, #4f46e5, #6366f1);
    border-color:#7c8af8; color:#fff;
    box-shadow: 0 4px 14px -4px #4f46e5aa;
  }
  .site-tab .site-dot {
    width:7px; height:7px; border-radius:50%; background:#4ade80; flex:0 0 auto;
  }
  .site-tab:not(.active) .site-dot { background:#5b6a84; }
  .site-actions { display:flex; gap:.5rem; align-items:center; }

  /* Network quick buttons (under the search bar) */
  .network-bar { display:flex; flex-direction:column; gap:.55rem; margin-top:.85rem; align-items:stretch; }
  .network-bar .net-title {
    text-align:center; font-size:1rem; font-weight:700; color:#e7eefb;
    letter-spacing:.04em; margin-bottom:.15rem;
  }
  /* One horizontal row per network group (label + buttons); scroll sideways if needed */
  .network-bar .net-group {
    display:flex; flex-wrap:nowrap; gap:.5rem; align-items:center;
    overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; padding-bottom:.15rem;
  }
  .network-bar .net-group::-webkit-scrollbar { height:4px; }
  .network-bar .net-group::-webkit-scrollbar-thumb { background:#2a3350; border-radius:4px; }
  .network-bar .net-label {
    font-size:.8rem; color:#7a8aaa; margin-right:.2rem; font-weight:600;
    min-width:7.5rem; flex:0 0 auto; white-space:nowrap;
  }
  .network-bar .net-label.net-label-bdsm { color:#c4b5fd; }
  .network-btn {
    padding:.4rem .85rem; font-size:.85rem; font-weight:600; color:#c9d2ee; background:#1b2136;
    border:1px solid #2a3350; border-radius:999px; cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
    flex:0 0 auto; white-space:nowrap;
  }
  .network-btn:hover { background:#252c47; border-color:#4f46e5; }
  .network-btn.active { background:#4f46e5; border-color:#4f46e5; color:#fff; }
  .network-btn.bdsm-net:hover { border-color:#7c3aed; }
  .network-btn.bdsm-net.active { background:linear-gradient(145deg,#7c3aed,#6366f1); border-color:#a78bfa; }
  .network-btn:disabled { opacity:.6; cursor:wait; }

  /* Porn Tags: text pills grouped by letter */
  .tag-cloud { display:flex; flex-direction:column; gap:1rem; padding:.5rem 0 2rem; }
  .tag-row { display:flex; gap:.9rem; align-items:flex-start; }
  .tag-letter { flex:0 0 46px; height:46px; display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; font-weight:700; color:#e5e9f5; background:#0f1424; border:1px solid #2a3350; border-radius:6px; }
  .tag-list { display:flex; flex-wrap:wrap; gap:.5rem; flex:1; min-width:0; }
  .tag-pill { display:inline-block; padding:.45rem .8rem; font-size:.9rem; font-weight:600; color:#c9d2ee;
    background:#1b2136; border-radius:6px; text-decoration:none; transition:background .15s, color .15s; }
  .tag-pill:hover { background:#4f46e5; color:#fff; }
  @media (max-width:600px) { .tag-letter { flex-basis:36px; height:36px; font-size:1.05rem; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top-row">
      <div class="site-bar" id="siteBar">
        <!-- filled by JS: Superporn / BDSMHole tabs -->
        <div class="site-actions">
          <button class="action" id="homeBtn" type="button" title="Back to the mixed home feed">🏠 Home</button>
          <button class="action" id="categoriesBtn" type="button">📁 Categories</button>
          <button class="action" id="pornTagsBtn" type="button">🏷️ Porn Tags</button>
          <button class="action" id="pornSitesBtn" type="button">🏢 Porn Sites</button>
        </div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Ready</span></div>
    </div>

    <div class="network-bar" id="networkBar" aria-label="Networks"></div>
  </header>

  <!-- Search lives with the video cards (moved into .feed by JS) -->
  <div class="search-bar" id="searchBarHost" style="display:none">
    <input id="searchInput" type="text" placeholder="Search videos…"
           autocomplete="off" spellcheck="false" />
    <button class="action primary" id="searchBtn">🔍 Search</button>
  </div>

  <section class="main-player" id="mainPlayer">
    <div class="main-player-head">
      <div class="main-player-title" id="mainPlayerTitle">Select a video</div>
      <div class="main-player-actions">
        <button class="main-player-dl" id="mainPlayerDownload" type="button" disabled title="Download video file">⬇ Download</button>
        <button class="main-player-close" id="mainPlayerClose" type="button">Close</button>
      </div>

/**

 * 1) Probe a few bytes to ensure the proxy returns real video (not JSON error).
 * 2) Hand off to the browser via <a download> so large MP4s stream to disk.
 */
async function triggerDownload(url, filename) {
  // Probe only the first bytes — avoids "Failed to fetch" on 500MB+ files
  let probe;
  try {
    probe = await fetch(url, {
      method: 'GET',
      headers: { Range: 'bytes=0-255' },
      cache: 'no-store',
    });
  } catch (err) {
    throw new Error(
      `Could not reach download proxy (${err?.message || 'network error'}). `
      + 'Is the Flask server running?'
    );
  }

  const ct = (probe.headers.get('content-type') || '').toLowerCase();
  const okStatus = probe.ok || probe.status === 206;

  if (!okStatus || ct.includes('application/json') || ct.includes('text/html')) {
    let msg = `Download failed (HTTP ${probe.status})`;
    try {
      const j = await probe.json();
      if (j.error) msg = j.error + (j.detail ? `: ${j.detail}` : '');
    } catch {
      try { msg = (await probe.text()).slice(0, 160) || msg; } catch {}
    }
    throw new Error(msg);
  }

  // Cancel the probe body so we don't keep the connection
  try { await probe.body?.cancel(); } catch {}

  // Browser-native download: streams to disk, works for large files
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'video.mp4';
  a.rel = 'noopener';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

    loading: false,
    categories: (cached.state?.categories || []).slice(),

}

/** Search inside the currently open network feed (loads more pages until enough matches). */
async function searchInsideNetwork(net, query) {
  const key = activeTab;
  const token = ++networkSearchToken;
  networkFilter = query ? { url: net.url, q: query } : null;
  let shown = applyNetworkFilter(key);
  if (!query) { setStatus("Ready", false); return; }
  setStatus(`Searching ${net.name} for "${query}"…`, true);

  // Search only the currently opened network feed. Stop when we have enough
  // matches, when pagination is exhausted, or when pages stop producing new cards.
  // This is deliberately bounded so a broken/guessed pagination URL cannot run forever.
  const MAX_NETWORK_SEARCH_PAGES = 10;
  let guard = 0;
  let previousCardCount = key && results.querySelector(`.feed[data-site="${CSS.escape(key)}"]`)
    ? results.querySelectorAll(`.feed[data-site="${CSS.escape(key)}"] .card`).length : 0;

  while (activeTab === key && token === networkSearchToken && shown < 24 && guard++ < MAX_NETWORK_SEARCH_PAGES) {
    const st = ensureState(key);
    if (st.exhausted || !st.next_page) break;
    const beforePage = st.page_num;
    await loadNextPageForSite(key);
    if (activeTab !== key || token !== networkSearchToken) return;
    shown = applyNetworkFilter(key);

    const feed = results.querySelector(`.feed[data-site="${CSS.escape(key)}"]`);
    const currentCardCount = feed ? feed.querySelectorAll('.card').length : 0;
    const advanced = st.page_num > beforePage;
    if (!advanced || currentCardCount <= previousCardCount) {
      // No genuinely new cards arrived. Do not keep walking guessed/repeated pages.
      st.exhausted = true;
      break;
    }
    previousCardCount = currentCardCount;
  }

  if (activeTab === key && token === networkSearchToken) {
    setStatus(`${net.name} — ${shown} match${shown !== 1 ? 'es' : ''} for "${query}"`, false);
    if (shown === 0) {
      const grid = results.querySelector('.feed .videos');
      if (grid && !grid.querySelector('.net-empty')) {
        const d = document.createElement('div');
        d.className = 'net-empty';
        d.style.cssText = 'grid-column:1/-1;padding:2rem;text-align:center;color:#7a8aaa;';
        d.textContent = `No videos matching "${query}" in ${net.name}.`;
        grid.insertBefore(d, grid.firstChild);
      }
    }
  }
}

    for (const src of COMBINED_CATEGORY_SOURCES) {
      const next = st.nextBySource[src.id];
      if (next) jobs.push({ sourceId: src.id, url: next });
    }
  } else if (st.next_page) {
    jobs.push({
      sourceId: isFpKind(kind) ? 'fullporno' : (st.sourceId || 'combined'),
      url: st.next_page,
    });
  }
  if (!jobs.length) {
    st.exhausted = true;
    return;
  }

  st.loading = true;
  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more categories…</div>`;
  grid.insertBefore(loader, slot);

  const nextPageNum = (st.page_num || 1) + 1;
  const existing = new Set((st.categories || []).map(c => (c.link || '').split('?')[0]));
  const uniqueNew = [];
  let anyNext = false;

  try {
    await Promise.all(jobs.map(async (job) => {
      try {
        const res = await fetch('/api/scrape-categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: job.url }),
        });
        if (!res.ok) {
          if (st.nextBySource) st.nextBySource[job.sourceId] = '';
          return;
        }
        const data = await res.json();
        if (data.error) {
          if (st.nextBySource) st.nextBySource[job.sourceId] = '';
          return;
        }
        for (const c of (data.categories || [])) {
          const key = (c.link || '').split('?')[0];
          if (!key || existing.has(key)) continue;
          existing.add(key);
          uniqueNew.push({
            ...c,
            sourceId: c.sourceId || job.sourceId || (isFpKind(kind) ? 'fullporno' : job.sourceId),
          });
        }
        const nxt = data.next_page || guessNextUrl(job.url, nextPageNum + 1) || '';
        if (st.nextBySource) {
          st.nextBySource[job.sourceId] = nxt;
        }
        if (nxt) anyNext = true;
        else if (st.nextBySource) st.nextBySource[job.sourceId] = '';
      } catch {
        if (st.nextBySource) st.nextBySource[job.sourceId] = '';
      }
    }));

    if (!uniqueNew.length) {
      st.emptyCount = (st.emptyCount || 0) + 1;
      loader.innerHTML = `<div style="opacity:.6;">No more categories</div>`;
      setTimeout(() => loader.remove(), 1200);
      // Update next pointers
      if (st.nextBySource) {
        anyNext = Object.values(st.nextBySource).some(Boolean);
        st.next_page = Object.values(st.nextBySource).find(Boolean) || '';
      } else {
        st.next_page = '';
      }
      if (st.emptyCount >= 3 || !anyNext) st.exhausted = true;
      else {
        st.page_num = nextPageNum;
        scheduleCategoryRecheck();
      }
      return;
    }

    st.emptyCount = 0;
    st.retryCount = 0;
    loader.remove();

    // Append cards (same pattern as video infinite scroll)
    st.categories = (st.categories || []).concat(uniqueNew);
    if (!isFpKind(kind)) sortCategoriesAZ(st.categories);
    if (st === categoriesState) {
      refreshCategoryGridFromState();
    } else {
      const temp = document.createElement('div');
      temp.innerHTML = uniqueNew.map(categoryCardHtml).join('');
      while (temp.firstElementChild) {
        grid.insertBefore(temp.firstElementChild, slot);
      }
      bindCategoryCards();
    }

    // Respect active source / name filters
    if (!isFpKind(kind)) {
      applyCategorySourceFilter(st.filterSource || 'all');
    } else {
      const countBadge = feed.querySelector('.count-badge');
      if (countBadge) {
        const n = st.categories.length;
        const nn = kind === 'porntags' ? 'tag' : 'site';
        countBadge.textContent = `🗂️ ${n} ${nn}${n !== 1 ? 's' : ''}`;
      }
    }

    st.page_num = nextPageNum;
    if (st.nextBySource) {
      anyNext = Object.values(st.nextBySource).some(Boolean);
      st.next_page = Object.values(st.nextBySource).find(Boolean) || '';
    } else {
      st.next_page = anyNext ? st.next_page : '';
    }
    if (!anyNext && !st.next_page) st.exhausted = true;

    saveCategoryCache(cacheKeyOfKind(kind));
    scheduleCategoryRecheck();
  } catch (err) {
    st.retryCount = (st.retryCount || 0) + 1;
    loader.innerHTML = `<div style="color:#f87171;">Retrying… (${st.retryCount}/4)</div>`;
    if (st.retryCount >= 4) {
      loader.innerHTML = `<div style="color:#f87171;">Failed to load more categories</div>`;
      setTimeout(() => loader.remove(), 2000);
      st.exhausted = true;
    } else {
      loader.remove();
      const backoff = Math.min(8000, 800 * Math.pow(2, st.retryCount - 1));
      setTimeout(() => {
        if (isListTab(activeTab)) scheduleCategoryRecheck();
      }, backoff);
    }
  } finally {
    st.loading = false;
  }
}

function scheduleCategoryRecheck() {
  setTimeout(() => {
    if (!isListTab(activeTab)) return;
    // Don't auto-load while a name search filter is showing a subset
    if ((categoriesState.nameQuery || '').trim()) return;
    if (categoriesState.loading || categoriesState.exhausted) return;
    const s = results.querySelector(`.sentinel[data-site="${CSS.escape(activeTab)}"]`);
    if (!s) return;
    const rect = s.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (rect.top - vh < 280) loadNextCategoriesPage();
  }, 120);
}

/* --------------------------------------------------------------
   SEARCH INFINITE SCROLL
   Each site keeps its own page cursor (searchState.pages). One scroll
   step fetches the next page from every site that still has one, in
   parallel, dedupes, shuffles that batch and appends it to the grid.
-------------------------------------------------------------- */
function mixStateFor(tabKey) {
  return tabKey === SEARCH_TAB ? searchState : mixStates.get(tabKey.slice(MIX_PREFIX.length));
}
function mixScope(ss) { return ss.filter ? ss.groups.filter(g => g.feedId === ss.filter) : ss.groups; }
function feedItemCount(ss, feedId) {
  return ss.groups.filter(g => g.feedId === feedId).reduce((n, g) => n + g.items.length, 0);
}
function applyMixFilter(grid, ss) {
  if (!ss) return;
  grid.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('filtered-out', !!ss.filter && c.getAttribute('data-feed') !== ss.filter));
}
function applySearchFilter(grid) { applyMixFilter(grid, searchState); }

function updateMixHeader(feed, ss) {
  if (!ss || !feed) return;
  const flt = ss.filter || null;
  feed.querySelectorAll('.chip-btn').forEach(chip => {
    const key = chip.getAttribute('data-chip') || null;
    chip.classList.toggle('active', key === flt);
    chip.classList.toggle('dim', !!flt && key !== flt);
    if (key === null) chip.textContent = `All · ${ss.items.length}`;
    else {
      const n = feedItemCount(ss, key);
      const failed = !n && ss.groups.filter(g => g.feedId === key).every(g => g.error);
      chip.textContent = `${getFeed(key).name} · ${n}${failed ? ' ⚠' : ''}`;
    }
  });
  const shown = flt ? feedItemCount(ss, flt) : ss.items.length;
  const cb = feed.querySelector('.count-badge');
  if (cb) cb.textContent = `🎬 ${shown} ${ss.noun}${shown !== 1 ? 's' : ''}`;
}

/** Filter chips (All / General Porn / BDSM). ss = null while the first load is still running. */
function mixChipsHtml(ss) {
  const flt = ss ? (ss.filter || null) : homeFilter;
  const all = `<span data-chip="" class="chip-btn ${!flt ? 'active' : 'dim'}" title="Show everything">All${ss ? ' · ' + ss.items.length : ''}</span>`;
  return all + FEEDS.map(f => {
    const n = ss ? feedItemCount(ss, f.id) : null;
    const fg = ss ? ss.groups.filter(g => g.feedId === f.id) : [];
    const failed = ss && !n && fg.length && fg.every(g => g.error);
    const state = flt === f.id ? 'active' : (flt ? 'dim' : '');
    return `<span data-chip="${f.id}" class="chip-btn ${failed ? 'chip-err' : 'chip-' + f.id} ${state}" title="Show only ${escapeHtml(f.name)}">${escapeHtml(f.name)}${n !== null ? ' · ' + n : ''}${failed ? ' ⚠' : ''}</span>`;
  }).join('');
}
function bindChips() {
  results.querySelectorAll('.chip-btn').forEach(chip => {
    chip.addEventListener('click', () => setMixFilter(chip.getAttribute('data-chip') || null));
  });
}

/** One filter for the whole page: home feed and search both obey it. */
function setMixFilter(feedKey) {
  homeFilter = (feedKey && homeFilter !== feedKey) ? feedKey : null;   // click again = clear
  const home = mixStates.get(ALL_FEED.id);
  if (home) home.filter = homeFilter;

  const inSearch = activeTab === SEARCH_TAB && !!searchState;
  if (inSearch) {
    // Search was run for a narrower scope than the new filter -> search again with the new scope.
    if (searchState.scope && searchState.scope !== homeFilter) {
      if (busy) return;
      searchInput.value = searchState.query;
      runSearch({ global: true, skipPush: true });
      return;
    }

  results.querySelectorAll('.chip-btn').forEach(chip => {
    const key = chip.getAttribute('data-chip') || null;
    chip.classList.toggle('active', key === homeFilter);
    chip.classList.toggle('dim', !!homeFilter && key !== homeFilter);
  });

  const tabKey = inSearch ? SEARCH_TAB : mixKey(ALL_FEED.id);
  const ss = inSearch ? searchState : home;
  const feed = results.querySelector(`.feed[data-site="${tabKey}"]`);
  const grid = feed && feed.querySelector('.videos');
  if (!ss || !grid) return;
  applyMixFilter(grid, ss);
  updateMixHeader(feed, ss);

  window.scrollTo({ top: 0, behavior: 'smooth' });
  scheduleMixRecheck(tabKey);
}

function scheduleMixRecheck(tabKey) {

/** Infinite scroll for any mixed feed (search results or the General main feed). */
async function loadMoreMixed(tabKey) {
  const ss = mixStateFor(tabKey);
  if (!ss || activeTab !== tabKey || ss.loading) return;
  const feed = results.querySelector(`.feed[data-site="${tabKey}"]`);
  const grid = feed && feed.querySelector('.videos');
  if (!grid) return;

  const hasMore = g => { const st = ss.pages.get(g.site); return st && !st.exhausted && st.next_page; };
  const active = mixScope(ss).filter(hasMore);
  if (!active.length) { showMixEnd(grid); return; }

  ss.loading = true;
  const slot = grid.querySelector('.loading-row-slot');
  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more…</div>`;
  grid.insertBefore(loader, slot);

  const settled = await Promise.allSettled(active.map(g => {
    const st = ss.pages.get(g.site);
    return fetchNextWithRetry(st.next_page, (st.page_num || 1) + 1);
  }));

  if (mixStateFor(tabKey) !== ss) { ss.loading = false; return; }   // superseded

  const batch = [];
  let retryLater = false;
  settled.forEach((r, i) => {
    const g = active[i];
    const st = ss.pages.get(g.site);
    const nextNum = (st.page_num || 1) + 1;
    if (r.status === 'rejected') {
      st.retryCount++;
      if (st.retryCount >= MAX_RETRY) st.exhausted = true; else retryLater = true;
      return;
    }
    st.retryCount = 0;
    const data = r.value;
    const fresh = [];
    ((data && data.items) || []).forEach(it => {
      const key = (it.link || '').split('?')[0];
      if (!key || ss.seen.has(key)) return;
      ss.seen.add(key);
      fresh.push({ ...it, _host: hostOf(g.site), _label: g.label, _sourceId: g.feedId, _feed: g.feedId });
    });
    if (!fresh.length) {
      st.emptyCount++;
      if (st.emptyCount >= MAX_EMPTY || !(data && data.next_page)) st.exhausted = true;
    } else {
      st.emptyCount = 0;
      g.items.push(...fresh);
      batch.push(...fresh);
    }
    st.page_num = nextNum;
    st.next_page = (data && data.next_page) || guessNextUrl(st.next_page, nextNum + 1) || '';
    if (!st.next_page) st.exhausted = true;
  });

  loader.remove();
  ss.loading = false;

  if (batch.length) {
    const mixed = shuffleArray(batch);
    ss.items.push(...mixed);
    const temp = document.createElement('div');
    temp.innerHTML = mixed.map((it, i) => cardHtml(it, `m-${ss.items.length}-${i}`)).join('');
    while (temp.firstElementChild) grid.insertBefore(temp.firstElementChild, slot);
    grid.querySelectorAll('.card').forEach(bindCard);
    resolveAllThumbs();
    applyMixFilter(grid, ss);
    updateMixHeader(feed, ss);
    setStatus(tabKey === SEARCH_TAB
      ? `Search — ${ss.items.length} results`
      : `${getFeed(ss.feedId).name} — ${ss.items.length} previews`, false);
  }

  if (!mixScope(ss).some(hasMore)) { showMixEnd(grid); return; }
  if (retryLater && !batch.length) {
    setTimeout(() => { if (mixStateFor(tabKey) === ss && activeTab === tabKey) loadMoreMixed(tabKey); }, 1500);
  } else {
    scheduleMixRecheck(tabKey);
  }
}

function showMixEnd(grid) {
  if (grid.querySelector('.search-end')) return;
  const el = document.createElement('div');
  el.className = 'loading-row search-end';
  el.innerHTML = `<div style="opacity:.6;">🏁 End of results</div>`;
  grid.insertBefore(el, grid.querySelector('.loading-row-slot'));
}

      body: JSON.stringify({ urls: srcs.map(x => x.url), download: false }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const raw = json.results || [];

    const seen = new Set();
    const pages = new Map();
    const groups = srcs.map((src, i) => {
      const data = raw[i] || {};
      const site = data.page || src.url;
      src.url = site;
      const sf = feedOfSource(src.id);    // General or BDSM -> drives the label + filter chip
      const items = [];
      (data.items || []).forEach(it => {
        const k = (it.link || '').split('?')[0];
        if (!k || seen.has(k)) return;
        seen.add(k);
        items.push({ ...it, _host: hostOf(site), _feed: sf.id, _label: sf.name, _sourceId: sf.id });
      });
      pages.set(site, {
        next_page: items.length ? (data.next_page || guessNextUrl(site, 2) || '') : '',
        page_num: data.page_num || 1,
        exhausted: !items.length || !data.next_page,
        emptyCount: 0, retryCount: 0,
      });
      return { site, name: src.name, sourceId: src.id, feedId: sf.id, label: sf.name, error: data.error, items };
    });
    const merged = groups.flatMap(g => g.items);
    mixStates.set(feedId, {
      feedId, groups, pages, seen, loading: false, filter: homeFilter, noun: 'preview',
      items: shuffleArray(merged),
    });
    renderMixedFeed(feedId);
    if (!skipPush) replaceNav({ view: 'feed', feedId, feedUrl: key });
    setStatus(`${feed.name} — ${merged.length} previews`, false);
  } catch (err) {
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus(`${feed.name} load error`, false);
  } finally {
    busy = false;
  }
}

async function switchFeed(feedId) {
  const feed = getFeed(feedId);
  if (feedId === activeFeedId && activeTab && activeTab !== SEARCH_TAB && activeTab !== CATEGORIES_TAB) {
    // exact match only: a network/category feed on the same website is NOT "home"
    const isHome = activeTab === mixKey(feedId) || SOURCES.some(x =>
      feed.siteIds.includes(x.id) && x.url === activeTab);
    if (isHome) return;
  }
  networkSearchToken++;          // stop any running network search
  networkFilter = null;
  if (searchInput) searchInput.value = '';
  if (activeTab === CATEGORIES_TAB) saveCategoryCache(COMBINED_CAT_CACHE_KEY);
  if (activeTab === PORN_SITES_TAB) saveCategoryCache(PORN_SITES_CACHE_KEY);
  if (activeTab === PORN_TAGS_TAB) saveCategoryCache(PORN_TAGS_CACHE_KEY);
  activeFeedId = feedId;
  activeSourceId = feed.siteIds[0];
  renderSiteTabs();
  unloadAllCardMedia();
  resetMainPlayer();
  if (mainPlayer) mainPlayer.classList.remove('active');
  await loadFeed(feedId, { skipPush: true });
  pushNav({ view: 'feed', feedId, sourceId: activeSourceId, feedUrl: activeTab });
}

/** Fisher–Yates shuffle (returns a new array). */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function bindCard(card) {
  if (card._hoverBound) return;
  card._hoverBound = true;
  // Skip pure category tiles (no video hover)
  if (card.classList.contains('category-card')) return;
  const thumb = card.querySelector('.thumb');
  const video = card.querySelector('video');
  if (!thumb || !video) return;

  card.addEventListener('mouseenter', () => {
    // Only one hover stream at a time
    document.querySelectorAll('.card').forEach(other => {
      if (other !== card && other._mediaAttached) unloadCardMedia(other);
    });
    attachHoverMedia(card).then(() => {
      if (!card.matches(':hover')) {
        // Left before resolve finished
        unloadCardMedia(card);
        return;
      }
      video.play().catch(() => {});
    });
  });
  card.addEventListener('mouseleave', () => {
    unloadCardMedia(card);
  });
}

async function attachHoverMedia(card) {
  if (card._mediaAttached) return;
  const detail = card.getAttribute('data-detail');
  if (!detail) return;
  const thumb = card.querySelector('.thumb');
  const video = card.querySelector('video');
  const img = card.querySelector('img[data-detail]');
  if (!thumb || !video) return;

  thumb.classList.add('loading-media');

  let json = previewCache.get(detail);
  if (!json) {
    try {
      const res = await fetch('/api/resolve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: detail }),
      });
      if (!res.ok) {
        thumb.classList.remove('loading-media');
        return;
      }
      json = await res.json();
      if (json && !json.error) previewCache.set(detail, {
        thumbnail: json.thumbnail,
        video: json.video,
        unavailable: !!json.unavailable,
      });
      else {
        thumb.classList.remove('loading-media');
        return;
      }
    } catch {
      thumb.classList.remove('loading-media');
      return;
    }
  }

  if (!card.matches(':hover')) {
    thumb.classList.remove('loading-media');
    return;
  }

  if (json.thumbnail && img) {
    img.src = json.thumbnail;
    img.style.opacity = 1;
    img.setAttribute('data-poster', json.thumbnail);
  }
  if (!json.video || !json.video.src) {
    thumb.classList.remove('loading-media');
    return;
  }

  const poster = json.thumbnail || (img && img.getAttribute('data-poster')) || '';
  if (poster) video.poster = poster;

  const src = json.video.src;
  const type = json.video.type;
  const playSrc = (type === 'hls') ? src : proxiedMediaUrl(src, detail);

  if (card._hls) {
    try { card._hls.destroy(); } catch {}
    card._hls = null;
  }

  const markReady = () => {
    thumb.classList.remove('loading-media');
    thumb.classList.add('video-ready');
    card._mediaAttached = true;
  };

  if (type === 'hls' && window.Hls && window.Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 10,
      maxMaxBufferLength: 20,
    });
    hls.loadSource(playSrc);
    hls.attachMedia(video);
    card._hls = hls;
    hlsInstances.push(hls);
    hls.on(Hls.Events.MANIFEST_PARSED, markReady);
  } else {
    video.preload = 'metadata';
    video.src = playSrc;
    video.addEventListener('loadeddata', markReady, { once: true });
    video.addEventListener('error', () => {
      thumb.classList.remove('loading-media');
    }, { once: true });
  }
}

function attachHoverPlay() {
  // Hover previews are bound per card; clicks are handled ONCE by the delegated listener
  // below, so cards appended later (infinite scroll / network search) also open the player.
  document.querySelectorAll('.card').forEach(bindCard);
}

/** One click handler for every video card, including cards added after the page rendered. */
results.addEventListener('click', (e) => {
  const card = e.target.closest('a.card');
  if (!card || !results.contains(card)) return;
  if (card.classList.contains('category-card')) return;   // category tiles have their own handler
  e.preventDefault();                                     // never let href="#" navigate
  const dl = e.target.closest('.dl-btn');
  if (dl) {
    e.stopPropagation();
    const detail = dl.getAttribute('data-detail') || card.getAttribute('data-detail');
    const title = dl.getAttribute('data-title') || card.getAttribute('data-title') || 'Video';
    downloadFromDetail(detail, title, dl);
    return;
  }
  // A result click means the user is done searching; cancel the network search loop so
  // background pagination cannot re-render the feed while playback is starting.
  if (networkSearchToken) networkSearchToken++;
  unloadAllCardMedia();
  const detail = card.getAttribute('data-detail');
  const title = card.getAttribute('data-title') || 'Video';
  if (detail) playInMainPlayer(detail, title);
});

const mainPlayer = document.getElementById('mainPlayer');
const mainVideo = document.getElementById('mainVideo');
const mainPlayerTitle = document.getElementById('mainPlayerTitle');
const mainPlayerStatus = document.getElementById('mainPlayerStatus');
const mainPlayerClose = document.getElementById('mainPlayerClose');
const mainPlayerDownload = document.getElementById('mainPlayerDownload');
let mainHls = null;
let mainDownloadInfo = null; // { src, type, detail, title }

function setMainDownloadReady(info) {
  mainDownloadInfo = info || null;
  if (!mainPlayerDownload) return;
  if (info && info.src && info.type !== 'hls') {
    mainPlayerDownload.disabled = false;
    mainPlayerDownload.classList.add('ready');
    mainPlayerDownload.title = 'Download video file';
  } else {
    mainPlayerDownload.disabled = true;
    mainPlayerDownload.classList.remove('ready');
    mainPlayerDownload.title = info && info.type === 'hls'
      ? 'HLS streams cannot be downloaded as a single file'
      : 'Resolve a video first';
  }
}

function resetMainPlayer() {
  try { mainVideo.pause(); } catch {}
  if (mainHls) { try { mainHls.destroy(); } catch {} mainHls = null; }
  try {
    mainVideo.removeAttribute('src');
    mainVideo.querySelectorAll('source').forEach(s => s.remove());
    mainVideo.removeAttribute('poster');
    mainVideo.load(); // aborts in-flight media requests
  } catch {}
  setMainDownloadReady(null);
}

function showMainPlayerStatus(text, { error = false, loading = true } = {}) {
  if (!mainPlayerStatus) return;
  const textEl = mainPlayerStatus.querySelector('.player-status-text');
  const spin = mainPlayerStatus.querySelector('.player-spinner');
  mainPlayerStatus.classList.toggle('is-error', !!error);
  mainPlayerStatus.classList.toggle('is-loading', !!loading && !error);
  // Loading: spinner only, no text. Errors: text only.
  if (spin) spin.style.display = error ? 'none' : '';
  if (textEl) {
    textEl.textContent = error ? (text || 'Playback failed') : '';
  }
  mainPlayerStatus.classList.remove('hidden');
}

function hideMainPlayerStatus() {
  if (mainPlayerStatus) mainPlayerStatus.classList.add('hidden');
}

async function playInMainPlayer(detail, title, opts = {}) {
  const scrollBefore = window.scrollY;   // read before the player opens / page scrolls
  mainPlayer.classList.add('active');
  mainPlayerTitle.textContent = title;
  resetMainPlayer();
  showMainPlayerStatus('', { loading: true });

  if (!opts.skipPush) {
    // Remember exactly where the user was in the current results page so that closing the
    // video returns to the same page at the same scroll position.
    const under = currentNavState(true);
    try { history.replaceState({ ...under, scrollY: scrollBefore, ts: Date.now() }, '', ''); } catch {}
    pushNav({
      ...under,
      view: 'player',
      detail,
      title,
      returnView: under.view,
      scrollY: scrollBefore,
    });
  }
  mainPlayer.scrollIntoView({ behavior:'smooth', block:'start' });

  try {
    const res = await fetch('/api/resolve-full', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      cache:'no-store',
      body:JSON.stringify({url:detail})
    });
    if (!res.ok) throw new Error(`Resolve failed (${res.status})`);

    const json = await res.json();
    if (json.error) throw new Error(json.error);
    if (!json.video || !json.video.src) {
      throw new Error('No playable media URL was found on the detail page.');
    }

    const src = json.video.src;
    const type = json.video.type;
    if (json.thumbnail) mainVideo.poster = json.thumbnail;

    setMainDownloadReady({ src, type, detail, title });

    // HLS manifests need segment URLs left intact — play direct.
    // Progressive MP4/WebM go through the proxy so Referer-protected CDNs work.
    const playSrc = (type === 'hls') ? src : proxiedMediaUrl(src, detail);

    showMainPlayerStatus('', { loading: true });

    if (type === 'hls') {
      if (!window.Hls || !Hls.isSupported()) {
        if (mainVideo.canPlayType('application/vnd.apple.mpegurl')) {
          mainVideo.addEventListener('loadeddata', () => {
            hideMainPlayerStatus();
            mainVideo.play().catch(() => {});
          }, { once:true });
          mainVideo.addEventListener('error', () => {
            showMainPlayerStatus('The HLS stream was found, but this browser could not play it.', { error: true });
          }, { once:true });
          mainVideo.src = playSrc;
        } else {
          throw new Error('HLS was found, but this browser has no HLS support.');
        }
      } else {
        mainHls = new Hls({ enableWorker:true, lowLatencyMode:false });
        mainHls.on(Hls.Events.MANIFEST_PARSED, () => {
          hideMainPlayerStatus();
          mainVideo.play().catch(() => {});
        });
        mainHls.on(Hls.Events.ERROR, (_event, data) => {
          if (data && data.fatal) {
            showMainPlayerStatus(`HLS playback failed: ${data.details || 'fatal stream error'}`, { error: true });
          }
        });
        mainHls.loadSource(playSrc);
        mainHls.attachMedia(mainVideo);
      }
      return;
    }

    mainVideo.addEventListener('loadeddata', () => {
      hideMainPlayerStatus();
      mainVideo.play().catch(() => {});
    }, { once:true });
    mainVideo.addEventListener('canplay', () => {
      hideMainPlayerStatus();
    }, { once:true });
    mainVideo.addEventListener('error', async () => {
      const code = mainVideo.error?.code;
      const detailMsg = code ? ` (media error ${code})` : '';
      let extra = '';
      try {
        const probe = await fetch(playSrc, { method: 'GET', headers: { Range: 'bytes=0-1' }, cache: 'no-store' });
        const ct = probe.headers.get('content-type') || '';
        if (!probe.ok) {
          let body = '';
          try { body = (await probe.text()).slice(0, 120); } catch {}
          extra = ` Proxy/CDN HTTP ${probe.status}${body ? ': ' + body : ''}`;
        } else if (ct && !/video|octet|mp4|webm/i.test(ct)) {
          extra = ` Unexpected Content-Type: ${ct}`;
        }
      } catch (probeErr) {
        extra = ` (${probeErr.message || 'network probe failed'})`;
      }
      if (playSrc.includes('/api/stream') && src && src !== playSrc) {
        showMainPlayerStatus('', { loading: true });
        mainVideo.src = src;
        mainVideo.load();
        return;
      }
      showMainPlayerStatus(`Could not play media${detailMsg}.${extra}`, { error: true });
    }, { once:true });
    mainVideo.src = playSrc;
    mainVideo.load();
  } catch (err) {
    showMainPlayerStatus(err?.message || 'Unable to resolve this video.', { error: true });
  }
}

mainPlayerClose.addEventListener('click', () => {
  // Prefer browser Back so history stays consistent
  if (history.state && history.state.view === 'player') {
    history.back();
    return;
  }
  resetMainPlayer();
  mainPlayer.classList.remove('active');
  unloadAllCardMedia();
});

if (mainPlayerDownload) {
  mainPlayerDownload.addEventListener('click', async () => {
    if (!mainDownloadInfo || !mainDownloadInfo.src) return;
    if (mainDownloadInfo.type === 'hls') {
      alert('HLS streams cannot be downloaded as a single file from this UI.');
      return;
    }
    const btn = mainPlayerDownload;
    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Downloading…';
    try {
      const fname = safeFilename(mainDownloadInfo.title, mainDownloadInfo.type);
      const dlUrl = proxiedMediaUrl(mainDownloadInfo.src, mainDownloadInfo.detail, {
        download: true,
        filename: fname,
      });
      await triggerDownload(dlUrl, fname);
    } catch (err) {
      alert(err?.message || 'Download failed');
    } finally {
      btn.textContent = prev;
      btn.disabled = false;
      setMainDownloadReady(mainDownloadInfo);
    }
  });
}

/**
 * Visible-card posters only. Never attaches video streams here —
 * streams start on hover and stop on mouseleave.
 */
let thumbObserver = null;
function resolveAllThumbs() {
  if (!thumbObserver) {
    thumbObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const img = entry.target;
        thumbObserver.unobserve(img);
        upgradeThumbnail(img);
      });
    }, { rootMargin: '150px 0px', threshold: 0.01 });
  }
  document.querySelectorAll('img[data-detail]').forEach(img => {
    if (img._thumbObserved) return;
    img._thumbObserved = true;
    thumbObserver.observe(img);
  });
}

async function upgradeThumbnail(img) {
  const detail = img.getAttribute('data-detail');
  if (!detail || img._thumbUpgraded) return;
  const cached = previewCache.get(detail);
  if (cached?.thumbnail) {
    img.src = cached.thumbnail;
    img.style.opacity = 1;
    img.setAttribute('data-poster', cached.thumbnail);
    img._thumbUpgraded = true;
    return;
  }
  // Keep the scraper-provided poster if it is already a real URL
  const cur = img.getAttribute('src') || '';
  if (cur.startsWith('http')) {
    img._thumbUpgraded = true;
    return;
  }
  try {
    const res = await fetch('/api/resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: detail }),
    });
    if (!res.ok) return;
    const json = await res.json();
    if (json?.thumbnail) {
      img.src = json.thumbnail;
      img.style.opacity = 1;
      img.setAttribute('data-poster', json.thumbnail);
      previewCache.set(detail, { thumbnail: json.thumbnail, video: json.video, unavailable: !!json.unavailable });
    }
    img._thumbUpgraded = true;
  } catch { /* keep existing */ }
}

let sentinelObserver = null;
function observeSentinel(siteUrl) {
  if (!sentinelObserver) {
    sentinelObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const url = entry.target.getAttribute('data-site');
        if (url && url === activeTab) loadNextPageForSite(url);
      });
    }, { rootMargin: '250px 0px', threshold: 0 });
  }
  document.querySelectorAll('.sentinel').forEach(s => sentinelObserver.observe(s));
}

const MAX_EMPTY = 3;
const MAX_RETRY = 4;

function ensureState(siteUrl) {
  if (!siteState.has(siteUrl)) {
    siteState.set(siteUrl, {
      next_page: null, page_num: 1, loading: false, exhausted: false,
      emptyCount: 0, retryCount: 0, error: false,
    });
  }
  return siteState.get(siteUrl);
}

async function loadNextPageForSite(siteUrl) {
  if (siteUrl !== activeTab) return;
  if (siteUrl === SEARCH_TAB) return loadMoreSearch();
  if (siteUrl.startsWith(MIX_PREFIX)) return loadMoreMixed(siteUrl);
  const st = ensureState(siteUrl);
  if (st.loading || st.exhausted) return;

  const feed = results.querySelector(`.feed[data-site="${CSS.escape(siteUrl)}"]`);
  if (!feed) return;
  const grid = feed.querySelector('.videos');
  const slot = grid.querySelector('.loading-row-slot');
  const nextUrl = st.next_page;
  if (!nextUrl) { st.exhausted = true; return; }

  st.loading = true;

  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more previews…</div>`;
  grid.insertBefore(loader, slot);

  const nextPageNum = (st.page_num || 1) + 1;

  try {
    const data = await fetchNextWithRetry(nextUrl, nextPageNum);
    if (!data || !data.items || !data.items.length) {
      st.emptyCount++;
      loader.innerHTML = `<div style="opacity:.6;">No more previews</div>`;
      setTimeout(() => loader.remove(), 1500);
      if (st.emptyCount >= MAX_EMPTY || !data?.next_page) st.exhausted = true;
      else { st.next_page = data.next_page || ''; st.page_num = nextPageNum; scheduleRecheck(siteUrl); }
      st.loading = false;
      return;
    }
    st.emptyCount = 0; st.retryCount = 0; st.error = false;

    const host = hostOf(siteUrl);
    const store = siteData.get(siteUrl);
    const existingLinks = new Set(
      (store?.items || []).map(it => (it.link || '').split('?')[0]).filter(Boolean)
    );
    const existingCards = new Set(
      [...grid.querySelectorAll('.card[data-detail]')].map(c => (c.getAttribute('data-detail') || '').split('?')[0]).filter(Boolean)
    );
    const freshItems = [];
    for (const it of data.items) {
      const linkKey = (it.link || '').split('?')[0];
      if (!linkKey || existingLinks.has(linkKey) || existingCards.has(linkKey)) continue;
      existingLinks.add(linkKey);
      existingCards.add(linkKey);
      freshItems.push({ ...it, _host: host });
    }

    // Some sites return the same page forever when our guessed pagination URL
    // is invalid. Treat a page with zero genuinely new links as exhaustion.
    if (!freshItems.length) {
      st.emptyCount++;
      if (st.emptyCount >= 1) st.exhausted = true;
      loader.innerHTML = `<div style="opacity:.6;">No new previews</div>`;
      setTimeout(() => loader.remove(), 900);
      st.page_num = nextPageNum;
      st.loading = false;
      return;
    }

    st.emptyCount = 0;
    const items = freshItems;
    if (store) store.items.push(...items);

    const si = Math.floor(Math.random() * 1e6);
    const temp = document.createElement('div');
    temp.innerHTML = items.map(it => cardHtml(it, si)).join('');
    while (temp.firstElementChild) grid.insertBefore(temp.firstElementChild, loader);

    grid.querySelectorAll('.card').forEach(bindCard);
    resolveAllThumbs(); // observe new posters only — no video streams
    if (networkFilter) applyNetworkFilter(siteUrl);

    const countBadge = feed.querySelector('.count-badge');
    const totalNow = grid.querySelectorAll('.card').length;
    if (countBadge) countBadge.textContent = `🎬 ${totalNow} preview${totalNow !== 1 ? 's' : ''}`;

    st.page_num = nextPageNum;
    st.next_page = data.next_page || guessNextUrl(nextUrl, nextPageNum + 1) || '';
    if (!st.next_page) st.exhausted = true;

    loader.remove();
    scheduleRecheck(siteUrl);
  } catch (err) {
    st.retryCount++;
    loader.innerHTML = `<div style="color:#f87171;">Retrying… (${st.retryCount}/${MAX_RETRY})</div>`;
    if (st.retryCount >= MAX_RETRY) {
      loader.innerHTML = `<div style="color:#f87171;">Failed to load more</div>`;
      setTimeout(() => loader.remove(), 2000);
      st.exhausted = true;
    } else {
      loader.remove();
      const backoff = Math.min(8000, 800 * Math.pow(2, st.retryCount - 1));
      setTimeout(() => { if (siteUrl === activeTab) scheduleRecheck(siteUrl); }, backoff);
    }
  } finally { st.loading = false; }
}

async function fetchNextWithRetry(nextUrl, pageNum) {
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls: [{ url: nextUrl, page_num: pageNum }], download: false })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      return (json.results || [])[0] || null;
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
    }
  }
  throw lastErr || new Error('unknown');
}

function guessNextUrl(baseUrl, pageNum) {
  try {
    const u = new URL(baseUrl);
    if (u.searchParams.has('page')) { u.searchParams.set('page', String(pageNum)); return u.toString(); }
    if (/\/page\/\d+\/?$/.test(u.pathname)) {
      u.pathname = u.pathname.replace(/\/page\/\d+\/?$/, `/page/${pageNum}/`);
      return u.toString();
    }
    if (/\/\d+\/?$/.test(u.pathname)) {
      u.pathname = u.pathname.replace(/\/\d+\/?$/, `/${pageNum}/`);
      return u.toString();
    }
    u.searchParams.set('page', String(pageNum));
    return u.toString();
  } catch { return null; }
}

function scheduleRecheck(siteUrl) {
  setTimeout(() => {
    if (siteUrl !== activeTab) return;
    const s = results.querySelector(`.sentinel[data-site="${CSS.escape(siteUrl)}"]`);
    if (!s) return;
    const rect = s.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    // Only auto-load next page when the sentinel is near the viewport
    if (rect.top - vh < 280) loadNextPageForSite(siteUrl);
  }, 120);
}

function switchTab(tabKey) {
  if (tabKey === activeTab) return;

/** Filter studio sections by name (live). Returns how many are visible. */
function applyStudioFilter() {
  const q = (studioState.nameQuery || '').trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let shown = 0, total = 0;
  results.querySelectorAll('.studio-section').forEach(sec => {
    total++;

    if (ok) shown++;

  const badge = results.querySelector(`.feed[data-site="${PORN_SITES_TAB}"] .count-badge`);
  if (badge) {
    badge.textContent = words.length
      ? `🔎 ${shown} match${shown !== 1 ? 'es' : ''} of ${total}`
      : `🗂️ ${total} site${total !== 1 ? 's' : ''}`;
  }
  let empty = results.querySelector('.studio-filter-empty');
  const list = results.querySelector('.studio-list');
  if (words.length && total && !shown) {
    if (!empty && list) {
      empty = document.createElement('div');

      empty.style.cssText = 'padding:2rem;text-align:center;color:#7a8aaa;';

      empty.style.display = '';
      empty.textContent = studioState.exhausted
        ? `No sites matching “${q}”.`
        : `No loaded sites match “${q}” — loading more…`;
    }
  } else if (empty) {
    empty.style.display = 'none';
  }
  if (words.length) setStatus(`${shown} site match${shown !== 1 ? 'es' : ''} for “${q}”`, false);
  else setStatus(`Porn Sites — ${total}`, false);
  return shown;
}

/** Keep fetching next pages while a name search is active and we need more matches. */
async function searchStudioDeeper() {
  const q = (studioState.nameQuery || '').trim();
  if (!q || activeTab !== PORN_SITES_TAB) return;
  const token = ++studioState.searchToken;
  const MAX_PAGES = 12;
  let guard = 0;
  while (
    activeTab === PORN_SITES_TAB
    && token === studioState.searchToken
    && (studioState.nameQuery || '').trim() === q
    && !studioState.exhausted
    && guard++ < MAX_PAGES
  ) {
    const shown = applyStudioFilter();
    if (shown >= 12) break;
    if (studioState.loading) {
      await new Promise(r => setTimeout(r, 200));
      continue;
    }
    if (!studioState.next_page) break;
    const before = studioState.sections.length;
    await loadNextStudioPage();
    if (token !== studioState.searchToken) return;
    if (studioState.sections.length <= before) break;
  }
  if (token === studioState.searchToken) applyStudioFilter();
}

async function loadNextStudioPage() {
  if (activeTab !== PORN_SITES_TAB) return;
  const st = studioState;
  if (st.loading || st.exhausted || !st.next_page) {
    if (!st.next_page) st.exhausted = true;
    return;
  }

  st.loading = true;
  const feed = results.querySelector(`.feed[data-site="${PORN_SITES_TAB}"]`);
  const list = feed && feed.querySelector('.studio-list');
  const slot = list && list.querySelector('.loading-row-slot');
  const loader = document.createElement('div');
  loader.className = 'loading-row';
  loader.innerHTML = `<div class="mini-spinner"></div><div>Loading more sites…</div>`;
  if (slot) list.insertBefore(loader, slot);
  else if (list) list.appendChild(loader);

  try {
    const res = await fetch('/api/scrape-categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: st.next_page, mode: 'sites' }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    const existing = new Set(st.sections.map(s => (s.link || '').split('?')[0]));
    const uniqueNew = [];
    for (const s of (json.sections || [])) {
      const key = (s.link || '').split('?')[0];
      if (!key || existing.has(key)) continue;
      existing.add(key);
      uniqueNew.push(s);
    }

    st.page_num = (st.page_num || 1) + 1;
    st.next_page = json.next_page || null;
    if (!st.next_page || !uniqueNew.length) {
      st.exhausted = !st.next_page;
      // If we got no new sections but site still claims a next page, keep trying once more
      // only when next_page changed; otherwise stop.
      if (!uniqueNew.length) st.exhausted = true;
    }

    if (uniqueNew.length) {
      st.sections.push(...uniqueNew);
      st.retryCount = 0;
      lastStudioData = {
        ...(lastStudioData || {}),
        sections: st.sections.slice(),
        next_page: st.next_page,
        page_num: st.page_num,
        count: st.sections.length,
        kind: 'pornsites',
      };
      loader.remove();
      renderStudioSections({ sections: uniqueNew, next_page: st.next_page }, true);
      if (st.nameQuery) applyStudioFilter();
      else setStatus(`Porn Sites — ${st.sections.length}`, false);
    } else {
      loader.remove();
      st.exhausted = true;
    }
  } catch (err) {
    st.retryCount = (st.retryCount || 0) + 1;
    loader.innerHTML = `<div style="color:#f87171;">Retrying… (${st.retryCount}/4)</div>`;
    if (st.retryCount >= 4) {
      loader.innerHTML = `<div style="color:#f87171;">Failed to load more sites</div>`;
      setTimeout(() => loader.remove(), 2000);
      st.exhausted = true;
    } else {
      loader.remove();
      const backoff = Math.min(8000, 800 * Math.pow(2, st.retryCount - 1));
      setTimeout(() => {
        if (activeTab === PORN_SITES_TAB) scheduleStudioRecheck();
      }, backoff);
    }
  } finally {
    st.loading = false;
  }
}

function scheduleStudioRecheck() {
  setTimeout(() => {
    if (activeTab !== PORN_SITES_TAB) return;
    if (studioState.loading || studioState.exhausted) return;
    // Active name search: keep paging until enough matches or exhausted
    if ((studioState.nameQuery || '').trim()) {
      const shown = [...results.querySelectorAll('.studio-section')]
        .filter(el => el.style.display !== 'none').length;
      if (shown < 8) { searchStudioDeeper(); return; }
    }
    const s = results.querySelector(`.sentinel[data-site="${PORN_SITES_TAB}"]`);
    if (!s) return;
    const rect = s.getBoundingClientRect();
    const vh = window.innerHeight || document.documentElement.clientHeight;
    if (rect.top - vh < 280) loadNextStudioPage();
  }, 120);
}

/** Every video of a studio goes on ONE line (as in the original layout): equal-size cards that
 *  fill the row, so the last card ends right under the "See All" button. Only if a studio has so
 *  many videos that cards would drop below the minimum width does the row scroll sideways. */
const STUDIO_MIN_CARD = 200;
function fitStudioRows() {
  document.querySelectorAll('.studio-row').forEach(row => {
    const w = row.clientWidth;
    if (!w) return;
    const gap = 12;   // .75rem
    const count = row.querySelectorAll(':scope > .card').length || 1;
    const fit = Math.max(1, Math.floor((w + gap) / (STUDIO_MIN_CARD + gap)));
    row.style.setProperty('--n', Math.min(count, fit));
  });
}
window.addEventListener('resize', fitStudioRows);

function bindCombinedCategorySearch() {
  const input = document.getElementById('categorySearchInput');
  const btn = document.getElementById('categorySearchBtn');
  if (!input) return;

  // Live local filter — updates as you type; clearing restores full list
  const runLive = () => {
    const q = (input.value || '').trim();
    categoriesState.nameQuery = q;
    applyCategoryNameFilter();
    saveCategoryCache(COMBINED_CAT_CACHE_KEY);
    if (!q) {
      // Deleted search keyword → show all categories for current menu
      refreshCategoryGridFromState();
      applyCategoryNameFilter();
      scheduleCategoryRecheck();
      setStatus(`Categories — ${(categoriesState.categories || []).length}`, false);
    }
  };

  // Full website search (finds categories not loaded yet)
  const runWebsite = () => {
    const q = (input.value || '').trim();
    categoriesState.nameQuery = q;
    if (!q) {
      runLive();
      return;
    }
    searchCategoriesByName(q);
  };

  // Re-bind every render
  btn.onclick = runWebsite;
  input.oninput = () => {
    clearTimeout(input._catTimer);
    input._catTimer = setTimeout(runLive, 120);
  };
  input.onkeydown = (e) => {

      e.preventDefault();
      clearTimeout(input._catTimer);

    if (e.key === 'Escape') {
      e.preventDefault();
      input.value = '';
      clearTimeout(input._catTimer);
      runLive();
    }
  };

  // Sync input with state
  if (categoriesState.nameQuery && input.value !== categoriesState.nameQuery) {
    input.value = categoriesState.nameQuery;
  }
}

/**
 * Search for category *tiles* by name from the live websites
 * (not only categories already loaded in the grid).
 * Stays on the Categories view — does not open video results.
 */
async function searchCategoriesByName(query) {
  if (busy) return;
  const q = (query || '').trim();
  if (!q) return;
  const qLower = q.toLowerCase();
  const slug = toSlug(q);
  const filter = categoriesState.filterSource || 'all';

  const sources = COMBINED_CATEGORY_SOURCES.filter(
    s => filter === 'all' || feedOfSource(s.id).id === filter
  );
  if (!sources.length) return;

  busy = true;
  if (categoriesBtn) categoriesBtn.disabled = true;
  setStatus(`Searching categories for “${q}”…`, true);

  // Soft loading indicator without wiping the page
  const feed = results.querySelector(`.feed[data-site="${CATEGORIES_TAB}"]`);
  let banner = feed && feed.querySelector('.cat-search-loading');
  if (feed && !banner) {
    banner = document.createElement('div');
    banner.className = 'cat-search-loading';
    banner.style.cssText = 'padding:.75rem 1.4rem;color:#9aa9c1;font-size:.85rem;border-bottom:1px solid #1e2738;';
    banner.innerHTML = `<span class="mini-spinner" style="display:inline-block;vertical-align:middle;margin-right:.5rem;"></span> Searching websites for “${escapeHtml(q)}”…`;
    const grid = feed.querySelector('.videos');
    if (grid) feed.insertBefore(banner, grid);
  }

  const found = new Map();

  try {
    // 1) Matches already loaded
    for (const c of (categoriesState.categories || [])) {
      if ((c.name || '').toLowerCase().includes(qLower)) {
        const key = (c.link || '').split('?')[0];
        if (key) found.set(key, c);
      }
    }

    // 2) Direct category URL from slug → category tile (if page has content)
    await Promise.all(sources.map(async (src) => {
      if (!slug) return;
      const url = src.feedUrl(slug);
      try {
        const res = await fetch('/api/scrape', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ urls: [url], download: false }),
        });
        if (!res.ok) return;
        const json = await res.json();
        const data = (json.results || [])[0];
        if (!data || data.error || !(data.items || []).length) return;
        const key = (data.page || url).split('?')[0];
        if (found.has(key)) return;
        found.set(key, {
          name: q.replace(/\b\w/g, ch => ch.toUpperCase()),
          link: key,
          thumbnail: (data.items[0] && data.items[0].thumbnail) || null,
          sourceId: src.id,
        });
      } catch { /* ignore */ }
    }));

    // 3) Walk category indexes on each site until matches found or pages run out
    const maxPages = 15;
    await Promise.all(sources.map(async (src) => {
      let pageUrl = src.indexUrl;
      for (let i = 0; i < maxPages && pageUrl; i++) {
        try {
          const res = await fetch('/api/scrape-categories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: pageUrl }),
          });
          if (!res.ok) break;
          const json = await res.json();
          if (json.error) break;

          for (const c of (json.categories || [])) {
            const key = (c.link || '').split('?')[0];
            if (!key) continue;
            // Always grow the master list so scroll has more to show later
            if (!(categoriesState.categories || []).some(x => (x.link || '').split('?')[0] === key)) {
              categoriesState.categories.push({ ...c, sourceId: src.id });
            }
            if ((c.name || '').toLowerCase().includes(qLower) && !found.has(key)) {
              found.set(key, { ...c, sourceId: src.id });
            }
          }

          // Track pagination for this source
          if (!categoriesState.nextBySource) categoriesState.nextBySource = {};
          categoriesState.nextBySource[src.id] = json.next_page || '';
          pageUrl = json.next_page || null;
        } catch {
          break;
        }
      }
    }));

    // Merge finds into master list
    for (const cat of found.values()) {
      const key = (cat.link || '').split('?')[0];
      if (!(categoriesState.categories || []).some(x => (x.link || '').split('?')[0] === key)) {
        categoriesState.categories.push(cat);
      }
    }

    categoriesState.next_page =
      Object.values(categoriesState.nextBySource || {}).find(Boolean) || categoriesState.next_page || '';
    categoriesState.exhausted = !categoriesState.next_page;
    categoriesState.nameQuery = q;
    categoriesState.kind = 'categories';

    // Re-render category grid, then filter to search matches
    const data = {
      categories: (categoriesState.categories || []).slice(),
      count: (categoriesState.categories || []).length,
      next_page: categoriesState.next_page,
      nextBySource: { ...(categoriesState.nextBySource || {}) },
      page_num: categoriesState.page_num || 1,
      kind: 'categories',
    };
    renderCategories(data, false, { kind: 'categories' });
    categoriesState.nameQuery = q;
    const input = document.getElementById('categorySearchInput');
    if (input) input.value = q;
    applyCategorySourceFilter(filter);
    applyCategoryNameFilter();

    setStatus(
      found.size
        ? `Categories — ${found.size} match${found.size !== 1 ? 'es' : ''} for “${q}”`
        : `No categories matching “${q}”`,
      false
    );
  } catch (err) {
    setStatus(`Category search error: ${err.message}`, false);
  } finally {
    if (banner) banner.remove();
    busy = false;
    if (categoriesBtn) categoriesBtn.disabled = false;
  }
}

/** Load (or show) the homepage feed for a source id. */
async function loadSourceFeed(sourceId, { force = false, skipPush = false } = {}) {
  const src = getSource(sourceId);
  if (!src) return;
  const label = feedOfSource(sourceId).name;

  // Already have data — just render
  if (!force && siteData.has(src.url)) {
    activeTab = src.url;
    renderFeed(src.url);
    if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: src.url });
    const n = siteData.get(src.url)?.items?.length || 0;
    setStatus(`${label} — ${n} preview${n !== 1 ? 's' : ''}`, false);
    scheduleRecheck(src.url);
    return;
  }

  // Also check resolved page keys for this source
  const existingKey = [...siteData.keys()].find(k => {
    const s = sites.find(x => x.url === k);
    return s && s.sourceId === sourceId;
  });
  if (!force && existingKey && siteData.has(existingKey)) {
    // Prefer homepage URL entry
    const homeEntry = [...siteData.keys()].find(k => hostOf(k) === hostOf(src.url));
    const key = homeEntry || existingKey;
    // Only use if it's the homepage-ish, not a deep category
    if (homeEntry) {
      activeTab = homeEntry;
      renderFeed(homeEntry);
      if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: homeEntry });
      scheduleRecheck(homeEntry);
      return;
    }
  }

  if (busy) return;
  busy = true;
  setStatus(`Loading ${label}…`, true);
  rescueSearchBar(); results.innerHTML = `<div class="loading-screen"><div class="spinner"></div>
    <div>Fetching ${escapeHtml(label)} previews…</div></div>`;

  try {
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: [src.url], download: false })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const data = (json.results || [])[0];
    if (!data) throw new Error('No data returned');

    const key = data.page || src.url;
    if (!sites.find(s => s.url === key || s.url === src.url)) {
      sites.unshift({ name: src.name, url: key, sourceId: src.id });
    } else {
      sites = sites.map(s =>
        (s.sourceId === src.id || s.url === src.url)
          ? { name: src.name, url: key, sourceId: src.id }
          : s
      );
    }
    // Keep SOURCES url aligned if server redirected
    src.url = key;

    siteData.set(key, {
      page: key,
      page_title: data.page_title,
      error: data.error,
      items: (data.items || []).map(it => ({ ...it, _host: hostOf(key) })),
    });
    siteState.set(key, {
      next_page: data.next_page || guessNextUrl(key, 2) || '',
      page_num: data.page_num || 1,
      loading: false,
      exhausted: !data.next_page,
      emptyCount: 0, retryCount: 0, error: !!data.error,
    });

    activeTab = key;
    renderFeed(key);
    if (!skipPush) replaceNav({ view: 'feed', sourceId, feedUrl: key });
    const total = data.items?.length || 0;
    setStatus(`${label} — ${total} preview${total !== 1 ? 's' : ''}`, false);
  } catch (err) {
    rescueSearchBar(); results.innerHTML = `<div class="empty">⚠️ ${escapeHtml(err.message)}</div>`;
    setStatus(`${label} load error`, false);
  } finally {
    busy = false;
  }
}
