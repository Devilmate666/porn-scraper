name = "porn-archive-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CACHE_TTL = "3600"
LEMONCAMS_PROXY = "https://r.jina.ai/http://"

[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[[kv_namespaces]]
binding = "SCRAPE_DATA"
id = "your-scrape-data-kv-id"
preview_id = "your-preview-scrape-data-kv-id"

# accounts + synced favorites (database id is injected by the deploy workflow, see .github/scripts/d1_id.sh)
[[d1_databases]]
binding = "DB"
database_name = "porn-archive-db"
database_id = "your-d1-database-id"

[observability]
enabled = true

# keeps cams fresh inside Cloudflare and starts the GitHub scraper when data is stale (see maintenance() in src/index.ts)
[triggers]
crons = ["*/15 * * * *"]
