name = "porn-archive-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CACHE_TTL = "3600"
LEMONCAMS_PROXY = "https://r.jina.ai/http://"
# the account with this username (register it yourself, right after deploying) can open /admin.html
ADMIN_USERNAME = "HISHAM"
# one account per network: how many sign-ups one network may make per window (0 = unlimited)
SIGNUP_MAX_PER_IP = "1"
SIGNUP_WINDOW_DAYS = "30"

[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[[kv_namespaces]]
binding = "SCRAPE_DATA"
id = "your-scrape-data-kv-id"
preview_id = "your-preview-scrape-data-kv-id"

# accounts + synced favorites (real id from `wrangler d1 list`; the deploy workflow also injects it)
[[d1_databases]]
binding = "DB"
database_name = "porn-archive-db"
database_id = "c8316e03-c6a6-4e7e-a81f-82de6d9bc75a"

[observability]
enabled = true

# keeps cams fresh inside Cloudflare and starts the GitHub scraper when data is stale (see maintenance() in src/index.ts)
[triggers]
crons = ["*/15 * * * *"]
