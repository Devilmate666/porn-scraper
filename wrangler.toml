name = "porn-archive-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
CACHE_TTL = "3600"

[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-namespace-id"
preview_id = "your-preview-kv-namespace-id"

[[kv_namespaces]]
binding = "SCRAPE_DATA"
id = "your-scrape-data-kv-id"
preview_id = "your-preview-scrape-data-kv-id"

[observability]
enabled = true
# Cloudflare's own scheduler (reliable, unlike GitHub cron): every 10 minutes the Worker refreshes cams itself and
# starts the GitHub scraper if channels/cams/visitor requests are stale.
[triggers]
crons = ["*/10 * * * *"]
