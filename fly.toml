# Change "app" to a globally unique name (must match FLY_APP in the GitHub workflow)
app = "porn-archive-api"
primary_region = "ams"

[build]

[env]
  # Your Pages URL(s), comma-separated. Locks the API to your frontend.
  ALLOWED_ORIGINS = "https://porn-archive.pages.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
